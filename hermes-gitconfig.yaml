apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-gitconfig
  namespace: ai-services
data:
  gitconfig: |
    [user]
    	name = Hermes
    	email = hermes@stevearnett.com
    [init]
    	defaultBranch = main
    [pull]
    	rebase = false
    [credential "https://github.com"]
        helper = !f() { test "$1" = get && echo username=x-access-token && printf 'password=%s\n' "${GITHUB_TOKEN}"; }; f