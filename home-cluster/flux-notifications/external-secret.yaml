apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-discord-webhook
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: flux-discord-webhook
  data:
    # Same 1Password item and property that the Alertmanager Discord receiver uses
    # (see home-cluster/monitoring/alertmanager-external-secret.yaml). Reusing it is
    # deliberate: it guarantees Flux failures land in the *same* channel as cluster
    # alerts. The key name must be `address` — that is the key
    # notification-controller reads the webhook URL from when a Provider uses a
    # secretRef (verified in notification-controller v1.8.2, createNotifier()).
    - secretKey: address
      remoteRef:
        key: discord-alertmanager-webhook
        property: webhook-url