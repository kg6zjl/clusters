---
# Dex, the in-cluster OIDC identity provider.
#
# Why Dex rather than a proxy in front of Headlamp: a forward-auth proxy authenticates the
# *browser*, but Headlamp still talks to the apiserver as its own ServiceAccount, so everyone
# through the gate is the same cluster-admin identity with nothing in the audit log. Dex is an
# issuer the apiserver itself trusts (see node-config/roles/node/templates/apiserver.args.j2), so
# Headlamp can present a real per-user OIDC token and Kubernetes RBAC decides what it may do.
#
# The secret-looking values below are all `$VAR` references or public identifiers. Dex expands
# $VARS in its config file, and the env vars come from Secrets synced by ESO out of 1Password.
# There is no credential material in this file -- see dex-external-secrets.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: sso
spec:
  interval: 1h
  chart:
    spec:
      chart: dex
      version: 0.25.2
      sourceRef:
        kind: HelmRepository
        name: dex
        # The sso Kustomization sets targetNamespace: sso, which rewrites every namespaced
        # resource in this directory -- the HelmRepository included -- into ns sso. Naming
        # flux-system here resolves to nothing and the release never gets its chart.
        namespace: sso
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  values:
    # Dex never calls the Kubernetes API. It only issues and validates tokens, so it gets no
    # ServiceAccount and no bindings at all -- the chart would otherwise mint a ClusterRole.
    rbac:
      create: false
    serviceAccount:
      create: false

    # Deliberately NOT pinned to a node. A pin to a control-plane node looks protective but is a
    # boot deadlock: if that node reboots, the pinned pod cannot reschedule (its nodeSelector only
    # matches the down node), so Dex stays Pending and that node's apiserver cannot fetch the OIDC
    # discovery document at startup. Left to the scheduler, the Deployment moves Dex to a healthy
    # node instead. A kubelite restart on its own keeps containers running (containerd holds them),
    # so colocation is not the hazard the pin assumed -- see PR #916/#919 for the history.
    config:
      # MUST be reachable by a browser (Headlamp redirects there) AND by the apiserver (which
      # fetches the discovery document). TLS terminates at Traefik with the cert-manager
      # Let's Encrypt wildcard, so it chains to a publicly trusted root and the apiserver needs
      # no --oidc-ca-file.
      issuer: https://sso.kube.stevearnett.com/dex

      storage:
        type: sqlite3
        config:
          file: /data/dex.db

      oauth2:
        # One IdP, one user: an approval screen is a click with no security value here.
        skipApprovalScreen: true
        # Authorization Code only. Implicit flow is deprecated and mints long-lived tokens.
        responseTypes: ["code"]

      staticClients:
        # ONE client for BOTH the apiserver and Headlamp, on purpose. Dex sets the id_token's `aud`
        # to the id of the client that requested it, and the apiserver only accepts a token whose
        # `aud` contains its own --oidc-client-id ("kubernetes"). Headlamp therefore has to present
        # this same client id: with a separate `headlamp` client it would mint aud=headlamp and the
        # apiserver would reject every per-user token. Headlamp's own Dex guide says use a single
        # client id for both. Each consumer registers its own redirectURI on this one client.
        #
        # Deliberately a PUBLIC client with no secret. `public: true` is not documentation here, it
        # is the field Dex validates: cmd/dex/serve.go rejects any static client with no secret, no
        # secretEnv and public != true ("invalid config: Secret or SecretEnv field is required for
        # client"), which crash-looped the pod on its very first start after the chart resolved.
        #
        # No shared secret: kubectl never sends one, and Headlamp sends a PKCE code_challenge
        # (`-oidc-use-pkce=true`), so the authorization code is useless without the verifier that
        # only the client which started the flow holds. Net effect: no credential to create, rotate
        # or leak, with no loss of security.
        - id: kubernetes
          name: Kubernetes API and Headlamp
          public: true
          redirectURIs:
            # kubectl and other CLI OIDC clients use the out-of-band flow.
            - urn:ietf:wg:oauth:2.0:oob
            # Headlamp's web callback; must match -oidc-callback-url exactly.
            - https://headlamp.kube.stevearnett.com/oidc-callback

      connectors:
        - type: google
          id: google
          name: Google
          config:
            clientID: $DEX_GOOGLE_CLIENT_ID
            # The field is `clientSecret`, not `secret`. A wrong key here is silently ignored by
            # the connector, so login would fail with an empty credential rather than a clear error.
            clientSecret: $DEX_GOOGLE_CLIENT_SECRET
            # Dex appends /callback to the issuer path. This must match the redirect URI
            # registered on the Google OAuth client exactly.
            redirectURI: https://sso.kube.stevearnett.com/dex/callback

    # Rendered as raw container env, so these can use valueFrom rather than literal values.
    envVars:
      - name: DEX_GOOGLE_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: dex-google-connector
            key: DEX_GOOGLE_CLIENT_ID
      - name: DEX_GOOGLE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: dex-google-connector
            key: DEX_GOOGLE_CLIENT_SECRET

    # sqlite3 needs a writable /data. emptyDir rather than a PVC: the only things Dex persists
    # are in-flight auth codes and refresh tokens, and losing them on restart just means the user
    # signs in again. A PVC here would be state to back up for no benefit.
    volumes:
      - name: data
        emptyDir: {}
    volumeMounts:
      - name: data
        mountPath: /data

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
