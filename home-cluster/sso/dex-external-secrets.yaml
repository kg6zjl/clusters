---
# Google connector credentials, reusing the client that the previous oauth2-proxy attempt used
# (1Password `home-cluster` vault). `oauth2-proxy-cookie-secret` is intentionally NOT referenced --
# it signed oauth2-proxy session cookies, which no longer exist after #818 removed that stack.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-google-connector
  namespace: sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dex-google-connector
  data:
    - secretKey: DEX_GOOGLE_CLIENT_ID
      remoteRef:
        key: oauth2-proxy-client-id
        property: password
    - secretKey: DEX_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: oauth2-proxy-client-secret
        property: password
---
# Dex's static client secret for Headlamp. Dex requires a secret on static clients unless PKCE is
# used, and this repo keeps secrets in 1Password rather than in git, so this item is a prerequisite:
# create `dex-headlamp-client-secret` in the `home-cluster` vault before merging, or ESO will fail
# and Dex will not start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-headlamp-client
  namespace: sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dex-headlamp-client
  data:
    - secretKey: secret
      remoteRef:
        key: dex-headlamp-client-secret
        property: password
