---
# Google connector credentials, reusing the client that the previous oauth2-proxy attempt used
# (1Password `home-cluster` vault). `oauth2-proxy-cookie-secret` is intentionally NOT referenced --
# it signed oauth2-proxy session cookies, which no longer exist after #818 removed that stack.
#
# This is the only Secret the sso namespace needs. Headlamp is a Dex *public* client using PKCE,
# so there is deliberately no Dex<->Headlamp client secret anywhere: nothing to create, rotate
# or leak. See dex-helmrelease.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-google-connector
  namespace: sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dex-google-connector
  data:
    - secretKey: DEX_GOOGLE_CLIENT_ID
      remoteRef:
        key: oauth2-proxy-client-id
        property: password
    - secretKey: DEX_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: oauth2-proxy-client-secret
        property: password
