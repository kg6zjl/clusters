---
# external-dns in this cluster runs with --source=ingress, not --source=traefik, so it does NOT read
# IngressRoutes. This DNSEndpoint is what actually publishes the name; the hostname annotation is
# inert by itself.
#
# Points at the same MetalLB address the other *.kube.stevearnett.com records use, because this name
# is served by the same wildcard Traefik entrypoint.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: sso
  namespace: sso
spec:
  endpoints:
    - dnsName: sso.kube.stevearnett.com
      recordTTL: 300
      recordType: A
      targets:
        - "192.168.1.241"  # metal-lb, same as traefik/dnsendpoint.yaml
