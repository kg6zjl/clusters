---
# This comment used to claim external-dns runs with --source=ingress only and cannot read
# IngressRoutes. That is no longer true: --source=traefik-proxy is enabled
# (kube-system/external-dns-helmrelease.yaml) and the sso IngressRoute declares this host, so this
# DNSEndpoint is probably redundant. Left in place deliberately - with policy: sync, retiring it means
# watching the record survive the removal rather than assuming it.
#
# Points at the same MetalLB address the other *.kube.stevearnett.com records use, because this name
# is served by the same wildcard Traefik entrypoint.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: sso
  namespace: sso
spec:
  endpoints:
    - dnsName: sso.kube.stevearnett.com
      recordTTL: 300
      recordType: A
      targets:
        - "192.168.1.241"  # metal-lb, same as traefik/dnsendpoint.yaml
