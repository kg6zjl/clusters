# Served by an IngressRoute, which external-dns cannot read (sources are service,
# ingress, crd), so the record is declared here instead.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: speedtest
  namespace: speedtest
spec:
  endpoints:
  - dnsName: speedtest.kube.stevearnett.com
    recordType: CNAME
    targets:
    - kube.stevearnett.com
