apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui-allow-internet-egress
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: open-webui
  policyTypes:
  - Egress
  egress:
  # Internet egress: Open WebUI fetches its default embedding model
  # (HuggingFace sentence-transformers) during startup, plus fonts/favicons
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: ::/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443