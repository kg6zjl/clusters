# In-cluster kubeconfig for Hermes. Uses the pod's own ServiceAccount token via
# tokenFile (rotated with the pod) and the in-cluster CA; contains no secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-kubeconfig
  namespace: ai-services
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: in-cluster
      cluster:
        server: https://kubernetes.default.svc:443
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
    - name: in-cluster
      context:
        cluster: in-cluster
        user: hermes-agent
    current-context: in-cluster
    users:
    - name: hermes-agent
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token