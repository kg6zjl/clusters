---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: ai-services
---
# Cluster-scoped READ-ONLY access for Hermes. Hermes manages the cluster
# through git PRs (GitOps), never by mutating cluster state directly, so it
# needs get/list/watch on nearly everything but NO create/update/patch/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-agent
rules:
  # Core read + logs (read-only; no secrets values exposure beyond pod env)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - endpointslices
      - configmaps
      - namespaces
      - nodes
      - nodes/status
      - persistentvolumes
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - events
      - limitranges
      - resourcequotas
      - componentstatuses
      - replicationcontrollers
    verbs: ["get", "list", "watch"]

  # Workloads (read-only)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - deployments/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
      - replicasets
      - replicasets/status
      - controllerrevisions
    verbs: ["get", "list", "watch"]

  # Batch / jobs (read-only)
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status", "cronjobs", "cronjobs/status"]
    verbs: ["get", "list", "watch"]

  # Networking (read-only)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses", "ingressclasses", "endpointslices"]
    verbs: ["get", "list", "watch"]

  # EndpointSlices are the authoritative endpoint set for a Service. The legacy
  # v1 Endpoints object can be stale (skip-mirror), which is exactly how a
  # decommissioned IP stayed in the API service endpoints unnoticed.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

  # CRD status: needed to tell "the CRD is missing" apart from "the CRD exists
  # but is not Established", which look identical from a failed list call.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # Traefik CRDs (read-only)
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - serversstransports
      - serversstransporttcps
    verbs: ["get", "list", "watch"]

  # Flux / GitOps visibility (read-only)
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Storage (read-only)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "volumeattachments"]
    verbs: ["get", "list", "watch"]

  # Longhorn CRDs (read-only) — volume/replica/engine state, node CRs,
  # snapshots and backups. Needed to verify storage health without asking
  # a human to run kubectl.
  - apiGroups: ["longhorn.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Policy / autoscaling / coordination / rbac audit (read-only)
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets", "poddisruptionbudgets/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]

  # Monitoring / observability CRDs (read-only)
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors", "prometheusrules", "probes"]
    verbs: ["get", "list", "watch"]

  # Secrets operators / cert-manager / external-dns (read-only)
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "clustersecretstores"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io", "acme.cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers", "orders", "challenges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]
--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-agent
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: ai-services