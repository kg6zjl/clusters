---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: ai-services
---
# Cluster-scoped READ-ONLY access for Hermes. Hermes manages the cluster
# through git PRs (GitOps), never by mutating cluster state directly, so it
# needs get/list/watch on nearly everything but NO create/update/patch/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-agent
rules:
  # Core read + logs (read-only; no secrets values exposure beyond pod env)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - endpointslices
      - configmaps
      - namespaces
      - nodes
      - nodes/status
      - persistentvolumes
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - events
      - limitranges
      - resourcequotas
      - componentstatuses
      - replicationcontrollers
    verbs: ["get", "list", "watch"]

  # Workloads (read-only)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - deployments/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
      - replicasets
      - replicasets/status
      - controllerrevisions
    verbs: ["get", "list", "watch"]

  # Batch / jobs (read-only)
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status", "cronjobs", "cronjobs/status"]
    verbs: ["get", "list", "watch"]

  # Networking (read-only)
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses", "ingressclasses", "endpointslices"]
    verbs: ["get", "list", "watch"]

  # EndpointSlices are the authoritative endpoint set for a Service. The legacy
  # v1 Endpoints object can be stale (skip-mirror), which is exactly how a
  # decommissioned IP stayed in the API service endpoints unnoticed.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]

  # CRD status: needed to tell "the CRD is missing" apart from "the CRD exists
  # but is not Established", which look identical from a failed list call.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # Traefik CRDs (read-only)
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - serversstransports
      - serversstransporttcps
    verbs: ["get", "list", "watch"]

  # Flux / GitOps visibility (read-only)
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Storage (read-only)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "volumeattachments"]
    verbs: ["get", "list", "watch"]

  # Longhorn CRDs (read-only) — volume/replica/engine state, node CRs,
  # snapshots and backups. Needed to verify storage health without asking
  # a human to run kubectl.
  - apiGroups: ["longhorn.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Policy / autoscaling / coordination / rbac audit (read-only)
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets", "poddisruptionbudgets/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]

  # Kyverno policy engine (read-only). Without this every list in every Kyverno group
  # returns Forbidden, which makes three different things indistinguishable: "no policy
  # violated this resource", "a policy violated it and I cannot see the report", and "the
  # policy that would have caught it is not even installed". That gap produced a wrong
  # claim that no policy in the cluster matches a dashboard's cluster-admin binding.
  #
  # There are four groups and they are not interchangeable: kyverno.io carries the
  # ClusterPolicy/Policy/PolicyException objects, policies.kyverno.io the newer
  # ValidatingPolicy/MutatingPolicy/GeneratingPolicy family, reports.kyverno.io the
  # EphemeralReports that current Kyverno writes its policy results into, and
  # wgpolicyk8s.io the older PolicyReport objects those replaced. Granting a subset
  # silently loses whichever half is not granted.
  - apiGroups: ["kyverno.io"]
    resources:
      - clusterpolicies
      - policies
      - policyexceptions
      - cleanuppolicies
      - clustercleanuppolicies
      - updaterequests
      - globalcontextentries
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policies.kyverno.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["reports.kyverno.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Monitoring / observability CRDs (read-only)
  # `prometheuses` is the one that matters for diagnosis: the Prometheus CR is the only
  # place serviceMonitorSelector / serviceMonitorNamespaceSelector /
  # serviceMonitorSelectorNilUsesHelmValues live. Without reading it, a scrape job that was
  # never rendered is indistinguishable from a ServiceMonitor that was never selected, and
  # the ServiceMonitor object itself looks perfectly correct either way. That gap produced
  # exactly that mistake on the Loki scrape issue: a confident wrong root cause.
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
      - probes
      - prometheuses
      - prometheuses/status
    verbs: ["get", "list", "watch"]

  # Flux Operator CRDs (read-only). The FluxInstance is the object that will own the four Flux
  # controllers once the takeover lands, so its status is the only place that says which
  # distribution version is actually running and which components the operator believes it
  # manages. Without read access the takeover's own verification checklist
  # (`kubectl -n flux-system get fluxinstance flux`) is unusable to the agent doing the work,
  # and a failed takeover would be indistinguishable from a successful one - which matters
  # because a broken Flux cannot be repaired by this agent at all.
  - apiGroups: ["fluxcd.controlplane.io"]
    resources:
      - fluxinstances
      - fluxinstances/status
      - fluxreports
      - fluxreports/status
    verbs: ["get", "list", "watch"]

  # Secrets operators / cert-manager / external-dns (read-only)
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "clustersecretstores"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io", "acme.cert-manager.io"]
    resources: ["certificates", "certificaterequests", "issuers", "clusterissuers", "orders", "challenges"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["externaldns.k8s.io"]
    resources: ["dnsendpoints"]
    verbs: ["get", "list", "watch"]

  # KubeStash / AppsCode backup CRDs (read-only) — this is the cluster's backup
  # system: BackupConfigurations, BackupSessions, Repositories, Snapshots. None of it
  # is described in git, so the cluster API is the only source of truth for what is
  # actually backed up. Before this grant every list returned Forbidden, which made a
  # protected volume indistinguishable from an unprotected one - and produced a wrong
  # claim that home-assistant had no backup at all.
  - apiGroups:
      - core.kubestash.com
      - storage.kubestash.com
      - addons.kubestash.com
      - appcatalog.appscode.com
      - metrics.appscode.com
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Trivy operator reports (read-only) — the full-fidelity scan results. The Grafana
  # panels and Prometheus metrics are aggregates, so without these the findings can only
  # be inferred from a count, not triaged.
  - apiGroups: ["aquasecurity.github.io"]
    resources:
      - vulnerabilityreports
      - clustervulnerabilityreports
      - configauditreports
      - clusterconfigauditreports
      - rbacassessmentreports
      - clusterrbacassessmentreports
    verbs: ["get", "list", "watch"]

  # Crossplane pilot (read-only): the Provider's install state and the managed RepositoryWebhook.
  # Without these, the objects can only be inferred from the provider pod's liveness.
  - apiGroups: ["pkg.crossplane.io"]
    resources:
      - providers
      - providerrevisions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["repo.github.m.upbound.io", "github.m.upbound.io"]
    resources:
      - repositorywebhooks
      - providerconfigs
    verbs: ["get", "list", "watch"]
--- 
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-agent
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: ai-services