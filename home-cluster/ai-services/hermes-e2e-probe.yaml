---
# End-to-end gate for hermes-agent.
#
# /health is a shallow liveness answer ("status": ok) served as soon as the
# API server binds -- it says nothing about whether the gateway can actually
# serve a turn. Measured on 2026-09-26: pod Ready 22s after container start,
# while the gateway's own host claim was not published until ~6 min later.
# So "Ready" is not "able to answer", which is why this probe exists.
#
# Two stages, both against the live agent:
#   1. GET /health/detailed (Bearer API_SERVER_KEY) -- asserts status == "ok"
#      and checks.gateway.state == "running" with a connected platform. This
#      is the gateway's own bounded readiness report (state.db, session store,
#      config, model, disk, platform connections); it is read-only and never
#      competes with state writers.
#   2. POST /v1/chat/completions -- one real turn. /health/detailed reports
#      model "ok" when a model name is merely configured, so it cannot catch
#      the documented failure mode where the OpenRouter credential pool wedges
#      and every turn dies with "No LLM provider configured" (see
#      hermes-config-configmap.yaml). Only a real completion proves the agent
#      can serve.
#
# Run it on demand (e.g. right after a rollout) instead of waiting for the tick:
#   kubectl create job -n ai-services --from=cronjob/hermes-agent-e2e hermes-agent-e2e-manual
#
# NOTE: the probe reaches the Service, so it needs an ingress rule on the
# hermes-agent pods. Without it the call dies as a timeout, not a 403 --
# measured from a pod labelled app=hermes-agent on 2026-09-26: HTTP 000 after
# 5s. hermes-agent-allow-probe below is that rule and must ship with this file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-agent-e2e
  namespace: ai-services
  labels:
    app: hermes-agent-probe
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: hermes-agent-probe
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: probe
            image: python:3.13-slim
            command: ["python3"]
            args:
            - -c
            - |
              import json, os, sys, time, urllib.request, urllib.error

              BASE = os.environ.get("HERMES_API", "http://hermes-agent:8642")
              KEY = os.environ["API_SERVER_KEY"]
              MODEL = os.environ.get("PROBE_MODEL", "hermes-agent")
              DEADLINE = time.time() + float(os.environ.get("PROBE_TIMEOUT_SECONDS", "180"))

              def call(path, data=None, auth=True, timeout=15):
                  req = urllib.request.Request(BASE + path, data=data)
                  if auth:
                      req.add_header("Authorization", "Bearer " + KEY)
                  if data is not None:
                      req.add_header("Content-Type", "application/json")
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8", "replace"))

              # Stage 1a: the pod is up and the API server is listening.
              last = None
              while time.time() < DEADLINE:
                  try:
                      status, _ = call("/health", auth=False, timeout=5)
                      if status == 200:
                          break
                  except Exception as exc:
                      last = exc
                  time.sleep(2)
              else:
                  sys.exit("FAIL: /health never returned 200 (last: %r)" % (last,))

              # Stage 1b: the gateway itself is ready and a platform is connected.
              last = None
              while time.time() < DEADLINE:
                  try:
                      _, body = call("/health/detailed")
                      gateway = body.get("readiness", {}).get("checks", {}).get("gateway", {})
                      if (body.get("status") == "ok"
                              and gateway.get("state") == "running"
                              and gateway.get("connected_platforms", 0) >= 1):
                          break
                      last = {"status": body.get("status"), "gateway": gateway}
                  except Exception as exc:
                      last = exc
                  time.sleep(5)
              else:
                  sys.exit("FAIL: /health/detailed never reported ok/running (last: %r)" % (last,))

              # Stage 2: one real turn with a cheap model.
              payload = json.dumps({
                  "model": MODEL,
                  "messages": [{"role": "user", "content": "Reply with exactly the word: ok"}],
                  "max_tokens": 16,
              }).encode("utf-8")
              try:
                  _, body = call("/v1/chat/completions", data=payload, timeout=120)
              except urllib.error.HTTPError as exc:
                  sys.exit("FAIL: /v1/chat/completions HTTP %s: %s"
                           % (exc.code, exc.read().decode("utf-8", "replace")[:500]))
              except Exception as exc:
                  sys.exit("FAIL: /v1/chat/completions %r" % (exc,))
              choices = body.get("choices") or []
              text = ((choices[0].get("message") or {}).get("content") or "").strip() if choices else ""
              if not text:
                  sys.exit("FAIL: empty completion: %s" % json.dumps(body)[:500])
              print("PROBE OK", json.dumps({
                  "gateway": gateway.get("state"),
                  "connected_platforms": gateway.get("connected_platforms"),
                  "completion_chars": len(text),
              }))
            env:
            - name: HERMES_API
              value: http://hermes-agent:8642
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: API_SERVER_KEY
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
---
# Admits the e2e probe (and only the probe) to the agent's API port. The
# existing hermes-agent-allow-openwebui rule admits app=open-webui only, so
# without this the probe times out on connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent-allow-probe
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: hermes-agent
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: hermes-agent-probe
    ports:
    - protocol: TCP
      port: 8642
