# Egress for the App-credential verification pod only. The agent's own internet egress is
# granted to pods labelled app=hermes-agent (network-policy-github.yaml); this Job is
# deliberately not given that label, so it needs its own path rather than borrowing the
# agent's -- which would also hand it API-server and webhook egress it has no use for.
#
# DNS comes from ai-services-allow-egress, which selects every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-app-verify-egress
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: github-app-verify
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: "::/0"
    ports:
    - protocol: TCP
      port: 443
