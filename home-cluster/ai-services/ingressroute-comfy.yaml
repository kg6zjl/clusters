---
# IngressRoute for Comfy
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: comfy
  namespace: ai-services
  annotations:
    external-dns.alpha.kubernetes.io/hostname: comfy.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
    # Deliberately NOT blackbox-probed. This host is served by the `beast` box
    # (comfy-local -> 192.168.1.161:8080), which is powered on and off on demand,
    # so it is unreachable for long stretches; a probe would fire IngressDown
    # continuously and train everyone to ignore the alert. The route also sits
    # behind the basic-auth-comfy middleware, so even with beast powered on the
    # probe would get a 401 and could never report success. The reconciler reads
    # this annotation - there is no hostname allowlist in code.
    blackbox.stevearnett.com/probe: "false"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`comfy.kube.stevearnett.com`)
      kind: Rule
      middlewares:
        - name: basic-auth-comfy
      services:
        - name: comfy-local
          port: 8080
          scheme: http