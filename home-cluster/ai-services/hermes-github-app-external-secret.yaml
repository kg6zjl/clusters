# The Hermes agent's own GitHub identity: a GitHub App owned by @kg6zjl, installed on
# kg6zjl/clusters and kg6zjl/skills only. This replaces the owner's PAT, which the agent
# previously used for every gh/git call, so the agent's actions were indistinguishable
# from the owner's and no policy could be written about them.
#
# The private key and the numeric App/installation ids come from the
# `hermes-agent-github-app` item in the `home-cluster` 1Password vault (fields
# app-id, installation-id, private-key). They are consumed only by the minter that
# runs inside the hermes-agent pod -- see github-app-identity.md for the design and
# the ordering constraint (the item must exist before this Deployment is merged).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-github-app
  namespace: ai-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-github-app
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: hermes-agent-github-app
        property: app-id
    - secretKey: installation-id
      remoteRef:
        key: hermes-agent-github-app
        property: installation-id
    - secretKey: private-key
      remoteRef:
        key: hermes-agent-github-app
        property: private-key
