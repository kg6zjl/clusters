---
# Credential lives in 1Password (item: comfy-basic-auth) and reaches Traefik via ESO,
# which derives the htpasswd line - see externalsecret-comfy-auth.yaml. Never inline a hash.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth-comfy
  namespace: ai-services
spec:
  basicAuth:
    secret: basic-auth-comfy
