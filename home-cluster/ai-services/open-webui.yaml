---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai-services
  labels:
    app: open-webui
    alert-on-down: "true"
  annotations:
    # open-webui reads only ai-services-secrets now: it no longer consumes the agent's API key.
    secret.reloader.stakater.com/reload: "ai-services-secrets"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        rollout.restartedAt: "2026-09-24T20:00:00Z"
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        # A single local endpoint: the GPU host's llama.cpp router on beast. The in-cluster
        # llama-qwen35 endpoint is gone too, and the hermes-agent one before it - open-webui
        # offers nothing that is not this host.
        - name: OPENAI_API_BASE_URLS
          value: "http://192.168.1.161:11434/v1"
        # Positional: one key per URL, paired by index. This router needs no credential, so
        # the literal placeholder is enough and open-webui holds no API key at all.
        - name: OPENAI_API_KEYS
          value: "no-key"
        # New chats open on the local 14B. The name must match what the router's /v1/models
        # reports; the README documents the same model as Qwen3-14B-abliterated-Q4_K_M, so if
        # the picker comes up empty that spelling is the first thing to try.
        - name: DEFAULT_MODELS
          value: "qwen3-14b-abliterated:latest"
        - name: ENABLE_IMAGE_GENERATION
          value: "True"
        - name: IMAGE_GENERATION_ENGINE
          value: "comfyui"
        - name: COMFYUI_BASE_URL
          value: "http://192.168.1.161:8080"
        - name: WEBUI_AUTH
          value: "True"
        - name: ENABLE_SIGNUP
          value: "True"
        - name: DEFAULT_USER_ROLE
          value: "admin"
        # Make env vars authoritative over the persisted config DB.
        # OPENAI_API_BASE_URLS/OPENAI_API_KEYS are ConfigVars: on first boot
        # they are written to webui.db and the DB wins afterwards, which is how
        # an endpoint declared here can silently fail to appear. With
        # ENABLE_PERSISTENT_CONFIG=false the env defaults (source of truth in
        # git) are always used and UI-only changes don't persist.
        - name: ENABLE_PERSISTENT_CONFIG
          value: "false"
        envFrom:
        - secretRef:
            name: ai-services-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
        volumeMounts:
        - name: webui-data
          mountPath: /app/backend/data
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-data-longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ai-services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai-services
  labels:
    app: open-webui
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: open-webui