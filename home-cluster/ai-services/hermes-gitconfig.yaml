apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-gitconfig
  namespace: ai-services
data:
  gitconfig: |
    [user]
    	name = Hermes
    	email = hermes@stevearnett.com
    [init]
    	defaultBranch = main
    [pull]
    	rebase = false
    [credential "https://github.com"]
    	helper = /opt/data/git-credential-helper
  git-credential-helper: |
    #!/bin/sh
    if [ "$1" = "get" ]; then
      echo username=x-access-token
      echo "password=$(cat /etc/hermes/github-token)"
    fi