apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-gitconfig
  namespace: ai-services
data:
  gitconfig: |
    [core]
    	hooksPath = .githooks
    [user]
    	name = Hermes
    	email = hermes@stevearnett.com
    [init]
    	defaultBranch = main
    [pull]
    	rebase = false
    [credential "https://github.com"]
    	helper = /opt/data/git-credential-helper
  git-credential-helper: |
    #!/bin/sh
    if [ "$1" = "get" ]; then
      echo username=x-access-token
      echo "password=$(cat /etc/hermes/github-token)"
    fi
  # The file now holds a GitHub App installation token issued to the App owned by
  # @kg6zjl (see github-app-identity.md), not the owner's PAT. `x-access-token` is the
  # documented username for an installation token, so this helper needs no change.