apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai-services
  labels:
    app: hermes-agent
    component: config
data:
  config.yaml: |
    model:
      provider: openrouter
      default: "deepseek/deepseek-v4.1-flash"

    cron:
      model: "deepseek/deepseek-v4.1-flash"
      model_provider: openrouter

    display:
      platforms:
        discord:
          tool_progress: off
          tool_progress_command: false
          tool_progress_grouping: accumulate