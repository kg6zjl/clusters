apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai-services
  labels:
    app: hermes-agent
    component: config
data:
  config.yaml: |
    model:
      default: "anthropic/claude-sonnet-4"
      provider: openrouter
      # context_length only matters for local providers; omit for OpenRouter

    providers:
      lmstudio:
        base_url: "http://192.168.1.161:11434/v1"
        models:
        - "GLM-4.6V-Flash-UD-Q4_K_XL"
        - "Qwen3-14B-abliterated-Q4_K_M"
        - "Qwen3.5-9B-Q4_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q3_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q4_K_M"
        - "Qwen35-0.8B-Q4_K_M"

      openrouter:
        # base_url defaults to https://openrouter.ai/api/v1
        # api_key comes from OPENROUTER_API_KEY env var (via ExternalSecret)
        models:
        - "anthropic/claude-sonnet-4"
        - "anthropic/claude-opus-4"
        - "google/gemini-2.5-pro"
        - "openai/gpt-4.1"

    cron:
      model: "Qwen35-0.8B-Q4_K_M"
      model_provider: lmstudio

    display:
      # Per-platform (schema-canonical) tool_progress off: no tool-call bubbles
      # on any gateway surface. Top-level display.tool_progress also works but
      # is schema-flagged; the per-platform key is what /verbose saves and reads.
      platforms:
        discord:
          tool_progress: off
          tool_progress_command: false
          tool_progress_grouping: accumulate