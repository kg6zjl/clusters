apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai-services
  labels:
    app: hermes-agent
    component: config
data:
  config.yaml: |
    model:
      provider: openrouter
      default: "deepseek/deepseek-v4.1-flash"
      # base_url is not needed for OpenRouter (Hermes uses the official endpoint)

    # Optional but recommended: keep your local models available for /model switching
    providers:
      lmstudio:                    # or rename this to something accurate
        base_url: "http://192.168.1.161:11434/v1"
        models:
        - "GLM-4.6V-Flash-UD-Q4_K_XL"
        - "Qwen3-14B-abliterated-Q4_K_M"
        - "Qwen3.5-9B-Q4_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q3_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q4_K_M"
        - "Qwen35-0.8B-Q4_K_M"

    cron:
      model: "deepseek/deepseek-v4.1-flash"
      model_provider: openrouter

    display:
      platforms:
        discord:
          tool_progress: off
          tool_progress_command: false
          tool_progress_grouping: accumulate