apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai-services
  labels:
    app: hermes-agent
    component: config
data:
  config.yaml: |
    model:
      default: "deepseek/deepseek-v4.1-flash"
      provider: openrouter
      # context_length only matters for local providers; omit for OpenRouter

    providers:
      lmstudio:
        base_url: "http://192.168.1.161:11434/v1"
        models:
        - "GLM-4.6V-Flash-UD-Q4_K_XL"
        - "Qwen3-14B-abliterated-Q4_K_M"
        - "Qwen3.5-9B-Q4_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q3_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q4_K_M"
        - "Qwen35-0.8B-Q4_K_M"

      openrouter:
        # base_url defaults to https://openrouter.ai/api/v1
        # api_key comes from OPENROUTER_API_KEY env var (via ExternalSecret)
        models:
        - "deepseek/deepseek-v4.1-flash"
        - "cohere/north-mini-code:free"
        - "openrouter/free"
        - "nvidia/nemotron-3-ultra-550b-a55b:free"
        - "poolside/laguna-s-2.1:free"
        - "anthropic/claude-sonnet-4"
        - "anthropic/claude-opus-4"
        - "google/gemini-2.5-pro"
        - "openai/gpt-4.1"

    cron:
      model: "Qwen35-0.8B-Q4_K_M"
      model_provider: lmstudio

    display:
      # Per-platform (schema-canonical) tool_progress off: no tool-call bubbles
      # on any gateway surface. Top-level display.tool_progress also works but
      # is schema-flagged; the per-platform key is what /verbose saves and reads.
      platforms:
        discord:
          tool_progress: off
          tool_progress_command: false
          tool_progress_grouping: accumulate

    # Continuous kanban dispatcher: the gateway owns it and ticks forever,
    # spawning one worker per assigned+ready task. Declared explicitly because
    # it is otherwise an implicit default, and `hermes kanban daemon` is
    # deprecated — running both means two dispatchers racing for the same
    # claims against one kanban.db. Config is read once at gateway boot, so a
    # change here takes effect on the pod roll the reloader annotation triggers.
    kanban:
      dispatch_in_gateway: true
      dispatch_interval_seconds: 60
      failure_limit: 2
      # The pod's memory limit is 4Gi, shared with the gateway process itself
      # (~0.6Gi idle). Left unset, the dispatcher sizes the cap from the NODE's
      # MemTotal (15.7Gi -> max_in_progress=8), which OOM-kills the gateway long
      # before eight agent processes fit in 4Gi.
      max_in_progress: 2