apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai-services
  labels:
    app: hermes-agent
    component: config
data:
  config.yaml: |
    model:
      default: "GLM-4.6V-Flash-UD-Q4_K_XL"
      provider: lmstudio
      base_url: "http://192.168.1.161:11434/v1"
      context_length: 131072
    # providers.lmstudio.models mirrors beast's live /v1/models catalog so /model
    # lists every GGUF served by the router (incl. the fast Qwen35-0.8B) instead of
    # only the curated default.
    providers:
      lmstudio:
        base_url: "http://192.168.1.161:11434/v1"
        models:
        - "GLM-4.6V-Flash-UD-Q4_K_XL"
        - "Qwen3-14B-abliterated-Q4_K_M"
        - "Qwen3.5-9B-Q4_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q3_K_M"
        - "Qwen3.8-27B-ABLITERATED-Q4_K_M"
        - "Qwen35-0.8B-Q4_K_M"
    cron:
      # Scheduled jobs ride the fast 0.8B so they don't eat the GLM's GPU budget.
      model: "Qwen35-0.8B-Q4_K_M"
      model_provider: lmstudio
    display:
      # Per-platform (schema-canonical) tool_progress off: no tool-call bubbles
      # on any gateway surface. Top-level display.tool_progress also works but
      # is schema-flagged; the per-platform key is what /verbose saves and reads.
      platforms:
        discord:
          tool_progress: off
          tool_progress_command: false
          tool_progress_grouping: accumulate
