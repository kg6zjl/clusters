apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-secrets
  namespace: ai-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-agent-secrets
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes-api-server-key
        property: password
    - secretKey: OPENAI_API_KEYS
      remoteRef:
        key: hermes-api-server-key
        property: openai_api_keys    # custom field: "yourkey;no-key;no-key"
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: github-cluster-scoped-token
        property: password
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: hermes-discord
        property: discord-app-token
    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: hermes-discord
        property: allowed-users
    - secretKey: DISCORD_HOME_CHANNEL
      remoteRef:
        key: hermes-discord
        property: home-channel
    - secretKey: DISCORD_FREE_RESPONSE_CHANNELS
      remoteRef:
        key: hermes-discord
        property: free-response-channels
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter-api-key
        property: password
    # Web dashboard login. A non-loopback dashboard bind fails closed without an
    # auth provider, so the pod will not serve the dashboard until this item
    # exists in the 1Password `home-cluster` vault as `hermes-dashboard` with
    # two fields: username, password. The session-signing key is sourced
    # separately below, so no third field is required.
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes-dashboard
        property: username
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: hermes-dashboard
        property: password
    # Session-signing key. Sourced from the EXISTING hermes-api-server-key item
    # rather than a new field on hermes-dashboard, so the dashboard needs no
    # 1Password item that does not already exist.
    #
    # Tradeoff, stated plainly: this reuses one high-entropy secret for two
    # purposes (gateway API auth, and HMAC-signing dashboard sessions). Both
    # live inside the same container and the same trust boundary, and an HMAC
    # signature is one-way, so a forged session cookie does not disclose the
    # key. The real cost is rotation coupling -- rotating one rotates both.
    # A dedicated `secret` field on hermes-dashboard is the cleaner end state;
    # switching to it later is a one-line change to this remoteRef.
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes-api-server-key
        property: password