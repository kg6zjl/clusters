apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-secrets
  namespace: ai-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-agent-secrets
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes-api-server-key      # create this item in 1Password home-cluster vault
        property: password
    # Optional — only if you want GitHub skills
    # - secretKey: GITHUB_TOKEN
    #   remoteRef:
    #     key: hermes-github-token
    #     property: password