# Hermes kubectl-access to the kube-apiserver (read-only), plus the LAN endpoints the
# agent's own tooling needs.
#
# The API server is a HOST process, NOT a pod: namespaceSelector-only egress does not
# cover it, so this needs an ipBlock. One address, which is fixed rather than current:
# kubernetes.default.svc is the first ClusterIP of the service CIDR (10.152.183.1), and
# hermes-kubeconfig points at that name, so the two track each other.
#
# Traefik's ClusterIP (10.152.183.231) used to be here for registry pulls. It is gone:
# the registry answers 401 to this pod both anonymously and with its own ServiceAccount
# token - the runner's OIDC identity is what it accepts - so the rule bought access the
# agent cannot use. It was also the one entry that was NOT fixed: a ClusterIP is a
# Service's current address, so it moves if that Service is recreated. If a tool here
# ever needs another in-cluster HTTPS service, prefer that service's LAN name over its
# ClusterIP, and add a line here for it.
#
# 16443 is gone: that was a node-IP kubeconfig, and the in-cluster one uses
# https://kubernetes.default.svc:443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent-allow-kubeapi
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: hermes-agent
  policyTypes:
  - Egress
  egress:
  # The ClusterIP itself, in case policy is matched before DNAT.
  - to:
    - ipBlock:
        cidr: 10.152.183.1/32
    ports:
    - protocol: TCP
      port: 443
  # What actually carries kubectl. The apiserver is a HOST process, so the ClusterIP on 443
  # is DNAT'd to the node's apiserver port 16443 and 16443 is what policy matches. Drop it
  # and kubectl times out on 10.152.183.1:443 while DNS and internet egress stay fine.
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 16443
  # Prometheus, Alertmanager and Loki are reached by name, and those names resolve to
  # Traefik's MetalLB VIP, which is DNAT'd to a Traefik POD: the peer that matches is the
  # namespace, not an ipBlock. This is what carried the agent's monitoring queries before
  # the namespace-wide egress rule went away.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 443