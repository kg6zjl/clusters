# Hermes kubectl-access to the kube-apiserver (read-only), plus the LAN endpoints the
# agent's own tooling needs. Telemetry reads - the operator UIs, Loki - live in
# network-policy-hermes-telemetry.yaml.
#
# The apiserver is a HOST process reached through the kubernetes Service ClusterIP:
# 10.152.183.1:443 is DNAT'd to the node's apiserver port before policy is evaluated, so
# the port that matters is 16443 on the node, not 443 on the ClusterIP. Drop 16443 and
# kubectl times out while DNS and internet egress stay fine - which is how it looked when
# this entry was deleted on the pre-DNAT reading.
#
# The LAN block also covers the gateway and any other node-hosted endpoint. Traefik's
# ClusterIP (10.152.183.231) is deliberately absent: the registry answers 401 to this pod
# both anonymously and with its own ServiceAccount token, so the rule bought access the
# agent cannot use, and a ClusterIP is a Service's current address - it moves on recreate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent-allow-kubeapi
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: hermes-agent
  policyTypes:
  - Egress
  egress:
  # The post-DNAT apiserver port: this rule is what carries kubectl.
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 16443
