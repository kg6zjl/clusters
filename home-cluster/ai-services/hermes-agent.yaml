---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: ai-services
  labels:
    app: hermes-agent
    alert-on-down: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
      annotations:
        rollout.restartedAt: "2026-09-24T23:05:00Z"
    spec:
      serviceAccountName: hermes-agent
      # CPU only — GPU stays on beast
      initContainers:
      - name: install-tools
        image: python:3.13-slim
        command:
        - sh
        - -c
        - |
          set -e
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq >/dev/null
          mkdir -p /opt/data/.local/bin /opt/data/.local/pylib
          # Helm
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar xz -C /tmp && \
            mv /tmp/linux-amd64/helm /opt/data/.local/bin/ && rm -rf /tmp/linux-amd64
          # kubectl (pin to server minor)
          curl -fsSL https://dl.k8s.io/release/v1.35.6/bin/linux/amd64/kubectl -o /opt/data/.local/bin/kubectl && \
            chmod +x /opt/data/.local/bin/kubectl
          # kustomize (matches CI: v5.4.2)
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz" | \
            tar xz -C /tmp && mv /tmp/kustomize /opt/data/.local/bin/
          # GitHub CLI (matches runner Dockerfile: v2.47.0)
          curl -fsSL https://github.com/cli/cli/releases/download/v2.47.0/gh_2.47.0_linux_amd64.tar.gz | \
            tar xz -C /tmp && mv /tmp/gh_2.47.0_linux_amd64/bin/gh /opt/data/.local/bin/ && rm -rf /tmp/gh_2.47.0_linux_amd64
          # gitleaks (matches pre-commit: v8.18.2)
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | \
            tar xz -C /opt/data/.local/bin gitleaks
          # trufflehog (matches CI action)
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /opt/data/.local/bin
          # yq
          curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /opt/data/.local/bin/yq && \
            chmod +x /opt/data/.local/bin/yq
          # go-task (Taskfile)
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /opt/data/.local/bin
          # yamllint into a glibc-compatible site-packages dir (PYTHONPATH in main container)
          pip3 install --quiet --target=/opt/data/.local/pylib yamllint pre-commit
          # PATH wrapper for pre-commit (—target puts the console script in pylib/bin)
          printf '#!/bin/sh\nexec python3 -m pre_commit "$@"\n' > /opt/data/.local/bin/pre-commit
          chmod +x /opt/data/.local/bin/*
          # Copy skills from ConfigMap into HERMES_HOME/skills in the
          # <category>/<skill>/SKILL.md layout Hermes discovers (rglob for
          # SKILL.md under $HERMES_HOME/skills). ConfigMap keys are flattened
          # (no '/' allowed), so re-derive the tree from each skill's frontmatter.
          mkdir -p /opt/data/.hermes/skills
          for f in /skills/*; do
            [ -f "$f" ] || continue
            cat="$(sed -n 's/^category:[[:space:]]*//p' "$f" | head -1)"
            name="$(sed -n 's/^name:[[:space:]]*//p' "$f" | head -1)"
            [ -n "$cat" ] && [ -n "$name" ] || continue
            mkdir -p "/opt/data/.hermes/skills/$cat/$name"
            cp "$f" "/opt/data/.hermes/skills/$cat/$name/SKILL.md" 2>/dev/null || true
          done
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: hermes-skills
          mountPath: /skills
        - name: hermes-config
          mountPath: /opt/data/.hermes/config.yaml
          subPath: config.yaml
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:latest   # pin a tag in production
        args:
        - gateway
        - run
        ports:
        - containerPort: 8642
          name: api
        env:
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_HOST
          value: "0.0.0.0"
        - name: API_SERVER_PORT
          value: "8642"
        # Point at your existing llama.cpp on beast
        - name: OPENAI_API_BASE_URL
          value: "http://192.168.1.161:11434/v1"
        - name: OPENAI_API_KEY
          value: "no-key"
        # Tools installed by install-tools initContainer into .local/bin (already on PATH)
        - name: KUBECONFIG
          value: /opt/data/.kube/config
        - name: PYTHONPATH
          value: /opt/data/.local/pylib
        # Git identity for PR-authored commits.
        # git config is read from the mounted configmap file, NOT env vars:
        # hermes's tool sandbox scrubs secret env vars from the model, but git
        # subprocesses still honor GIT_CONFIG_GLOBAL pointing at a real file.
        # The gateway runs as the 'hermes' user (HOME=/opt/data), so both the
        # gitconfig and the token mount live under paths that user can read.
        - name: GIT_CONFIG_GLOBAL
          value: /opt/data/.gitconfig
        - name: GIT_AUTHOR_NAME
          value: "Hermes"
        - name: GIT_AUTHOR_EMAIL
          value: "hermes@stevearnett.com"
        - name: GIT_COMMITTER_NAME
          value: "Hermes"
        - name: GIT_COMMITTER_EMAIL
          value: "hermes@stevearnett.com"
        # Default model must match a /v1/models id exactly. Beast llama-server
        # serves GLM-4.6V-Flash-UD-Q4_K_XL (local GGUF, native function calling).
        - name: HERMES_MODEL_DEFAULT
          value: "GLM-4.6V-Flash-UD-Q4_K_XL"
        envFrom:
        - secretRef:
            name: hermes-agent-secrets
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: kubeconfig
          mountPath: /opt/data/.kube/config
          subPath: config
        - name: hermes-soul
          mountPath: /opt/data/SOUL.md
          subPath: SOUL.md
        - name: hermes-gitconfig
          mountPath: /opt/data/.gitconfig
          subPath: gitconfig
        - name: hermes-gitconfig
          mountPath: /opt/data/git-credential-helper
          subPath: git-credential-helper
        - name: hermes-github-token
          mountPath: /etc/hermes/github-token
          subPath: github-token
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-agent-data
      - name: kubeconfig
        configMap:
          name: hermes-kubeconfig
      - name: hermes-soul
        configMap:
          name: hermes-soul
      - name: hermes-gitconfig
        configMap:
          name: hermes-gitconfig
          defaultMode: 0555
      - name: hermes-github-token
        secret:
          secretName: hermes-agent-secrets
          items:
          - key: GITHUB_TOKEN
            path: github-token
          defaultMode: 0444
      - name: hermes-skills
        configMap:
          name: hermes-skills
      - name: hermes-config
        configMap:
          name: hermes-config
          defaultMode: 0644
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-data
  namespace: ai-services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: ai-services
  labels:
    app: hermes-agent
spec:
  type: ClusterIP
  ports:
  - port: 8642
    targetPort: 8642
    protocol: TCP
    name: api
  selector:
    app: hermes-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent-allow-openwebui
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: hermes-agent
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: open-webui
    ports:
    - protocol: TCP
      port: 8642