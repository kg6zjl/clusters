# Stable name for the webhook listener, so senders do not have to address a pod IP.
# In-cluster: http://hermes-webhook.ai-services.svc.cluster.local:8644/webhooks/<route>
apiVersion: v1
kind: Service
metadata:
  name: hermes-webhook
  namespace: ai-services
  labels:
    app: hermes-agent
    component: webhook
spec:
  type: ClusterIP
  selector:
    app: hermes-agent
  ports:
  - name: webhook
    port: 8644
    targetPort: 8644
    protocol: TCP
