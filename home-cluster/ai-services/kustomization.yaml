apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-services

resources:
  - network-policy.yaml
  - network-policy-openwebui.yaml
  - network-policy-github.yaml
  - network-policy-hermes-kubeapi.yaml
  - namespace.yaml
  - open-webui.yaml
  - open-webui-data-longhorn-pvc.yaml
  - ingressroute-openwebui.yaml
  - ingressroute-dashboard.yaml
  - dnsendpoint.yaml
  - dnsendpoint-dashboard.yaml
  - service-comfy.yaml
  - middleware-comfy.yaml
  - ingressroute-comfy.yaml
  - dnsendpoint-comfy.yaml
  - external-secrets.yaml
  - hermes-rbac.yaml
  - hermes-kubeconfig.yaml
  - hermes-agent.yaml
  - hermes-external-secret.yaml
  - hermes-gitconfig.yaml
  - hermes-soul-configmap.yaml
  - hermes-config-configmap.yaml

configMapGenerator:

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      group: externaldns.k8s.io
      version: v1alpha1
      kind: DNSEndpoint
      name: chat
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kube-system
