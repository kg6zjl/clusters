apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent-allow-github-egress
  namespace: ai-services
spec:
  podSelector:
    matchLabels:
      app: hermes-agent
  policyTypes:
  - Egress
  egress:
  # GitHub API/git tooling: GitHub's published ranges rotate across many
  # CIDRs (api.github.com currently resolves to Azure-hosted IPs), so follow
  # the open-webui internet-egress convention: 443/80 to anywhere. The token
  # is a fine-grained PAT scoped to kg6zjl/clusters only.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: ::/0
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443