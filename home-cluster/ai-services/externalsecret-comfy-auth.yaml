apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: comfy-basic-auth
  namespace: ai-services
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    # Same Secret name the middleware already references, so only the source moves.
    name: basic-auth-comfy
    template:
      engineVersion: v2
      # 1Password holds a readable username/password; the bcrypt line is derived here.
      data:
        users: '{{ htpasswd .username .password "bcrypt" }}'
  data:
    - secretKey: username
      remoteRef:
        key: comfy-basic-auth
        property: username
    - secretKey: password
      remoteRef:
        key: comfy-basic-auth
        property: password
