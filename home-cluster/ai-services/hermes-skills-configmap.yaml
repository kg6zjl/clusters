apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-skills
  namespace: ai-services
  labels:
    app: hermes-skills
data:
  # ConfigMap keys may not contain '/', so the skill tree is flattened here
  # (<name>.md per skill). The initContainer re-derives the
  # <category>/<skill>/SKILL.md layout from the frontmatter on copy.
  cluster-operations.md: |
    ---
    name: cluster-operations
    description: GitOps cluster management: PRs only, no kubectl writes.
    category: devops
    version: 1.0.0
    author: Hermit
    ---
    
    # Cluster Operations — GitOps-Compliant Cluster Management
    
    **Use when:** Making any changes to the Kubernetes cluster, querying cluster state, or operating within the home-cluster environment.
    
    ## CRITICAL: Load Context Files First
    
    **Before ANY cluster operation, you MUST read these files:**
    
    1. **SOUL.md** (mounted at `/opt/data/SOUL.md`)
       - File path: `ai-services/hermes-soul-configmap.yaml`
       - Contains: Identity, constraints, truthfulness rules, operating environment
    
    2. **AGENTS.md** (located at `home-cluster/AGENTS.md`)
       - Contains: GitOps workflow, NetworkPolicy rules, security guidelines, CI/CD patterns
    
    ## GitOps Workflow (NON-NEGOTIABLE)
    
    **All cluster changes MUST go through:**
    
    1. Edit YAML manifests in repo
    2. Create branch from main
    3. Run pre-push checks: `task ci`, `gitleaks`, `trufflehog`
    4. Push branch, open PR
    5. Wait for CI green + user merge
    
    **NEVER use:** `kubectl apply`, `kubectl delete`, `helm install`, `helm upgrade`, `kubectl edit`, `kubectl patch`
    
    **kubectl is READ-ONLY only:** `get`, `describe`, `logs`, `cluster-info`, `auth can-i`
    
    ## Cluster Access
    
    - **kubectl available:** `/opt/data/.local/bin/kubectl`
    - **Direct access confirmed:** Yes, via RBAC ClusterRole
    
    ## Key Rules
    
    - **NetworkPolicies are default-deny** — check FIRST
    - **Secrets live in 1Password** via ESO
    - **Always read SOUL.md and AGENTS.md first** — this is not optional
    
    ## Quick Reference
    
    ```bash
    /opt/data/.local/bin/kubectl cluster-info
    kubectl get <resource> --all-namespaces
    ```
    
    **Status:** Active — load AGENTS.md and SOUL.md before all cluster operations.

  dns.md: |
    ---
    name: dns
    description: Debug DNS resolution failures — cluster CoreDNS and external DNS (DNSEndpoint/external-dns). DNS bites this cluster constantly.
    category: networking
    version: 1.0.0
    author: Hermit
    ---
    
    # DNS Debugging — Home Cluster
    
    **Use when:** A pod, service, URL, or hostname won't resolve ("no such host",
    "NAME or service not known", `Could not resolve host`, `Temporary failure in
    name resolution`), an ingress host times out, or anything DNS-related breaks.
    
    ## Rule of thumb
    
    DNS sits right next to NetworkPolicies in the "always bites us" category.
    **If DNS fails, check BOTH in this order:**
    
    1. **NetworkPolicy** — this cluster is default-deny. A pod that can't reach
       CoreDNS is a NetPol egress problem until proven otherwise (see AGENTS.md).
    2. **CoreDNS** itself — is it up, and does the pod have the right resolver?
    3. **External DNS** — does the public host have a `DNSEndpoint`?
    
    ## 1. Cluster DNS (CoreDNS)
    
    - CoreDNS runs in `kube-system`, exposed by Service `kube-dns`.
    - Its ClusterIP in this cluster is `10.152.183.10` (kube-dns service).
    - Pods get `/etc/resolv.conf` with `nameserver 10.152.183.10` and search
      domains `<ns>.svc.cluster.local svc.cluster.local cluster.local` + `ndots:5`.
    
    ### Diagnose from inside the problem namespace
    
    ```bash
    # What resolver/search domains does the failing pod actually have?
    kubectl exec -n <namespace> deploy/<app> -- cat /etc/resolv.conf
    
    # Resolve a service / external host (getent uses libc = what apps use)
    kubectl exec -n <namespace> deploy/<app> -- getent hosts <svc-name>.<ns>.svc.cluster.local
    kubectl exec -n <namespace> deploy/<app> -- getent hosts github.com
    
    # If dig/nslookup exists, use them; else use getent (always present) or python:
    kubectl exec -n <namespace> deploy/<app> -- python3 -c \
      'import socket; print(socket.gethostbyname("github.com"))'
    
    # Is CoreDNS up and healthy?
    kubectl get pods -n kube-system -l k8s-app=kube-dns
    kubectl logs -n kube-system -l k8s-app=kube-dns --tail=50
    kubectl describe svc kube-dns -n kube-system   # check the ClusterIP
    ```
    
    ### NetPol egress for DNS (the #1 cause)
    
    Every namespace needs an allow-DNS egress to `kube-system` (TCP **and** UDP 53):
    
    ```yaml
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-dns
      namespace: <ns>
    spec:
      podSelector: {}
      policyTypes:
      - Egress
      egress:
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    ```
    
    **A/B test (definitive):** from a pod in a namespace with NO NetPol (e.g.
    `default`) run the same `getent hosts <target>`. If it resolves there but
    times out in the target namespace → **the NetPol is blocking DNS, full stop.**
    
    ## 2. External DNS (public hostnames)
    
    Public `*.kube.stevearnett.com` hosts are registered via **external-dns
    `DNSEndpoint` CustomResources**, not manually.
    
    - Every service dir that has an `ingressroute.yaml` should also have a
      `dnsendpoint.yaml` with a `CNAME` to `kube.stevearnett.com`.
    - `kube.stevearnett.com` resolves to the MetalLB VIP `192.168.1.241`.
    
    ```yaml
    apiVersion: externaldns.k8s.io/v1alpha1
    kind: DNSEndpoint
    metadata:
      name: <svc>
      namespace: kube-system
    spec:
      endpoints:
      - dnsName: <svc>.kube.stevearnett.com
        recordType: CNAME
        targets:
        - kube.stevearnett.com
    ```
    
    ### Diagnose external DNS
    
    ```bash
    dig +short <host>.kube.stevearnett.com        # empty = no record
    dig +short kube.stevearnett.com               # should be 192.168.1.241
    rg -n "dnsName:" home-cluster/*/dnsendpoint*.yaml   # is a DNSEndpoint defined?
    ```
    
    **Real incident (do not repeat):** `security.kube.stevearnett.com` had an
    IngressRoute but NO DNSEndpoint → the host resolved nowhere externally.
    Fix: add the DNSEndpoint **in the same PR** as the IngressRoute.
    
    ## 3. Quick checklist
    
    - [ ] Pod `resolv.conf` points at `10.152.183.10` (kube-dns)
    - [ ] NetPol allows egress TCP+UDP 53 → `kube-system`
    - [ ] CoreDNS pods up; no errors in logs
    - [ ] `.svc.cluster.local` name is fully qualified in apps that need it
    - [ ] Public host has a `DNSEndpoint` CNAME → `kube.stevearnett.com` (192.168.1.241)
    - [ ] A/B test passed from a no-NetPol namespace
    
    **Status:** Active — DNS + NetPol + DNSEndpoint are the usual culprits.
  github-status.md: |
    ---
    name: github-status
    description: Check GitHub's live status and unresolved incidents. Use instead of guessing or querying knowledge bases.
    category: devops
    version: 1.0.0
    author: Hermit
    ---
    
    # GitHub Status Check
    
    **Use when:** Asked whether GitHub is down / having issues, why a GitHub API
    call fails intermittently, or before blaming a workflow, push, or PR on
    GitHub. **Never** fabricate status or "query a knowledge base" — poll the
    real public status page.
    
    ## The status page
    
    GitHub's public status page is a Statuspage instance:
    
    - API base: `https://www.githubstatus.com/api/v2`
    - `status.json` → overall status (indicator `none`/`minor`/`major`/`critical`)
    - `incidents/unresolved.json` → active incidents
    - Human page: https://www.githubstatus.com
    
    ## Run the poll script
    
    The repo ships a poller (`jq` is available in the hermes runtime):
    
    ```bash
    # point at your repo checkout
    $HOME_DIR/scripts/github-status.sh          # text summary, exit 0 = OK
    $HOME_DIR/scripts/github-status.sh --json   # machine-readable
    ```
    
    If the script file is not present in the checkout, run the equivalent inline:
    
    ```bash
    curl -fsS https://www.githubstatus.com/api/v2/status.json
    curl -fsS https://www.githubstatus.com/api/v2/incidents/unresolved.json
    ```
    
    ## Interpreting the result
    
    - `0` / "All Systems Operational" → GitHub is fine; look elsewhere for the
      failure (network, NetPol, your code). Do not blame GitHub.
    - Non-zero with `[major]` or `[critical]` incidents → API/Web may be degraded;
      retry later and note it in the PR/issue.
    - `minor` incidents rarely affect APIs — check the incident names.
    
    ## Notes
    
    - Poll at most a few times with backoff; a single check is usually enough.
    - The GitHub *status* and your own *registry/runner health* are different
      things — don't conflate them.
    
    **Status:** Active — always truth from the real API, never a guess.
