apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: nodered
  labels:
    alert-on-down: "true"
spec:
  replicas: 1
  # Single ReadWriteOnce volume; a rolling update would need two pods on it at once.
  # Step 2 of the migration from RollingUpdate; see meshtastic/deployment.yaml for why
  # that transition cannot be done in a single apply. Flux owned rollingUpdate as of
  # #884, so dropping it here is a legal removal.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      labels:
        app: nodered
    spec:
      containers:
      - name: nodered
        image: nodered/node-red:5.0.7
        resources:
          requests:
            memory: 128Mi
        limits:
          memory: 256Mi
        ports:
        - containerPort: 1880
        volumeMounts:
        - name: nodered-data
          mountPath: /data
      volumes:
      - name: nodered-data
        persistentVolumeClaim:
          claimName: nodered-data-longhorn