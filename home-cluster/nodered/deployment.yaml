apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: nodered
  labels:
    alert-on-down: "true"
spec:
  replicas: 1
  # Single ReadWriteOnce volume; a rolling update would need two pods on it at once.
  # Step 1 of the migration to type: Recreate; see meshtastic/deployment.yaml for why
  # the transition cannot be done in a single apply.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      labels:
        app: nodered
    spec:
      containers:
      - name: nodered
        image: nodered/node-red:5.0.7
        ports:
        - containerPort: 1880
        volumeMounts:
        - name: nodered-data
          mountPath: /data
      volumes:
      - name: nodered-data
        persistentVolumeClaim:
          claimName: nodered-data-longhorn