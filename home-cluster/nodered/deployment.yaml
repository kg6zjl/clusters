apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodered
  namespace: nodered
  labels:
    alert-on-down: "true"
spec:
  # Scaled to 0 by the storage migration in nodered-migration.yaml: nothing may write
  # to nodered-data while the copy job reads it. Restored to 1 in the stage-2 PR once
  # the copy has been verified.
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: nodered
  template:
    metadata:
      labels:
        app: nodered
    spec:
      containers:
      - name: nodered
        image: nodered/node-red:5.0.7
        ports:
        - containerPort: 1880
        volumeMounts:
        - name: nodered-data
          mountPath: /data
      volumes:
      - name: nodered-data
        persistentVolumeClaim:
          claimName: nodered-data