apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nodered-allow-egress
  namespace: nodered
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: TCP
      port: 443
  # Mosquitto MQTT broker
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: mqtt
    ports:
    - protocol: TCP
      port: 1883
  # MeshMonitor API (meshtastic)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: meshtastic
    ports:
    - protocol: TCP
      port: 3001
  - to:
    - namespaceSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - protocol: TCP
      port: 1880