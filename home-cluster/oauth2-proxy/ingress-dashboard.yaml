---
# Dashboard ingress in auth namespace to access oauth2-proxy service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: auth
  annotations:
    external-dns.alpha.kubernetes.io/hostname: dashboard.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
    # oauth2-proxy answers 302 to the identity provider at `/`, so the default
    # http_2xx probe follows the redirect to accounts.google.com and reads this
    # host as down whenever Google answers slowly. Stop at the redirect instead.
    blackbox.stevearnett.com/module: http_2xx_or_redirect
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - dashboard.kube.stevearnett.com
  rules:
  - host: dashboard.kube.stevearnett.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
