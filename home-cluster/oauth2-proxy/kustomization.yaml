apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auth

resources:
  - network-policy.yaml
  - namespace.yaml
  - ingress-auth.yaml
  - ingress-dashboard.yaml
  - servicemonitor.yaml
  - external-secrets.yaml

# The reflector annotations that used to live here are gone: reflector was removed
# from the cluster once ESO took over secret distribution. These secrets are now
# created directly in `auth` by ESO, and nothing consumed the reflected copies.
generatorOptions:
  disableNameSuffixHash: true
