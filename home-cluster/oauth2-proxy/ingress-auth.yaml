apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  namespace: auth
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: auth.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
    # oauth2-proxy answers 302 to the identity provider at `/`, so the default
    # http_2xx probe follows the redirect to accounts.google.com and reads this
    # host as down whenever Google answers slowly. Stop at the redirect instead.
    blackbox.stevearnett.com/module: http_2xx_or_redirect
spec:
  tls:
  - hosts:
    - auth.kube.stevearnett.com
  rules:
  - host: auth.kube.stevearnett.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
