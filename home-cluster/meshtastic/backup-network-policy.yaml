apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshmonitor-backup-egress
  namespace: meshtastic
spec:
  podSelector:
    matchLabels:
      app: meshmonitor-backup
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 192.168.1.176/32
    ports:
    - protocol: TCP
      port: 139
    - protocol: TCP
      port: 445
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443