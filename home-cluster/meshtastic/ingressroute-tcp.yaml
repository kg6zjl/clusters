apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: meshmonitor-tcp-4404
  namespace: meshtastic
  annotations:
    external-dns.alpha.kubernetes.io/hostname: meshmonitor.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
spec:
  entryPoints:
    - meshmonitor-tcp          # or whatever entrypoint maps to host port 4404
  routes:
    - match: HostSNI(`meshmonitor.kube.stevearnett.com`)
      services:
        - name: meshmonitor
          port: 4404
          terminationDelay: 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: meshmonitor-tcp-4405
  namespace: meshtastic
spec:
  entryPoints:
    - meshmonitor-tcp-4405     # second entrypoint that maps to host port 4405
  routes:
    - match: HostSNI(`meshmonitor.kube.stevearnett.com`)
      services:
        - name: meshmonitor
          port: 4405
          terminationDelay: 0