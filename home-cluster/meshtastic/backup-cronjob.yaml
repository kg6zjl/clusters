apiVersion: batch/v1
kind: CronJob
metadata:
  name: meshmonitor-backup
  namespace: meshtastic
  labels:
    alert-on-down: "true"
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # A stuck pod must not wedge the schedule. ConcurrencyPolicy: Forbid (below)
      # counts a Pending pod as an active job, so one that never starts blocks every
      # later run silently - no failure, no alert on the job itself. A real run takes
      # under a minute; 30 minutes is a ceiling, not a limit.
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: meshmonitor-backup
        spec:
          restartPolicy: OnFailure
          # meshmonitor-data is a node-pinned hostPath PV (bound to thinkcentre02 by its
          # nodeAffinity), so this job MUST be co-located with the app or the kubelet
          # will never satisfy the PV's node requirement. With the previous Longhorn
          # claim this was belt-and-braces for RWO; on hostpath it is the only thing
          # making the backup schedulable at all.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: meshmonitor
                topologyKey: kubernetes.io/hostname
                namespaces:
                - meshtastic
          volumes:
          - name: meshmonitor-data
            persistentVolumeClaim:
              claimName: meshmonitor-data
              readOnly: true
          - name: nas-creds
            secret:
              secretName: meshmonitor-backup-creds
          containers:
          - name: backup
            image: alpine:3.24
            command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache samba-client >/dev/null 2>&1
              TS=$(date +%Y%m%d-%H%M%S)
              WORK=/work/${TS}
              mkdir -p "${WORK}"
              LATEST=$(ls -1dt /data/system-backups/*/ | head -1)
              echo "backing up ${LATEST}"
              cp -a "${LATEST}" "${WORK}/"
              cp -a /data/backups "${WORK}/device-backups" 2>/dev/null || true
              tar czf "/tmp/meshmonitor-${TS}.tar.gz" -C "/work" "${TS}"
              smbclient //192.168.1.176/Backups -W WORKGROUP -U "$(cat /creds/username)%$(cat /creds/password)" \
                -c "cd meshmonitor; put /tmp/meshmonitor-${TS}.tar.gz meshmonitor-${TS}.tar.gz"
              rm -f "/tmp/meshmonitor-${TS}.tar.gz"
              rm -rf "${WORK}"
            volumeMounts:
            - name: meshmonitor-data
              mountPath: /data
              readOnly: true
            - name: nas-creds
              mountPath: /creds
              readOnly: true