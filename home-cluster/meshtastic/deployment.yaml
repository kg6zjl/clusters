apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshmonitor
  namespace: meshtastic
  labels:
    alert-on-down: "true"
  annotations:
    configmap.reloader.stakater.com/reload: "meshmonitor-scripts"
    secret.reloader.stakater.com/reload: "meshtastic-admin"
spec:
  # ROLLED BACK to the hostpath claim on 2026-10-01. The Longhorn claim carries a
  # complete copy of the data (stage 2 of #729 verified 2.6G / 186 entries) and is
  # still healthy on disk, but its CSI mount step fails on every node with
  # `mount failed: exit status 32 ... already mounted or mount point busy`, which
  # leaves the pod in Init:0/1 indefinitely. Rebooting nodes and restarting the
  # longhorn-csi-plugin pods did not clear it.
  #
  # meshmonitor-data is the claim this app ran on for 148 days before the migration
  # and was only ever mounted read-only during it, so it still holds the original
  # 3.1G (meshmonitor.db + system-backups) per #636. It is a node-pinned hostPath PV
  # bound to thinkcentre02, which is where this pod now runs.
  #
  # Consequence to be aware of: this claim holds data as of 2026-09-26, so ~5 days of
  # accumulated node/telemetry history is not present. The nightly NAS backup on the
  # Longhorn claim is the only copy of that window.
  #
  # Do not re-point this at meshmonitor-data-longhorn until the CSI mount fault is
  # actually understood and fixed. It is not a stale-mount or leaked-namespace
  # problem: dmesg shows the kernel logging zero errors for those devices.
  replicas: 1
  # Single ReadWriteOnce volume; a rolling update would need two pods on it at once.
  # Note for future edits: switching an existing object from RollingUpdate to Recreate
  # cannot be done in one apply. spec.strategy.rollingUpdate is a defaulted field that
  # kustomize-controller never applied, so server-side apply will not remove it, and
  # "type: Recreate" plus a live rollingUpdate block is rejected by validation. The
  # migration landed via #884 (maxSurge 0 / maxUnavailable 1) and this commit.
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: meshmonitor
  template:
    metadata:
      labels:
        app: meshmonitor
      annotations:
        configmap.reloader.stakater.com/reload: "meshmonitor-scripts"
        # Changing the claim above changes the pod template, which is what forces the
        # replacement pod. Bumped alongside the hostpath rollback so the roll-out is
        # unambiguous in `kubectl describe` and in git blame.
        meshmonitor.stevearnett.com/data-claim: "hostpath-rollback-2026-10-01"
    spec:
      initContainers:
      - name: install-scripts
        image: busybox:1.38
        command:
        - /bin/sh
        - -c
        - |
          cp /config/banana.py /data/scripts/banana.py
          chmod +x /data/scripts/banana.py
          cp /config/test_gauge.py /data/scripts/test_gauge.py
          chmod +x /data/scripts/test_gauge.py
        volumeMounts:
        - name: meshmonitor-scripts
          mountPath: /config
          readOnly: true
        - name: meshmonitor-data
          mountPath: /data
      containers:
      - name: meshmonitor
        image: ghcr.io/yeraze/meshmonitor:4.16.2
        resources:
          requests:
            memory: 1280Mi
        limits:
          memory: 2560Mi

        ports:
        - containerPort: 3001
        - containerPort: 4404
        - containerPort: 4405
        env:
        - name: TZ
          value: America/Los_Angeles
        - name: MESHTASTIC_NODE_IP
          value: "192.168.1.43"
        - name: ALLOWED_ORIGINS
          value: "*"
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: meshtastic-admin
              key: ADMIN_USERNAME
        - name: TRUST_PROXY
          value: "true"
        - name: COOKIE_SECURE
          value: "true"
        - name: ENABLE_VIRTUAL_NODE
          value: "true"
        - name: ENABLE_AUTO_TRACEROUTE
          value: "true"
        - name: VIRTUAL_NODE_ALLOW_ADMIN_COMMANDS
          value: "true"
        - name: MQTT_ENABLED
          value: "true"
        - name: MQTT_JSON_ENABLED
          value: "true"
        - name: MQTT_ADDRESS
          value: "mosquitto.mqtt.svc.cluster.local"
        - name: MQTT_PORT
          value: "1883"
        - name: MQTT_USERNAME
          value: ""
        - name: MQTT_PASSWORD
          value: ""
        - name: MQTT_TOPIC_PREFIX
          value: "msh/US/bayarea"
        volumeMounts:
        - name: meshmonitor-data
          mountPath: /data
      volumes:
      - name: meshmonitor-data
        persistentVolumeClaim:
          claimName: meshmonitor-data
      - name: meshmonitor-scripts
        configMap:
          name: meshmonitor-scripts
          defaultMode: 0755
