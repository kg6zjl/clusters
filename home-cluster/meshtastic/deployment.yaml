apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshmonitor
  namespace: meshtastic
  labels:
    alert-on-down: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: meshmonitor
  template:
    metadata:
      labels:
        app: meshmonitor
      annotations:
        configmap.reloader.stakater.com/reload: "meshmonitor-scripts"
    spec:
      initContainers:
      - name: install-scripts
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          cp /config/banana.py /data/scripts/banana.py
          chmod +x /data/scripts/banana.py
          cp /config/test_gauge.py /data/scripts/test_gauge.py
          chmod +x /data/scripts/test_gauge.py
        volumeMounts:
        - name: meshmonitor-scripts
          mountPath: /config
          readOnly: true
        - name: meshmonitor-data
          mountPath: /data
      containers:
      - name: meshmonitor
        image: ghcr.io/yeraze/meshmonitor:4.16.1

        ports:
        - containerPort: 3001
        - containerPort: 4404
        - containerPort: 4405
        env:
        - name: TZ
          value: America/Los_Angeles
        - name: MESHTASTIC_NODE_IP
          value: "192.168.1.43"
        - name: ALLOWED_ORIGINS
          value: "*"
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: meshtastic-admin
              key: ADMIN_USERNAME
        - name: TRUST_PROXY
          value: "true"
        - name: COOKIE_SECURE
          value: "true"
        - name: ENABLE_VIRTUAL_NODE
          value: "true"
        - name: ENABLE_AUTO_TRACEROUTE
          value: "true"
        - name: VIRTUAL_NODE_ALLOW_ADMIN_COMMANDS
          value: "true"
        - name: MQTT_ENABLED
          value: "true"
        - name: MQTT_JSON_ENABLED
          value: "true"
        - name: MQTT_ADDRESS
          value: "mosquitto.mqtt.svc.cluster.local"
        - name: MQTT_PORT
          value: "1883"
        - name: MQTT_USERNAME
          value: ""
        - name: MQTT_PASSWORD
          value: ""
        - name: MQTT_TOPIC_PREFIX
          value: "msh/US/bayarea"
        volumeMounts:
        - name: meshmonitor-data
          mountPath: /data
      volumes:
      - name: meshmonitor-data
        persistentVolumeClaim:
          claimName: meshmonitor-data
      - name: meshmonitor-scripts
        configMap:
          name: meshmonitor-scripts
          defaultMode: 0755
