apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshmonitor
  namespace: meshtastic
  labels:
    alert-on-down: "true"
  annotations:
    configmap.reloader.stakater.com/reload: "meshmonitor-scripts"
    secret.reloader.stakater.com/reload: "meshtastic-admin"
spec:
  # Stage 2: the copy job completed (source 2.6G, 186 entries, both assertions passed)
  # and both consumers now read the Longhorn claim. The hostpath claim stays as the
  # rollback until the app has run a full cycle.
  replicas: 1
  # Single ReadWriteOnce volume; a rolling update would need two pods on it at once.
  # Note for future edits: switching an existing object from RollingUpdate to Recreate
  # cannot be done in one apply. spec.strategy.rollingUpdate is a defaulted field that
  # kustomize-controller never applied, so server-side apply will not remove it, and
  # "type: Recreate" plus a live rollingUpdate block is rejected by validation. The
  # migration landed via #884 (maxSurge 0 / maxUnavailable 1) and this commit.
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: meshmonitor
  template:
    metadata:
      labels:
        app: meshmonitor
      annotations:
        configmap.reloader.stakater.com/reload: "meshmonitor-scripts"
        # Forces a fresh pod rather than reviving 74f8b6cfd, which sat in Init:0/1 for
        # 133m across the Longhorn engine migration to thinkcentre02 and kept failing
        # its kubelet mount with exit status 32. Storage side is healthy (engine and
        # both replicas running); a new pod gets a fresh NodeStageVolume.
        meshmonitor.stevearnett.com/rwo-recreate-rollout: "2026-09-30"
    spec:
      initContainers:
      - name: install-scripts
        image: busybox:1.38
        command:
        - /bin/sh
        - -c
        - |
          cp /config/banana.py /data/scripts/banana.py
          chmod +x /data/scripts/banana.py
          cp /config/test_gauge.py /data/scripts/test_gauge.py
          chmod +x /data/scripts/test_gauge.py
        volumeMounts:
        - name: meshmonitor-scripts
          mountPath: /config
          readOnly: true
        - name: meshmonitor-data
          mountPath: /data
      containers:
      - name: meshmonitor
        image: ghcr.io/yeraze/meshmonitor:4.16.2

        ports:
        - containerPort: 3001
        - containerPort: 4404
        - containerPort: 4405
        env:
        - name: TZ
          value: America/Los_Angeles
        - name: MESHTASTIC_NODE_IP
          value: "192.168.1.43"
        - name: ALLOWED_ORIGINS
          value: "*"
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: meshtastic-admin
              key: ADMIN_USERNAME
        - name: TRUST_PROXY
          value: "true"
        - name: COOKIE_SECURE
          value: "true"
        - name: ENABLE_VIRTUAL_NODE
          value: "true"
        - name: ENABLE_AUTO_TRACEROUTE
          value: "true"
        - name: VIRTUAL_NODE_ALLOW_ADMIN_COMMANDS
          value: "true"
        - name: MQTT_ENABLED
          value: "true"
        - name: MQTT_JSON_ENABLED
          value: "true"
        - name: MQTT_ADDRESS
          value: "mosquitto.mqtt.svc.cluster.local"
        - name: MQTT_PORT
          value: "1883"
        - name: MQTT_USERNAME
          value: ""
        - name: MQTT_PASSWORD
          value: ""
        - name: MQTT_TOPIC_PREFIX
          value: "msh/US/bayarea"
        volumeMounts:
        - name: meshmonitor-data
          mountPath: /data
      volumes:
      - name: meshmonitor-data
        persistentVolumeClaim:
          claimName: meshmonitor-data-longhorn
      - name: meshmonitor-scripts
        configMap:
          name: meshmonitor-scripts
          defaultMode: 0755
