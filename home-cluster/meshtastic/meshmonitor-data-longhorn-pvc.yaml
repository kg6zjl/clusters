# Longhorn-backed replacement for meshmonitor's node-pinned config claim.
#
# meshmonitor-data is a 1Gi microk8s-hostpath claim whose PV carries a nodeAffinity
# tying it to whichever node created it. spec.storageClassName is immutable and
# Longhorn cannot adopt an existing volume, so migration means a new claim plus a
# copy - the two-stage pattern proven on prowlarr (#617/#620), jellyfin (#623/#625)
# and the four *arr apps (#626/#627).
#
# Declared in this file rather than in meshmonitor-migration.yaml so it survives
# stage 2. A Bound claim declared only in the file stage 2 deletes gets pruned by
# Flux, and with the longhorn class's Delete reclaim policy the volume and its
# data go with it.
#
# 10Gi. The original 2Gi was sized before anything was known about real usage, and the
# first copy attempt filled it to 2,142,208,000 of 2,147,483,648 bytes - 99.75% - which is
# the likeliest reason that migration stopped. Hostpath claims never enforced their
# request, so the source was over its declared 1Gi. Longhorn is thin-provisioned, so this
# is headroom rather than consumed disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meshmonitor-data-longhorn
  namespace: meshtastic
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
