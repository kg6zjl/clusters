apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meshmonitor-backup-creds
  namespace: meshtastic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: meshmonitor-backup-creds
  data:
    - secretKey: username
      remoteRef:
        key: certbot-username
        property: password
    - secretKey: password
      remoteRef:
        key: certbot-password
        property: password