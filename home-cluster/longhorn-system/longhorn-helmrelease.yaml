apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    createNamespace: true
    # Flux's default is 5m. A cold first install has to pull the manager,
    # instance-manager, share-manager and CSI sidecar images onto three nodes
    # and wait for the manager DaemonSet to report ready; 5m is too tight and
    # a failed install triggers the chart's pre-delete hook, which deletes the
    # Longhorn CRDs. Give it room.
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    csi:
      # MicroK8s does not place the kubelet root directory where Longhorn's
      # auto-detection looks - it probes for k3s/rke2 process arguments and
      # finds none, then dies with:
      #   failed to get arg root-dir. Need to specify "--kubelet-root-dir"
      # so the driver deployer never finishes and no CSIDriver is created.
      # Verify on any node with: grep -i root-dir /var/snap/microk8s/current/args/kubelet
      kubeletRootDir: /var/snap/microk8s/common/var/lib/kubelet
    # GitOps: the pre-upgrade check Job races Flux reconciliation and is
    # explicitly documented as something to disable for GitOps installs.
    preUpgradeChecker:
      jobEnabled: false
    defaultSettings:
      # Only three usable nodes (thinkcentre01/02/03). Two replicas tolerates
      # the loss of one node without every volume becoming degraded/offline.
      defaultReplicaCount: 2
      # Default is 200. Home-lab disks are small and shared with the OS and
      # the microk8s-hostpath PVs, so cap commitment at real capacity.
      storageOverProvisioningPercentage: 100
      # Default is 25. Keep ~15% of each disk free so a node cannot be filled
      # to the point where the kubelet and the OS suffer.
      storageMinimalAvailablePercentage: 15
      # Default data path is a directory on the root filesystem. All three
      # usable nodes have ample free space on /, and there is no separate data
      # disk mounted on them, so the default is the correct choice here.
      defaultDataPath: /var/lib/longhorn
      # No need to phone home to the Longhorn upgrade responder from a home lab.
      upgradeChecker: false
    persistence:
      # The cluster default now. The rule during migration was "flip this last", but five
      # PVC manifests omit storageClassName entirely (adsb x3, meshmonitor-data,
      # netalertx-data, nodered-data), so re-creating any of them lands on node-local
      # hostpath storage today. Replica counts are already 2, so a new volume costs 2x its
      # size, not the chart's default 3x.
      # microk8s-hostpath keeps its own default annotation - it is a MicroK8s addon object,
      # not ours to clear. With two defaults the newest StorageClass wins, which is this one.
      defaultClass: true
      # Replica count for the `longhorn` StorageClass. Must match
      # defaultSettings.defaultReplicaCount.
      defaultClassReplicaCount: 2
    # Exclude pi4-microk8s (aarch64, being decommissioned) from Longhorn.
    # nodeSelector is equality-only, so it cannot express "hostname NotIn".
    # pi4-microk8s is the only arm64 node, so selecting amd64 excludes it and
    # also future-proofs against other arm64 nodes being added.
    longhornManager:
      nodeSelector:
        kubernetes.io/arch: amd64
    longhornDriver:
      nodeSelector:
        kubernetes.io/arch: amd64
    longhornUI:
      nodeSelector:
        kubernetes.io/arch: amd64
    metrics:
      serviceMonitor:
        # Off by default. The chart's template carries no selector labels, but this Prometheus
        # selects on serviceMonitorSelector release=kube-prometheus-stack - which every scraped
        # ServiceMonitor here has. Without additionalLabels the ServiceMonitor is created and
        # Prometheus ignores it: metrics "enabled", still zero series.
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
        # Longhorn's series count is small; 30s matches the rest of the cluster.
        interval: 30s
