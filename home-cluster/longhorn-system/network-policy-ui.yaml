apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-ui-allow-traefik
  namespace: longhorn-system
spec:
  # Additive allow only. A default-deny here would sit between longhorn-manager and every
  # engine/instance-manager, so this namespace gets an allow, never a deny.
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        # Pod port, post-DNAT: the Service's port 80 lands on the container's 8000.
        - port: 8000
          protocol: TCP
