apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  # The chart's own longhorn-manager policy admits only Longhorn's components, so a scrape
  # from monitoring is dropped and presents as a timeout rather than a 403. Policies are
  # additive, so this adds the scraper instead of editing or widening the chart's rule.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9500
          protocol: TCP
