apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-ui-basic-auth
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: longhorn-ui-basic-auth
  data:
    # htpasswd line(s), "user:$2y$..." - never in git, which is why this is ESO.
    - secretKey: users
      remoteRef:
        key: longhorn-ui-basicauth
        property: users
