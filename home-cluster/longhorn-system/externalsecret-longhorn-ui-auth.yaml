apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-ui-basic-auth
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: longhorn-ui-basic-auth
    template:
      engineVersion: v2
      # Hash is derived, not stored: the 1Password item holds a readable
      # username/password pair, and the htpasswd line is built at sync time.
      data:
        users: '{{ htpasswd .username .password "bcrypt" }}'
  data:
    - secretKey: username
      remoteRef:
        key: longhorn-ui-basicauth
        property: username
    - secretKey: password
      remoteRef:
        key: longhorn-ui-basicauth
        property: password
