apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-default-deny
  namespace: registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-allow
  namespace: registry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Traefik serves registry.kube.stevearnett.com, so both the LAN clients and the kubelets that
    # pull images reach this pod through it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 5000
          protocol: TCP
    # kubelet pulls are not pod traffic: after the MetalLB hop the source is the node itself.
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - port: 5000
          protocol: TCP
    - from:
        - ipBlock:
            cidr: 10.1.0.0/16
      ports:
        - port: 5000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The OIDC issuer is https://kubernetes.default.svc, so zot fetches the discovery document from
    # the apiserver through its ClusterIP. A namespaceSelector cannot express this: the apiserver is
    # a host process, not a pod.
    - to:
        - ipBlock:
            cidr: 10.152.183.0/16
      ports:
        - port: 443
          protocol: TCP
    # That discovery document hands back a jwks_uri on a node IP and nodeport, which zot then has
    # to reach to verify any workload token. The host in that URL is not stable -- two reads
    # minutes apart returned 192.168.1.121 and 192.168.1.146 -- so the whole node subnet has to be
    # reachable on that port, not one address.
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - port: 16443
          protocol: TCP
