apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
data:
  # Shape follows the project's own examples/config-bearer-oidc-workload.json: accessControl
  # nests inside http, policies live under accessControl.repositories.<path>.
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcDelay": "12h",
        "gcInterval": "24h",
        "commit": true,
        "dedupe": true
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "realm": "zot",
        "compat": ["docker2s2"],
        "auth": {
          "bearer": {
            "realm": "zot",
            "service": "zot-service",
            "oidc": [
              {
                "issuer": "https://kubernetes.default.svc",
                "audiences": ["zot"],
                "claimMapping": {
                  "username": "claims.sub"
                },
                "certificateAuthorityFile": "/etc/zot/k8s-ca.crt"
              }
            ]
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "defaultPolicy": ["read"],
              "policies": [
                {
                  "users": ["system:serviceaccount:github-runners:registry-pusher"],
                  "actions": ["read", "create", "update"]
                }
              ]
            }
          }
        }
      },
      "extensions": {
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        }
      },
      "log": {
        "level": "info"
      }
    }
