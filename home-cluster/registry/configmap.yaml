apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
data:
  # Shape follows the project's own examples/config-bearer-oidc-workload.json: accessControl
  # nests inside http, policies live under accessControl.repositories.<path>. That example carries
  # "realm" only inside auth.bearer, so the stray top-level one is gone.
  #
  # realm tells a client where to take its credential. On a 401 zot answers
  # `WWW-Authenticate: Bearer realm=<realm>,service=...,scope=...` and docker/containerd fetch a token
  # from <realm> -- so it has to be an absolute URL. The bare string "zot" (both the vendor example's
  # value and what this file used to say) parses as a relative path and no client can follow it, which
  # is why nothing could ever authenticate. zot serves the endpoint at <namespace>/auth/token
  # (`TokenPath` in pkg/api/constants/consts.go) and accepts the credential as HTTP Basic,
  # password-only, per pkg/api/token_exchange.go (both read at the pinned v2.1.21 tag).
  #
  # service is what the challenge advertises to clients, and the vendor guidance is that it be the
  # registry host and port clients connect to -- the placeholder "zot-service" it shipped was neither.
  # The local token exchange does not validate service or scope, so the wrong value was inert, but an
  # advertised service no client can address is a 401 waiting for a real client that checks it.
  #
  # anonymousPolicy is deliberately absent. Under bearer auth it is inert -- bearerAuth replaces the
  # middleware that reads it and ends every unauthenticated request at 401 -- so it does nothing today,
  # and leaving it in would silently grant anonymous reads the day zot ships its unified middleware.
  # defaultPolicy is what governs, and it grants read to any identity zot can authenticate: any pod in
  # this cluster can mint an `audience: zot` token for its own ServiceAccount with no RBAC at all, so
  # repository reads are cluster-wide. That is accepted here (images are not secrets: kubectl, alpine,
  # the runner image), and it is why there is no per-repository confidentiality to lose. Only the
  # runner ServiceAccount may write. Scope the write policy to the repositories CI actually publishes
  # before any image here becomes load-bearing.
  #
  # log.level is `info`. Worth knowing before debugging an auth failure here: zot logs both
  # workload-token rejection paths at Debug -- `the OIDC token verification failed` and `the OIDC token
  # claim processing failed` (pkg/api/bearer_oidc.go) -- so at info a rejected token is a bare 401 with
  # no reason recorded anywhere, indistinguishable from a bad credential. It was debug for one evening
  # to find the colon bug in the Basic username; flip it back to debug to see a rejection reason, and
  # flip it back to info when done.
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcDelay": "12h",
        "gcInterval": "24h",
        "commit": true,
        "dedupe": true
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "compat": ["docker2s2"],
        "auth": {
          "bearer": {
            "realm": "https://registry.kube.stevearnett.com/zot/auth/token",
            "service": "registry.kube.stevearnett.com",
            "oidc": [
              {
                "issuer": "https://kubernetes.default.svc",
                "audiences": ["zot"],
                "claimMapping": {
                  "username": "claims.sub"
                },
                "certificateAuthorityFile": "/etc/zot-ca/ca.crt"
              }
            ]
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "defaultPolicy": ["read"],
              "policies": [
                {
                  "users": ["system:serviceaccount:github-runners:github-runner"],
                  "actions": ["read", "create", "update"]
                }
              ]
            }
          }
        }
      },
      "extensions": {
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        }
      },
      # TEMPORARY, revert to "info" once the cause is named. zot logs the *reason* it
      # refused a token only at debug; the trivy server's fetch of the runner image is
      # being refused and zot's info-level 401 says nothing about why.
      "log": {
        "level": "debug"
      }
    }
