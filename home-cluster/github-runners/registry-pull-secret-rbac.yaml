# Lets the registry's token rotator install the imagePullSecret this namespace's pods pull with.
#
# This grant lives here rather than in home-cluster/registry/ because that directory's kustomization
# sets `namespace: registry`, and kustomize's namespace transformer rewrites every object it renders --
# so a Role written there for this namespace lands in registry instead and the rotator gets a 403.
#
# The subject is a ServiceAccount that exists only to run that Job.
#
# Two rules, because `create` cannot be scoped by name. A create is a POST to the collection, so the
# authorization request carries no object name, and a rule with resourceNames matches nothing when there
# is no name to match -- the outcome is a flat denial, not a broad grant. Measured: with
# resourceNames on the create verb, the rotator's POST returned
#   403 secrets is forbidden ... cannot create resource "secrets" in API group "" in the namespace "github-runners"
# So `create` is granted unscoped -- the rotator may create any Secret in this namespace, and only this
# one. Everything that can be scoped is scoped: get and update are limited to the single name below.
#
# Narrowing this later does not require an unscoped verb: a server-side apply carries the name in the
# URL (PATCH .../secrets/registry-pull), so a resourceNames-scoped `patch` rule can match it, and SSA
# creates the object when it is absent. That swap is untested -- it needs a run to confirm the apiserver
# authorizes create-on-apply as `patch` -- so until it is proven, this grant stays as it is.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-pull-secret
  namespace: github-runners
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["registry-pull"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-pull-secret
  namespace: github-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-pull-secret
subjects:
  - kind: ServiceAccount
    name: registry-pull-rotator
    namespace: registry
