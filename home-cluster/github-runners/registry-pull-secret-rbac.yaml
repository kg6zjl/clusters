# Lets the registry's token rotator install the imagePullSecret this namespace's pods pull with.
#
# This grant lives here rather than in home-cluster/registry/ because that directory's kustomization
# sets `namespace: registry`, and kustomize's namespace transformer rewrites every object it renders --
# so a Role written there for this namespace lands in registry instead and the rotator gets a 403.
#
# The subject is a ServiceAccount that exists only to run that Job, and the grant covers one verb set on
# one Secret name. Caveat worth knowing: RBAC does not apply resourceNames to `create`, so that verb is
# in practice any-secret-in-this-namespace. The alternative -- shipping the Secret from git and having
# the Job only update it -- is worse, because Flux owns the fields it applies and would reset the token
# on every reconcile.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-pull-secret
  namespace: github-runners
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
    resourceNames: ["registry-pull"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-pull-secret
  namespace: github-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-pull-secret
subjects:
  - kind: ServiceAccount
    name: registry-pull-rotator
    namespace: registry
