apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-controller
  namespace: github-runners
spec:
  interval: 1h
  chart:
    spec:
      chart: actions-runner-controller
      version: 0.23.7
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # The controller reads its GitHub credentials from a Secret once at startup and never re-reads
  # them, so rotating credentials leaves it authenticating with a dead credential
  # (401 Bad credentials) until someone restarts it by hand. This annotation makes reloader
  # (already running in kube-system) restart the controller whenever github-runner-secret changes.
  # The chart template has no annotations field on the Deployment itself, so it is applied to the
  # rendered output.
  #
  # GITHUB_APP_PRIVATE_KEY is overridden to name the key file that the chart already mounts
  # read-only at /etc/actions-runner-controller. ARC treats this value as a path when it resolves
  # to a file and falls back to treating it as an inline PEM otherwise; the file form is what the
  # upstream --github-app-private-key flag documents, and it keeps the private key out of the
  # controller's process environment.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: actions-runner-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: actions-runner-controller
                annotations:
                  secret.reloader.stakater.com/reload: github-runner-secret
              spec:
                template:
                  metadata:
                    annotations:
                      arc.stevearnett.com/credentials: github-app
                  spec:
                    containers:
                      - name: manager
                        env:
                          - name: GITHUB_APP_PRIVATE_KEY
                            value: /etc/actions-runner-controller/github_app_private_key
  values:
    authSecret:
      enabled: true
      create: false
      name: github-runner-secret
    image:
      repository: summerwind/actions-runner-controller
    resources:
      limits:
        memory: 1Gi
    env:
      - name: REGISTRY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: registry-secrets
            key: REGISTRY_PASSWORD
            optional: true
