apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-controller
  namespace: github-runners
spec:
  interval: 1h
  chart:
    spec:
      chart: actions-runner-controller
      version: 0.23.7
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # The ARC controller reads GITHUB_TOKEN from a Secret once at startup and never re-reads it, so
  # rotating the runner PAT leaves it authenticating with a dead token (401 Bad credentials) until
  # someone restarts it by hand. This annotation makes reloader (already running in kube-system)
  # restart the controller whenever github-runner-secret changes. The chart template has no
  # annotations field on the Deployment itself, so it is applied to the rendered output.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: actions-runner-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: actions-runner-controller
                annotations:
                  secret.reloader.stakater.com/reload: github-runner-secret
              spec:
                template:
                  metadata:
                    annotations:
                      arc.stevearnett.com/credentials: github-app
                  spec:
                    containers:
                      - name: env-debug
                        image: busybox:1.36
                        command: ["sh", "-c"]
                        args:
                          - |
                            echo "GITHUB_* as resolved by kubelet (values never printed):"
                            env | grep -E '^GITHUB' | sort | awk -F= '{printf "%-34s len=%d\n", $1, length($2)}'
                            echo "--- full env var NAMES present ---"
                            env | cut -d= -f1 | sort | tr '\n' ' '
                            echo
                            sleep 3600
                        env:
                          - name: GITHUB_TOKEN
                            valueFrom:
                              secretKeyRef:
                                name: github-runner-secret
                                key: github_token
                                optional: true
                          - name: GITHUB_APP_ID
                            valueFrom:
                              secretKeyRef:
                                name: github-runner-secret
                                key: github_app_id
                                optional: true
                          - name: GITHUB_APP_INSTALLATION_ID
                            valueFrom:
                              secretKeyRef:
                                name: github-runner-secret
                                key: github_app_installation_id
                                optional: true
                          - name: GITHUB_APP_PRIVATE_KEY
                            valueFrom:
                              secretKeyRef:
                                name: github-runner-secret
                                key: github_app_private_key
                                optional: true
                          - name: GITHUB_BASICAUTH_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: github-runner-secret
                                key: github_basicauth_password
                                optional: true
  values:
    authSecret:
      enabled: true
      create: false
      name: github-runner-secret
    image:
      repository: summerwind/actions-runner-controller
    resources:
      limits:
        memory: 1Gi
    env:
      - name: REGISTRY_PASSWORD
        valueFrom:
          secretKeyRef:
            name: registry-secrets
            key: REGISTRY_PASSWORD
            optional: true
