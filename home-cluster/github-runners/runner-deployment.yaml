apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: github-runner
  namespace: github-runners
spec:
  replicas: 2
  template:
    spec:
      priorityClassName: system-cluster-critical
      repository: kg6zjl/clusters
      labels:
        - self-hosted
        - kubernetes
      image: summerwind/actions-runner:v2.337.0-ubuntu-24.04
      # init: only makes the node-local cache writable by the non-root runner. Keep it free of
      # network I/O: it runs on every pod, and nothing here may stall a pod before it registers.
      # A trufflehog warm was tried and dropped -- the trufflehog action runs the ghcr.io image via
      # the docker sidecar, never a binary under /opt/hostedtoolcache, and the 35MB download from
      # GitHub releases crawls (~250KB/s measured) while concurrent pods clobber the same target.
      initContainers:
        - name: toolcache-perms
          image: alpine:3.24
          command: ["sh", "-c", "chmod 1777 /opt/hostedtoolcache"]
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      containers:
        - name: runner
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      volumes:
        - name: toolcache
          hostPath:
            path: /var/lib/arc-toolcache
            type: DirectoryOrCreate
