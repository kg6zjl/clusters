apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: github-runner
  namespace: github-runners
spec:
  replicas: 2
  template:
    spec:
      priorityClassName: system-cluster-critical
      repository: kg6zjl/clusters
      labels:
        - self-hosted
        - kubernetes
      image: summerwind/actions-runner:v2.337.0-ubuntu-24.04
      # install-tools was removed: it wrote kubectl into /usr/local/bin (which the runner does not
      # mount) and fetched helmfile from a domain that does not resolve.
      # The cache is node-local so setup-* actions stop re-downloading a toolchain per job.
      initContainers:
        - name: toolcache-perms
          image: alpine:3.24
          command: ["sh", "-c", "chmod 1777 /opt/hostedtoolcache"]
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      containers:
        - name: runner
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      volumes:
        - name: toolcache
          hostPath:
            path: /var/lib/arc-toolcache
            type: DirectoryOrCreate
