apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: github-runner
  namespace: github-runners
spec:
  replicas: 2
  template:
    spec:
      priorityClassName: system-cluster-critical
      repository: kg6zjl/clusters
      labels:
        - self-hosted
        - kubernetes
      image: summerwind/actions-runner:v2.337.0-ubuntu-24.04
      # init: makes the node-local cache writable by the non-root runner, then warms
      # trufflehog into it once per node (pinned, checksum-verified from the project's own
      # checksums.txt). install-tools was removed: it wrote kubectl into /usr/local/bin,
      # which the runner never mounts, and fetched helmfile from a domain that does not resolve.
      initContainers:
        - name: toolcache
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /opt/hostedtoolcache/tools
              chmod 1777 /opt/hostedtoolcache
              # Warm once per node; later pods run only this test and exit.
              if [ -x /opt/hostedtoolcache/tools/trufflehog ]; then
                echo "tool cache already warm"
                exit 0
              fi
              apk add --no-cache curl
              cd /opt/hostedtoolcache/tools
              V=3.97.9
              curl -sSfLO "https://github.com/trufflesecurity/trufflehog/releases/download/v${V}/trufflehog_${V}_linux_amd64.tar.gz"
              curl -sSfLO "https://github.com/trufflesecurity/trufflehog/releases/download/v${V}/trufflehog_${V}_checksums.txt"
              sha256sum -c --ignore-missing "trufflehog_${V}_checksums.txt"
              tar -xzf "trufflehog_${V}_linux_amd64.tar.gz" trufflehog
              rm -f trufflehog_*.tar.gz trufflehog_*checksums.txt
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      containers:
        - name: runner
          # Available to every job step, so a failed workflow can post its own notification.
          # The URL comes from 1Password via ESO, never from a GitHub secret.
          env:
            - name: CI_DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: ci-notify-discord
                  key: CI_DISCORD_WEBHOOK
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      volumes:
        - name: toolcache
          hostPath:
            path: /var/lib/arc-toolcache
            type: DirectoryOrCreate
