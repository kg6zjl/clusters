apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: runner-toolcache-warmer
  namespace: github-runners
  labels:
    app.kubernetes.io/name: runner-toolcache-warmer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-toolcache-warmer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-toolcache-warmer
    spec:
      # Fills a cache and downloads a tarball; it needs no apiserver token.
      automountServiceAccountToken: false
      # The node-local cache the runner mounts at /opt/hostedtoolcache has to be filled by a pod
      # whose lifetime is not tied to a job. A runner init container cannot do it: the GitHub
      # release CDN delivers ~300KB/s from here, so the 35MB trufflehog tarball takes ~2 minutes,
      # and pods are recycled mid-download (rollout, autoscaler) so the cache never lands and every
      # job falls back to paying that download itself.
      #
      # Kyverno is the same story with a bigger tarball: 53MB, which measures as ~2m30s in the CI
      # job that needs it (148s of that job's 157s was the download; the policy tests themselves
      # take 1s). ci.yaml already probes /opt/hostedtoolcache/tools/kyverno before falling back to
      # downloading into $RUNNER_TEMP, so warming it here needs no change to that job.
      containers:
        - name: warmer
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              set -eu
              # Fail loudly rather than warming a tarball named for an empty version.
              : "${TRUFFLEHOG_VERSION:?TRUFFLEHOG_VERSION must be set}"
              : "${KYVERNO_VERSION:?KYVERNO_VERSION must be set}"
              : "${PROMETHEUS_VERSION:?PROMETHEUS_VERSION must be set}"
              : "${ALERTMANAGER_VERSION:?ALERTMANAGER_VERSION must be set}"

              CACHE=/opt/hostedtoolcache/tools
              mkdir -p "$CACHE"
              chmod 1777 /opt/hostedtoolcache
              # alpine ships no curl, and busybox wget cannot retry or bound a stalled transfer.
              command -v curl >/dev/null || apk add --no-cache curl

              # warm <binary> <version> <base-url> <checksums-file> <tarball> [<member-path>]
              #
              # The per-tool version stamp is what makes a version bump re-warm: without it a
              # cached binary from an older pin would look "warm" forever, and the CI job that
              # consumes it would silently test against a CLI that no longer matches the pin.
              # Each tool gets its own stamp, named after its binary, because they can be at
              # different versions at the same time.
              #
              # <member-path> is for releases that nest their binaries one directory deep
              # (prometheus and alertmanager both do): name the member and strip that one
              # directory. A top-level member, which is the default, must not be stripped or
              # tar refuses the resulting empty name.
              warm() {
                BIN="$1"; VER="$2"; URL="$3"; SUMS="$4"; TARBALL="$5"; MEMBER="${6:-$1}"
                STRIP=0
                case "$MEMBER" in */*) STRIP=1 ;; esac
                cd "$CACHE"
                if [ -x "$BIN" ] && [ "$(cat ".${BIN}.version" 2>/dev/null)" = "$VER" ]; then
                  return 0
                fi
                echo "warming ${BIN} ${VER}"
                rm -rf ".warm-${BIN}"
                mkdir ".warm-${BIN}"
                cd ".warm-${BIN}"
                # Verify in a scratch dir and move the binary into place: a partial download must
                # never be visible to a runner, and `mv` within the volume is atomic.
                if curl -sSfL --retry 3 --retry-delay 10 --max-time 1800 -o "${TARBALL}" "${URL}/${TARBALL}" \
                   && curl -sSfL --retry 3 --retry-delay 10 --max-time 120 -o checksums.txt "${URL}/${SUMS}" \
                   && grep -F "${TARBALL}" checksums.txt > expected.txt \
                   && sha256sum -c expected.txt \
                   && tar -xzf "${TARBALL}" --strip-components="$STRIP" "${MEMBER}" \
                   && chmod 0755 "${BIN}"; then
                  cd "$CACHE"
                  mv -f ".warm-${BIN}/${BIN}" "${BIN}"
                  printf '%s\n' "$VER" > ".${BIN}.version"
                  rm -rf ".warm-${BIN}"
                  echo "warmed ${BIN} ${VER}"
                  return 0
                fi
                cd "$CACHE"
                rm -rf ".warm-${BIN}"
                echo "warm of ${BIN} failed"
                return 1
              }

              # One failed tool must not stop the other from being attempted, and the loop
              # period depends on whether everything landed: a warm cache needs nothing for an
              # hour, but after a failure it has to come back in 60s or every CI job that draws
              # a fresh runner in the meantime pays the full download on its own.
              while :; do
                OK=true

                warm trufflehog "$TRUFFLEHOG_VERSION" \
                  "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}" \
                  "trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt" \
                  "trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz" || OK=false

                # kyverno publishes one checksums.txt covering every platform it builds, so the
                # file name is not version-interpolated the way trufflehog's is. grep -F picks our
                # tarball's line out of it and sha256sum -c verifies only that one.
                warm kyverno "$KYVERNO_VERSION" \
                  "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}" \
                  "checksums.txt" \
                  "kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz" || OK=false

                # The two binaries the alerting checks in ci.yaml need. Prometheus is the big one:
                # 107MB compressed and measured at ~6 minutes on this link, which is why it is
                # warmed here rather than paid per job. Both nest the binary one directory deep.
                warm promtool "$PROMETHEUS_VERSION" \
                  "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}" \
                  "sha256sums.txt" \
                  "prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
                  "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" || OK=false

                warm amtool "$ALERTMANAGER_VERSION" \
                  "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}" \
                  "sha256sums.txt" \
                  "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" \
                  "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" || OK=false

                if [ "$OK" = true ]; then
                  sleep 3600
                else
                  echo "retrying in 60s"
                  sleep 60
                fi
              done
          env:
            # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
            - name: TRUFFLEHOG_VERSION
              value: "3.97.9"
            # renovate: datasource=github-releases depName=kyverno/kyverno
            - name: KYVERNO_VERSION
              value: "1.19.1"
            # renovate: datasource=github-releases depName=prometheus/prometheus
            - name: PROMETHEUS_VERSION
              value: "3.15.0"
            # renovate: datasource=github-releases depName=prometheus/alertmanager
            - name: ALERTMANAGER_VERSION
              value: "0.34.1"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      volumes:
        - name: toolcache
          hostPath:
            path: /var/lib/arc-toolcache
            type: DirectoryOrCreate
