apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: runner-toolcache-warmer
  namespace: github-runners
  labels:
    app.kubernetes.io/name: runner-toolcache-warmer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-toolcache-warmer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-toolcache-warmer
    spec:
      # The node-local cache the runner mounts at /opt/hostedtoolcache has to be filled by a pod
      # whose lifetime is not tied to a job. A runner init container cannot do it: the GitHub
      # release CDN delivers ~300KB/s from here, so the 35MB trufflehog tarball takes ~2 minutes,
      # and pods are recycled mid-download (rollout, autoscaler) so the cache never lands and every
      # job falls back to paying that download itself.
      containers:
        - name: warmer
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /opt/hostedtoolcache/tools
              chmod 1777 /opt/hostedtoolcache
              # alpine ships no curl, and busybox wget cannot retry or bound a stalled transfer.
              command -v curl >/dev/null || apk add --no-cache curl
              cd /opt/hostedtoolcache/tools
              V="${TRUFFLEHOG_VERSION:?}"
              DIR="trufflehog_${V}_linux_amd64"
              URL="https://github.com/trufflesecurity/trufflehog/releases/download/v${V}"
              while :; do
                # The version stamp is what makes a version bump re-warm: without it a cached
                # binary from an older pin would look "warm" forever.
                if [ -x trufflehog ] && [ "$(cat .version 2>/dev/null)" = "$V" ]; then
                  sleep 3600
                  continue
                fi
                echo "warming trufflehog ${V}"
                rm -rf .warm
                mkdir .warm
                cd .warm
                # Verify in a scratch dir and move the binary into place: a partial download must
                # never be visible to a runner, and `mv` within the volume is atomic.
                if curl -sSfL --retry 3 --retry-delay 10 --max-time 1800 -o "${DIR}.tar.gz" "${URL}/${DIR}.tar.gz" \
                   && curl -sSfL --retry 3 --retry-delay 10 --max-time 120 -o checksums.txt "${URL}/trufflehog_${V}_checksums.txt" \
                   && grep -F "${DIR}.tar.gz" checksums.txt > expected.txt \
                   && sha256sum -c expected.txt \
                   && tar -xzf "${DIR}.tar.gz" trufflehog \
                   && chmod 0755 trufflehog; then
                  cd ..
                  mv -f .warm/trufflehog trufflehog
                  printf '%s\n' "$V" > .version
                  rm -rf .warm
                  echo "warmed trufflehog ${V}"
                  sleep 3600
                else
                  cd ..
                  rm -rf .warm
                  echo "warm failed; retrying in 60s"
                  sleep 60
                fi
              done
          env:
            # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
            - name: TRUFFLEHOG_VERSION
              value: "3.97.9"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: toolcache
              mountPath: /opt/hostedtoolcache
      volumes:
        - name: toolcache
          hostPath:
            path: /var/lib/arc-toolcache
            type: DirectoryOrCreate
