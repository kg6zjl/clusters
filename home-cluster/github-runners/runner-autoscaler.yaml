apiVersion: actions.summerwind.dev/v1alpha1
kind: HorizontalRunnerAutoscaler
metadata:
  name: github-runner-autoscaler
  namespace: github-runners
spec:
  scaleTargetRef:
    kind: RunnerDeployment
    name: github-runner
  # 4 warm runners is the floor: a single PR consumes 3 runner slots
  # (Lint/Validate/Secret Scan), and with the old fixed replicas: 2 the third job
  # sat in the queue for 76-106s while the job itself took ~18s.
  minReplicas: 4
  maxReplicas: 12
  metrics:
    - type: PercentageRunnersBusy
      scaleUpThreshold: "0.75"
      scaleDownThreshold: "0.25"
      scaleUpFactor: "2"
      scaleDownFactor: "0.5"
  scaleDownDelaySecondsAfterScaleOut: 300
