# External Secrets - syncs from 1Password home-cluster vault
#
# The GitHub App authentication that used to live here is GONE. It could not work, and while it
# was present it actively blocked every runner pod from being created. See the note below.
#
# The single controller (arc-systems/arc-operator) now authenticates with a PAT, sourced from the
# `github-runner-token` 1Password item and declared in home-cluster/arc-systems/external-secrets.yaml.
# Do NOT re-add a GitHub App ExternalSecret here, and do NOT install a second copy of the ARC
# chart into this namespace. Two chart installs register two MutatingWebhookConfigurations that
# share the webhook name `mutate-runner-pod.webhook.actions.summerwind.dev`, and admission
# webhooks are all-or-nothing: a single denial vetoes the request. A second controller with
# unusable credentials therefore breaks runner creation for the healthy one too.
#
# Auth precedence inside one controller is basic-auth > PAT > GitHub App, so a non-empty
# `github_token` also wins over any App keys that happen to be present in the same Secret.
# (The `registry-auth` ExternalSecret that synced a shared registry password out of 1Password is
# gone: registry auth is now the runner ServiceAccount's projected OIDC token, verified by zot
# against the cluster's own issuer. There is no registry credential left to sync.)
---
# CI failure notifications. Same 1Password item and property as the Alertmanager Discord
# receiver and the Flux discord Provider, so a failed pipeline lands in the same channel as a
# failed reconcile. The URL is never written into the workflow file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ci-notify-discord
  namespace: github-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  # The PR-notifications channel, not the alerts channel: CI failures are PR activity, and the
  # alerts channel is reserved for security/ops pages. Same 1Password item the
  # clusters-pr-notify Crossplane webhook posts to.
  #
  # That item stores the URL in Discord's GitHub-compatible form (…/github), which accepts only
  # GitHub's own event payloads. This job sends a hand-built {"content": ...}, so the suffix is
  # removed here - the exact inverse of home-cluster/crossplane/external-secret.yaml, and
  # written the same way so either storage form works.
  target:
    name: ci-notify-discord
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        CI_DISCORD_WEBHOOK: '{{ .url | replace "/github" "" }}'
  data:
    - secretKey: url
      remoteRef:
        key: discord-pull-requests-webhook
        property: webhook-url
