# External Secrets - syncs from 1Password home-cluster vault
#
# The controller authenticates to the GitHub API as a GitHub App, not with a PAT. The three keys
# below are the ones the ARC chart already wires into the Deployment (it renders
# GITHUB_APP_ID / GITHUB_APP_INSTALLATION_ID / GITHUB_APP_PRIVATE_KEY as optional secretKeyRefs,
# so the controller picked them up for free). See github-app-manifest.json and
# bootstrap-github-app.sh for how these values get into 1Password.
#
# Do NOT re-add a github_token entry here. The controller's auth precedence is
# basic-auth > PAT > GitHub App (github/github.go, Config.NewClient), so a non-empty
# github_token silently wins and App auth is never reached. Only one method can be live.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-runner-secret
  namespace: github-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: github-runner-secret
  data:
    # App ID and Installation ID are int64 in the controller's config, so these two must be
    # bare digits with no whitespace or quotes. A non-numeric value is a startup crash, not a 401.
    - secretKey: github_app_id
      remoteRef:
        key: github-runner-app
        property: app-id
    - secretKey: github_app_installation_id
      remoteRef:
        key: github-runner-app
        property: installation-id
    # The full PEM, newlines and all. Written by bootstrap-github-app.sh via `op item edit`.
    - secretKey: github_app_private_key
      remoteRef:
        key: github-runner-app
        property: private-key

---
# Registry credentials for image builds
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-auth
  namespace: github-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: registry-auth
  data:
    - secretKey: REGISTRY_PASSWORD
      remoteRef:
        key: registry-htpasswd
        property: docker-password
    - secretKey: REGISTRY_USERNAME
      remoteRef:
        key: registry-htpasswd
        property: username
