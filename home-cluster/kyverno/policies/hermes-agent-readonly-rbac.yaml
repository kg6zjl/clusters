apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: hermes-agent-readonly-rbac
  annotations:
    policies.kyverno.io/title: Pin the Hermes agent ServiceAccount read-only
    policies.kyverno.io/category: RBAC
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ClusterRole,Role,ClusterRoleBinding,RoleBinding
    policies.kyverno.io/description: >-
      system:serviceaccount:ai-services:hermes-agent operates this cluster only
      through Git pull requests and holds get/list/watch today (ClusterRole
      hermes-agent, bound by ClusterRoleBinding hermes-agent). This policy keeps
      that true: its eponymous ClusterRole may not gain any verb outside
      get/list/watch, and the ServiceAccount may only be bound to one of the
      read-only ClusterRoles hermes-agent or view.
spec:
  # Background scans can evaluate objects already stored in the cluster, so the
  # existing ClusterRole hermes-agent and ClusterRoleBinding hermes-agent are
  # re-checked on every scan, not only when someone writes them.
  background: true
  # ROLLOUT STATE: Enforce, since 2026-10-01. The precondition was checked first, from
  # Kyverno's own result counters over 24h: pass 247 on both rules that should pass,
  # fail 0, error 0, and no ClusterPolicyReport existed (Kyverno deletes an empty one).
  webhookConfiguration:
    # Fail is defensible because these rules match RBAC objects only: a Kyverno outage
    # fails closed on privilege changes and blocks nothing else - not workload
    # admission, not Secret writes, not Flux applying any other resource. Roll back by
    # setting this to Ignore and the three failureAction fields to Audit.
    failurePolicy: Fail
  rules:
    - name: agent-clusterrole-readonly
      match:
        any:
          - resources:
              kinds:
                - ClusterRole
      preconditions:
        all:
          - key: "{{ request.object.metadata.name }}"
            operator: AnyIn
            value:
              - hermes-agent*
      validate:
        failureAction: Enforce
        message: >-
          ClusterRole '{{ request.object.metadata.name }}' is part of the read-only
          identity for system:serviceaccount:ai-services:hermes-agent and may only
          grant get/list/watch; it asks for a verb outside that set.
        deny:
          conditions:
            any:
              - key: "{{ request.object.rules[].verbs[] }}"
                operator: AnyNotIn
                value:
                  - get
                  - list
                  - watch
    - name: agent-role-readonly
      match:
        any:
          - resources:
              kinds:
                - Role
      preconditions:
        all:
          - key: "{{ request.object.metadata.name }}"
            operator: AnyIn
            value:
              - hermes-agent*
      validate:
        failureAction: Enforce
        message: >-
          Role '{{ request.object.metadata.name }}' shares the read-only identity
          naming convention for system:serviceaccount:ai-services:hermes-agent and
          may only grant get/list/watch.
        deny:
          conditions:
            any:
              - key: "{{ request.object.rules[].verbs[] }}"
                operator: AnyNotIn
                value:
                  - get
                  - list
                  - watch
    - name: agent-binding-readonly
      match:
        any:
          - resources:
              kinds:
                - ClusterRoleBinding
                - RoleBinding
      preconditions:
        all:
          - key: "{{ request.object.subjects[?name=='hermes-agent'].namespace }}"
            operator: AnyIn
            value:
              - ai-services
      validate:
        failureAction: Enforce
        message: >-
          system:serviceaccount:ai-services:hermes-agent may only be bound to the
          read-only ClusterRoles 'hermes-agent' or 'view'. This binding grants it
          '{{ request.object.roleRef.name }}' ({{ request.object.roleRef.kind }}),
          which is neither.
        deny:
          conditions:
            any:
              - key: "{{ request.object.roleRef.kind }}"
                operator: NotEquals
                value: ClusterRole
              - key: "{{ request.object.roleRef.name }}"
                operator: AnyNotIn
                value:
                  - hermes-agent
                  - view
