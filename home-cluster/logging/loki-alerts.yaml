apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: loki
  namespace: logging
  labels:
    prometheus: kube-prometheus-stack-prometheus
    app: kube-prometheus-stack-prometheus
spec:
  groups:
  # Loki's own charts ship alerts for Loki being broken. These are for the two
  # failures that are specific to running it on a 5Gi volume on a home cluster:
  # the volume filling up, and the StatefulSet not coming up at all. Both are
  # grounded in metrics that are already being scraped here - checked against the
  # live cluster before this was written, not assumed.
  - name: loki
    rules:
    # The failure mode the ticket calls out: retention_period does nothing on its
    # own, and without the compactor actually deleting chunks the volume fills
    # silently and the first sign is Loki failing to write. This is measured off
    # the PVC, so it catches a stalled compactor, an unexpected log volume spike,
    # or a log loop, without depending on which of those it was.
    # kubelet_volume_stats_* is scraped by the existing kubelet ServiceMonitor and
    # carries a namespace label; it only reports for volumes mounted on a node,
    # which is fine here because LokiNotReady covers the pod being gone.
    - alert: LokiVolumeFillingUp
      expr: |
        kubelet_volume_stats_used_bytes{namespace="logging"}
        / kubelet_volume_stats_capacity_bytes{namespace="logging"} > 0.85
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Loki log volume is {{ printf \"%.0f\" (mul $value 100) }}% full"
        description: "kubelet_volume_stats_used_bytes is above 85% of the Longhorn PVC. At 7d retention the volume should sit near steady state.
          Sustained growth means the compactor is not deleting chunks (compactor.retention_enabled) or something is emitting far more logs than expected."
    - alert: LokiVolumeFull
      expr: |
        kubelet_volume_stats_used_bytes{namespace="logging"}
        / kubelet_volume_stats_capacity_bytes{namespace="logging"} > 0.95
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Loki log volume is {{ printf \"%.0f\" (mul $value 100) }}% full"
        description: "Loki has under 5% of its 5Gi PVC left and is about to start failing writes. Grow singleBinary.persistence.size or shorten limits_config.retention_period."
    # The StatefulSet is a StatefulSet, so the existing ProdServiceDown rule
    # (deployments) does not cover it. Selected on namespace and name, which are
    # always present on this metric.
    - alert: LokiNotReady
      expr: kube_statefulset_status_replicas_ready{namespace="logging",statefulset="loki"} == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Loki has no ready replicas"
        description: "StatefulSet loki in logging has had zero ready replicas for 10 minutes. No logs are being ingested or queryable until this clears."
