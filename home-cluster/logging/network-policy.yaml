# Log collection needs less network access than it looks like it needs.
#
# Alloy reads /var/log/pods through a hostPath mount: that is a filesystem read
# on the node, not cross-namespace traffic, so collecting logs from every other
# namespace does NOT require per-namespace ingress rules here. The path itself
# encodes namespace/pod/container.
#
# What is left is small: the API server (Alloy's pod discovery), DNS, and
# Grafana/Prometheus in from monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logging-allow
  namespace: logging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Same namespace, all ports: Alloy and loki-canary pushing to Loki (3100), and
  # Loki talking to itself over the ring/memberlist (7946) and gRPC (9095).
  # Same trust domain, and enumerating Loki's internal ports here would break
  # silently the next time the chart changes one.
  - from:
    - podSelector: {}
  # monitoring only, and only the ports monitoring actually uses: Grafana queries
  # Loki (3100), Prometheus scrapes Loki (3100), the canary's metrics (3500) and
  # Alloy's own metrics (12345). Not namespaceSelector: {} - no other namespace
  # has any business talking to Loki.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 3100
    - protocol: TCP
      port: 3500
    - protocol: TCP
      port: 12345
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Alloy's discovery.kubernetes needs the kube-apiserver, which is a HOST
  # process and NOT a pod: a namespaceSelector-only egress rule does not cover
  # it. It needs ipBlocks for both the service CIDR (ClusterIP, 443) and the node
  # LAN subnet post-DNAT (the apiserver secure port, 16443). Same pattern as
  # ai-services/network-policy-hermes-kubeapi.yaml.
  - to:
    - ipBlock:
        cidr: 10.152.183.0/16
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 16443
