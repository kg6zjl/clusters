apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    # A cold install pulls the Loki and canary images onto three nodes. Flux's
    # default of 5m is tight for that, and a failed install leaves the release
    # in a state Flux keeps retrying.
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
  values:
    # Single binary: one StatefulSet running every Loki target (distributor,
    # ingester, querier, compactor). Read/write separation buys nothing at this
    # scale and would triple the pod count and the memory footprint.
    deploymentMode: SingleBinary

    # Least privilege. The chart's default creates a ClusterRole granting
    # get/watch/list on configmaps and secrets in EVERY namespace, bound to
    # Loki's ServiceAccount, purely so its rules sidecar can watch rule ConfigMaps.
    # Nothing needs that here: the sidecar is disabled below (there is no ruler
    # running to load rules into - ruler.replicas is 0 in single binary), and with
    # rbac.namespaced the chart creates no ClusterRole/Role at all instead of
    # cluster-wide read on every secret in the cluster.
    rbac:
      namespaced: true

    sidecar:
      rules:
        # Chart default is true, which runs a k8s-sidecar container watching for
        # ConfigMaps labelled `loki_rule` to feed the ruler. No ruler runs here,
        # so this is a container and a (cluster-wide, by default) RBAC grant for
        # nothing.
        enabled: false

    # The chart's write/read/backend replica defaults are 3 each, and it refuses
    # to render if those coexist with a non-zero singleBinary replica count
    # ("more than zero replicas configured for both the single binary and simple
    # scalable targets"). Zeroing them is what the chart's own
    # single-binary-values.yaml does. The distributed targets (ingester, querier,
    # queryFrontend, queryScheduler, distributor, compactor, indexGateway)
    # already default to 0 replicas and need no entry.
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0

    gateway:
      # Chart default is true, which deploys an nginx gateway in front of Loki.
      # It exists to route between read and write paths and to hold basic-auth
      # tenants. Single binary has one query path and auth is off, so it would
      # be an extra pod and an extra hop for no benefit.
      enabled: false

    chunksCache:
      # Chart default is true and requests 8Gi of memcached for chunk caching.
      # With 5Gi of storage and a modest log volume that cache is larger than the
      # data set it caches - it would cost more memory than Loki itself.
      enabled: false

    resultsCache:
      # Same as chunksCache: chart default true, 1Gi of memcached.
      enabled: false

    loki:
      # Single tenant. Every pusher (Alloy, the canary) and every reader
      # (Grafana, the ServiceMonitor scrape) is inside this cluster, and there is
      # no multi-tenancy to enforce. With auth off, no component needs an
      # X-Scope-OrgID header and the Grafana datasource needs no credentials.
      auth_enabled: false

      commonConfig:
        # One replica of a single binary is the only writer.
        replication_factor: 1

      storage:
        # Chunks and the TSDB index live on the Longhorn PVC mounted at /var/loki.
        type: filesystem

      schemaConfig:
        # Loki refuses to start without an explicit schema. v13/tsdb is the
        # current schema; it must be set explicitly because there is no default.
        configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

      limits_config:
        # 7 days of retention. The ticket sized this at 5Gi comfortably; see the
        # LokiPvcFillingUp alert in loki-alerts.yaml, which is what actually
        # catches the volume filling before the disk does.
        retention_period: 168h

      compactor:
        # THE IMPORTANT ONE: retention_period alone does NOT delete anything. The
        # compactor is the component that walks the index and removes chunks past
        # the retention period. With the compactor off, the PVC fills silently
        # forever and the alert fires only after the fact.
        retention_enabled: true
        # Required by Loki whenever retention_enabled is true - the object store
        # used to keep the delete requests. Filesystem here, matching storage.
        delete_request_store: filesystem

    singleBinary:
      replicas: 1

      resources:
        requests:
          cpu: 100m
          memory: 512M
        limits:
          cpu: 2
          memory: 1G

      persistence:
        enabled: true
        size: 5Gi
        # Explicit Longhorn, not the cluster default (microk8s-hostpath). Logs
        # are the one data set here that must survive the node the pod lands on,
        # and the StorageClass carries defaultReplicaCount 2.
        storageClass: longhorn
        accessModes:
        - ReadWriteOnce

    lokiCanary:
      # Enabled by default. A DaemonSet that writes a log line every second and
      # reads it back, which is what makes LokiCanaryLatency (see
      # monitoring.rules below) meaningful: it measures the write-to-readable
      # round trip rather than just "the process is up".
      enabled: true

    monitoring:
      serviceMonitor:
        # Prometheus discovers ServiceMonitors in every namespace
        # (serviceMonitorNamespaceSelector is {} in kube-prometheus-stack), so
        # this scrapes Loki and the canary without touching that release.
        enabled: true
      rules:
        # The chart's own recording rules and alerts (request errors, panics,
        # latency, canary latency, too many compactors). Cross-namespace rule
        # discovery uses ruleNamespaceSelector, which is {} by the same chart
        # default that already scrapes ServiceMonitors outside monitoring.
        enabled: true
      dashboards:
        enabled: true
        # The Loki dashboards ConfigMap has to land in monitoring: the Grafana
        # dashboards sidecar runs in monitoring and only watches namespaces
        # beyond its own if searchNamespace is set, which this release does not
        # do. Same namespace is the path that is already proven to work.
        namespace: monitoring
