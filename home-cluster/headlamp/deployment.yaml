apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    configmap.reloader.stakater.com/reload: "headlamp-kubeconfig"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      volumes:
        - name: kubeconfig
          configMap:
            name: headlamp-kubeconfig
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.45.0
          imagePullPolicy: IfNotPresent
          args:
            - "-kubeconfig=/home/headlamp/.config/Headlamp/kubeconfigs/config"
            - "-plugins-dir=/headlamp/plugins"
            # Built-in OIDC against Dex (home-cluster/sso). Flag names verified against the
            # Headlamp v0.45.0 chart's rendered templates, not from memory.
            #
            # -oidc-callback-url is set explicitly rather than derived from request headers.
            # Headlamp would otherwise guess the scheme from X-Forwarded-Proto; pinning it means
            # a Traefik middleware that stops sending that header cannot silently break login.
            # It must match the redirectURI registered on the Dex static client exactly.
            - "-oidc-client-id=headlamp"
            - "-oidc-idp-issuer-url=https://sso.kube.stevearnett.com/dex"
            - "-oidc-callback-url=https://headlamp.kube.stevearnett.com/oidc-callback"
            - "-oidc-scopes=openid,profile,email"
            # PKCE: this client is public and has no secret, so the authorization code is
            # useless without the verifier only this flow's initiator holds.
            - "-oidc-use-pkce=true"
          ports:
            - name: http
              containerPort: 4466
          volumeMounts:
            - name: kubeconfig
              mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
