apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plane
spec:
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: plane-ce
      version: "1.8.4"
      sourceRef:
        kind: HelmRepository
        name: plane
        namespace: plane
  values:
    planeVersion: v1.4.2
    ingress:
      enabled: true
      appHost: kanban.kube.stevearnett.com
      minioHost: ""
      rabbitmqHost: ""
      ingressClass: traefik
      traefik:
        entryPoints:
          - websecure
    ssl:
      externalTermination: true
    postgres:
      storageClass: longhorn
      volumeSize: 10Gi
    redis:
      storageClass: longhorn
      volumeSize: 1Gi
    minio:
      storageClass: longhorn
      volumeSize: 10Gi
    rabbitmq:
      storageClass: longhorn
      volumeSize: 1Gi
    external_secrets:
      app_env_existingSecret: plane-app-env
      live_env_existingSecret: plane-live-env
      pgdb_existingSecret: plane-pgdb
      rabbitmq_existingSecret: plane-rabbitmq
      doc_store_existingSecret: plane-doc-store
    env:
      requireExplicitSecrets: true
      pgdb_username: plane
      pgdb_name: plane
      docstore_bucket: uploads
      enable_drf_spectacular: true
