apiVersion: batch/v1
kind: Job
metadata:
  # Bump the suffix to run again; Job names are immutable. Delete this file when the
  # run is finished and Flux prunes the Job. Deliberately no ttlSecondsAfterFinished:
  # a self-deleting Job looks like a missing resource to Flux and re-runs forever.
  name: unifi-audit-20260929
  namespace: unifi
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: audit
        image: python:3.13-alpine
        # The official python images define CMD, not ENTRYPOINT, so without this the
        # first arg becomes the command and the pod dies with `exec: "-c": not found`.
        command:
        - python3
        args:
        - -c
        - |
          # Reads the gateway config with the read-only account and prints a whitelisted
          # subset. Never prints credentials, cookies or the CSRF token.
          import http.cookiejar, json, os, ssl, urllib.request

          BASE = "https://192.168.1.1"  # self-signed CN=unifi.local, so verification is off by design
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()),
              urllib.request.HTTPSHandler(context=ctx),
          )

          login = urllib.request.Request(
              BASE + "/api/auth/login",
              data=json.dumps({
                  "username": os.environ["username"],
                  "password": os.environ["password"],
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          csrf = opener.open(login).headers.get("X-CSRF-Token", "")
          print("login: ok, csrf header present:", bool(csrf))

          KEEP = ("_id", "name", "enabled", "description", "domains", "regions",
                  "network", "target_devices", "target_subnets", "match_ip",
                  "match_ports", "vpn_client", "interface")

          for path in (
              "/proxy/network/api/s/default/rest/trafficroute",
              "/proxy/network/api/s/default/rest/trafficrule",
              "/proxy/network/api/s/default/rest/networkconf",
          ):
              try:
                  req = urllib.request.Request(BASE + path, headers={"X-CSRF-Token": csrf})
                  payload = json.load(opener.open(req))
              except Exception as exc:
                  print(path, "ERROR", type(exc).__name__, getattr(exc, "code", ""))
                  continue
              items = payload.get("data", [])
              print(path, "items:", len(items),
                    "keys:", sorted(items[0].keys())[:24] if items else [])
              for item in items:
                  print(" ", json.dumps({k: item[k] for k in KEEP if k in item}, default=str))
        envFrom:
        - secretRef:
            name: unifi-ro-creds
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
