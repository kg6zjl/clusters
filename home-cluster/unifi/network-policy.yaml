apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifi-allow-egress
  namespace: unifi
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # UniFi console, direct. UniFi OS proxies the Network app on 443 - :8443 fails.
  - to:
    - ipBlock:
        cidr: 192.168.1.1/32
    ports:
    - protocol: TCP
      port: 443
  ingress:
  # Prometheus scrapes the exporter from the monitoring namespace.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9130
