apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: unpoller
  namespace: unifi
  labels:
    app: unpoller
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: unpoller
  endpoints:
  - port: metrics
    path: /metrics
    # v5.2.x serves /metrics from a cache refreshed every 60s, so scraping faster
    # returns identical samples.
    interval: 60s
    scrapeTimeout: 30s
