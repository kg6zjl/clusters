apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mqtt-allow-egress
  namespace: mqtt
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector: {}
  ingress:
  # Keep Traefik access (in case you ever put it behind an IngressRoute)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  # Allow home LAN / MetalLB traffic (this is what was missing)
  - from:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 1883
    - protocol: TCP
      port: 9001
