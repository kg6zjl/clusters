---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: sonarr.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
spec:
  tls:
  - hosts:
    - sonarr.kube.stevearnett.com
  rules:
  - host: sonarr.kube.stevearnett.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarr
            port:
              number: 8989
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
spec:
  selector:
    app: sonarr
  ports:
  - port: 8989
    targetPort: 8989
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  # Step 1 of a two-commit migration to Recreate.
  # The config claim is ReadWriteOnce and this is a single replica, so a RollingUpdate rollout
  # starts the new pod while the old pod still holds the volume on its node: the attach controller
  # refuses it (Multi-Attach), the new pod sits in ContainerCreating until progressDeadlineSeconds
  # marks the Deployment Failed, and Flux rolls the release back. Recreate frees the volume first.
  # Same defect class as jellyfin's chart-driven rollout (media/jellyfin-helmrelease.yaml).
  #
  # Recreate cannot be set in the same apply that removes rollingUpdate. strategy.rollingUpdate is
  # defaulted by the API server at create time, so no field manager ever owned it, and server-side
  # apply can only delete fields it owns -- asking it to drop an unowned field leaves the defaulted
  # object in place and the apply is rejected: "spec.strategy.rollingUpdate: Forbidden: may not be
  # specified when strategy 'type' is 'Recreate'". Stating the values that are already live makes
  # kustomize-controller the owner without changing anything in the cluster, which is what lets the
  # follow-up commit set type: Recreate with rollingUpdate: null.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: linuxserver/sonarr:version-4.0.20.3014
        # Measured over 14d: peak RSS 174 MiB. The limit is roughly 3x that peak so
        # an episode search across a large series library is absorbed instead of OOM-killed, while the request
        # stays under the peak so the scheduler does not reserve the headroom.
        # the headroom.
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: PUID
          value: "0"
        - name: PGID
          value: "0"
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 8989
          protocol: TCP
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: tv
          mountPath: /media
      volumes:
      - name: sonarr-config
        persistentVolumeClaim:
          # Longhorn-backed. The hostpath claim that pinned this pod to a single
          # node is gone, so this volume can attach anywhere.
          claimName: sonarr-config-longhorn
      - name: downloads
        hostPath:
          path: /mnt/nas/torrents/Downloads
          type: Directory
      - name: tv
        hostPath:
          path: /mnt/nas/tv
          type: DirectoryOrCreate
