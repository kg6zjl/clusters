---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: overseerr.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
spec:
  tls:
  - hosts:
    - overseerr.kube.stevearnett.com
  rules:
  - host: overseerr.kube.stevearnett.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: seerr
            port:
              number: 5055
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
  labels:
    alert-on-down: "true"
spec:
  replicas: 1
  # The config claim is ReadWriteOnce and this is a single replica, so a RollingUpdate rollout
  # starts the new pod while the old pod still holds the volume on its node: the attach controller
  # refuses it (Multi-Attach), the new pod sits in ContainerCreating until progressDeadlineSeconds
  # marks the Deployment Failed, and Flux rolls the release back. Recreate frees the volume first.
  # Same defect class as jellyfin's chart-driven rollout (media/jellyfin-helmrelease.yaml).
  #
  # rollingUpdate: null is load-bearing. The API server defaults this block in, so left alone it
  # survives next to type: Recreate and the apply is rejected with "spec.strategy.rollingUpdate:
  # Forbidden: may not be specified when strategy 'type' is 'Recreate'". Writing null deletes it
  # instead. That only works because #865 first made kustomize-controller the owner of this block.
  strategy:
    type: Recreate
    rollingUpdate: null
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: seerr
        image: seerr/seerr:v3.4.1
        # Measured over 14d: peak RSS 237 MiB. The limit is roughly 3x that peak so
        # a bulk request or discover sweep is absorbed instead of OOM-killed, while the request
        # stays under the peak so the scheduler does not reserve the headroom.
        # the headroom.
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 768Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: LOG_LEVEL
          value: info
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 5055
          protocol: TCP
        volumeMounts:
        - name: seerr-config
          mountPath: /app/config
      volumes:
      - name: seerr-config
        persistentVolumeClaim:
          # Longhorn-backed. The hostpath claim that pinned this pod to a single
          # node is gone, so this volume can attach anywhere.
          claimName: seerr-config-longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
spec:
  selector:
    app: seerr
  ports:
  - port: 5055
    targetPort: 5055
    protocol: TCP
  type: ClusterIP
