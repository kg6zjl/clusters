# Stage 1 of moving prowlarr's config off the node-pinned hostpath volume.
#
# The old claim (prowlarr-config) sits on a hostpath PV with a nodeAffinity for
# thinkcentre01, so the pod can only ever run there. Longhorn cannot adopt an
# existing volume and spec.storageClassName is immutable, so migration means a
# new claim plus a copy.
#
# This file creates the Longhorn claim and the copy job. The Deployment is
# scaled to 0 in the same commit so the source volume is not being written to
# while it is read. Stage 2 repoints the Deployment at the new claim, scales it
# back to 1, and deletes this file.
#
# The copy job lands on thinkcentre01 on its own: the source PV's nodeAffinity
# pulls it there, which is also where the Longhorn volume attaches.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-longhorn
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
---
apiVersion: batch/v1
kind: Job
metadata:
  name: prowlarr-config-migrate
  namespace: media
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: copy
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              # give the Deployment's scale-down time to terminate the old pod
              sleep 20
              echo "source (hostpath, node-pinned to thinkcentre01):"
              ls -la /old | head -20
              du -sh /old
              cp -a /old/. /new/
              echo "destination (longhorn):"
              ls -la /new | head -20
              du -sh /new
              test -n "$(ls -A /new)"
          volumeMounts:
            - name: old
              mountPath: /old
            - name: new
              mountPath: /new
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: new
          persistentVolumeClaim:
            claimName: prowlarr-config-longhorn
