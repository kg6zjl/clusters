---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: lidarr.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
spec:
  tls:
  - hosts:
    - lidarr.kube.stevearnett.com
  rules:
  - host: lidarr.kube.stevearnett.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lidarr
            port:
              number: 8686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  namespace: media
spec:
  replicas: 1
  # The config claim is ReadWriteOnce and this is a single replica, so a RollingUpdate rollout
  # starts the new pod while the old pod still holds the volume on its node: the attach controller
  # refuses it (Multi-Attach), the new pod sits in ContainerCreating until progressDeadlineSeconds
  # marks the Deployment Failed, and Flux rolls the release back. Recreate frees the volume first.
  # Same defect class as jellyfin's chart-driven rollout (media/jellyfin-helmrelease.yaml).
  #
  # rollingUpdate: null is load-bearing. The API server defaults this block in, so left alone it
  # survives next to type: Recreate and the apply is rejected with "spec.strategy.rollingUpdate:
  # Forbidden: may not be specified when strategy 'type' is 'Recreate'". Writing null deletes it
  # instead. That only works because #865 first made kustomize-controller the owner of this block.
  strategy:
    type: Recreate
    rollingUpdate: null
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: lidarr
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      containers:
      - name: lidarr
        image: linuxserver/lidarr:version-3.1.0.4875
        # Measured over 14d: peak RSS 164 MiB. The limit is roughly 3x that peak so
        # a library reindex is absorbed instead of OOM-killed, while the request
        # stays under the peak so the scheduler does not reserve the headroom.
        # the headroom.
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: PUID
          value: "0"
        - name: PGID
          value: "0"
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 8686
          protocol: TCP
        volumeMounts:
        - name: lidarr-config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: music
          mountPath: /media
      volumes:
      - name: lidarr-config
        persistentVolumeClaim:
          # Longhorn-backed. The hostpath claim that pinned this pod to a single
          # node is gone, so this volume can attach anywhere.
          claimName: lidarr-config-longhorn
      - name: downloads
        hostPath:
          path: /mnt/nas/torrents/Downloads
          type: Directory
      - name: music
        hostPath:
          path: /mnt/nas/music
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  namespace: media
spec:
  selector:
    app: lidarr
  ports:
  - port: 8686
    targetPort: 8686
    protocol: TCP
  type: ClusterIP
