---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
  labels:
    alert-on-down: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
        # Measured over 14d: peak RSS 361 MiB, the highest in the namespace. Chromium
        # solving a Cloudflare challenge is spiky and leaks on some sites, so the limit is
        # ~3x the peak and the request sits just under it.
        # the headroom.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi
        ports:
        - containerPort: 8191
        env:
        - name: LOG_LEVEL
          value: info
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: media
spec:
  selector:
    app: flaresolverr
  ports:
  - protocol: TCP
    port: 8191
    targetPort: 8191
  type: ClusterIP
