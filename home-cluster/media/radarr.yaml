---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: radarr.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
spec:
  tls:
  - hosts:
    - radarr.kube.stevearnett.com
  rules:
  - host: radarr.kube.stevearnett.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: radarr
            port:
              number: 7878
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
spec:
  selector:
    app: radarr
  ports:
  - port: 7878
    targetPort: 7878
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  # The config claim is ReadWriteOnce and this is a single replica, so a RollingUpdate rollout
  # starts the new pod while the old pod still holds the volume on its node: the attach controller
  # refuses it (Multi-Attach), the new pod sits in ContainerCreating until progressDeadlineSeconds
  # marks the Deployment Failed, and Flux rolls the release back. Recreate frees the volume first.
  # Same defect class as jellyfin's chart-driven rollout (media/jellyfin-helmrelease.yaml).
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
      - name: radarr
        image: linuxserver/radarr:version-6.4.4.10685
        env:
        - name: PUID
          value: "0"
        - name: PGID
          value: "0"
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 7878
          protocol: TCP
        volumeMounts:
        - name: radarr-config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: movies
          mountPath: /media
      volumes:
      - name: radarr-config
        persistentVolumeClaim:
          # Longhorn-backed. The hostpath claim that pinned this pod to a single
          # node is gone, so this volume can attach anywhere.
          claimName: radarr-config-longhorn
      - name: downloads
        hostPath:
          path: /mnt/nas/torrents/Downloads
          type: Directory
      - name: movies
        hostPath:
          path: /mnt/nas/movies
          type: DirectoryOrCreate
