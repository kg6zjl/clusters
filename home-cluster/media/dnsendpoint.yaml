# Jellyfin is exposed by an IngressRoute, which external-dns cannot read (sources are
# service, ingress, crd), so the record is declared here rather than left to the route's
# external-dns annotation.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: media
  namespace: media
spec:
  endpoints:
  - dnsName: media.kube.stevearnett.com
    recordType: CNAME
    targets:
    - kube.stevearnett.com
