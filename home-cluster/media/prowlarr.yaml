---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/hostname: prowlarr.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
spec:
  tls:
  - hosts:
    - prowlarr.kube.stevearnett.com
  rules:
  - host: prowlarr.kube.stevearnett.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prowlarr
            port:
              number: 9696
---
# The previous microk8s-hostpath claim (prowlarr-config) has been removed: it
# pinned this pod to whichever node the volume was created on. This claim
# carries no node affinity, so the pod can land on any node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-longhorn
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: media
spec:
  replicas: 1
  # Step 1 of a two-commit migration to Recreate.
  # The config claim is ReadWriteOnce and this is a single replica, so a RollingUpdate rollout
  # starts the new pod while the old pod still holds the volume on its node: the attach controller
  # refuses it (Multi-Attach), the new pod sits in ContainerCreating until progressDeadlineSeconds
  # marks the Deployment Failed, and Flux rolls the release back. Recreate frees the volume first.
  # Same defect class as jellyfin's chart-driven rollout (media/jellyfin-helmrelease.yaml).
  #
  # Recreate cannot be set in the same apply that removes rollingUpdate. strategy.rollingUpdate is
  # defaulted by the API server at create time, so no field manager ever owned it, and server-side
  # apply can only delete fields it owns -- asking it to drop an unowned field leaves the defaulted
  # object in place and the apply is rejected: "spec.strategy.rollingUpdate: Forbidden: may not be
  # specified when strategy 'type' is 'Recreate'". Stating the values that are already live makes
  # kustomize-controller the owner without changing anything in the cluster, which is what lets the
  # follow-up commit set type: Recreate with rollingUpdate: null.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      initContainers:
      - name: disable-ipv6
        image: busybox:1.38
        command: ["sh", "-c", "sysctl -w net.ipv6.conf.all.disable_ipv6=1 && sysctl -w net.ipv6.conf.default.disable_ipv6=1"]
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.152.183.10
          - 1.1.1.1
          - 8.8.8.8
      containers:
      - name: prowlarr
        image: linuxserver/prowlarr:version-2.6.5.5623
        # Measured over 14d: peak RSS 168 MiB. The limit is roughly 3x that peak so
        # a release search is absorbed instead of OOM-killed, while the request
        # stays under the peak so the scheduler does not reserve the headroom.
        # the headroom.
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: PUID
          value: "0"
        - name: PGID
          value: "0"
        - name: TZ
          value: America/New_York
        ports:
        - containerPort: 9696
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        persistentVolumeClaim:
          # Longhorn-backed. The old node-pinned hostpath claim is gone.
          claimName: prowlarr-config-longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: media
spec:
  selector:
    app: prowlarr
  ports:
  - port: 9696
    targetPort: 9696
    protocol: TCP
  type: ClusterIP
