apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media
  install:
    createNamespace: true
    timeout: 15m
  upgrade:
    # Insurance for the cold 690 MB image the first Recreate rollout has to pull from scratch
    # (see deploymentStrategy below); the rollout itself is no longer blocked. The earlier
    # attempts were killed by the 5m default while wedged on a volume attach, not on the pull.
    remediation:
      retries: 3
    timeout: 15m
  values:
    # The chart defaults deploymentStrategy: RollingUpdate while also defaulting replicaCount: 1,
    # and the config claim is ReadWriteOnce. A rollout therefore starts the new pod while the old
    # pod still holds the volume, and the attach controller refuses it on any other node:
    #   Warning FailedAttachVolume Multi-Attach error for volume "pvc-c8bef3a5-..." Volume is
    #   already used by pod(s) jellyfin-746894f97-gjh6m
    # The new pod then sat in ContainerCreating until progressDeadlineSeconds: 600 marked the
    # Deployment Failed and Flux rolled the release back. The mount never completed, so the
    # image was never even pulled -- which is why no node had 10.11.11, and why a longer Helm
    # timeout could not have helped. Recreate terminates the old pod first, which is the only
    # correct strategy for a single replica on an RWO claim.
    deploymentStrategy:
      type: Recreate
    image:
      # Chart 3.2.0 is the newest release in the jellyfin-helm repo (Apr 2026)
      # and its appVersion is pinned at 10.11.8, whose Debian 13.4 base carries
      # 5 fixable Criticals. 10.11.11 is the newest 10.11.x image; drop this
      # override once a chart release ships a newer appVersion.
      tag: "10.11.11"
    service:
      type: ClusterIP
      port: 8096
    ingress:
      enabled: false
    persistence:
      config:
        # Stage 2: repointed at the Longhorn claim created in stage 1. The chart
        # stops rendering its own PVC once existingClaim is set, so the old
        # hostpath claim is pruned by this upgrade.
        existingClaim: jellyfin-config-longhorn
      cache:
        # Transcoding scratch. Measured at 8K in use against a 50Gi request that
        # pinned the pod to thinkcentre02 for nothing. Ephemeral is what it
        # always was.
        enabled: true
        type: emptyDir
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/nas
    volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
    volumeMounts:
      - name: dev-dri
        mountPath: /dev/dri
    podSecurityContext:
      supplementalGroups:
        - 44
        - 993
    securityContext:
      privileged: true
    jellyfin:
      env:
        - name: JELLYFIN_PublishedServerUrl
          value: "https://media.kube.stevearnett.com"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
