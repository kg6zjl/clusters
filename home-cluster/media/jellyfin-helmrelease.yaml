apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    # Stage 1 of the config migration: scaled to 0 so the copy job can read the
    # hostpath claim without it being written to. Stage 2 restores this to 1.
    replicaCount: 0
    service:
      type: ClusterIP
      port: 8096
    ingress:
      enabled: false
    persistence:
      config:
        enabled: true
        size: 10Gi
      cache:
        enabled: true
        size: 50Gi
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/nas
    volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
    volumeMounts:
      - name: dev-dri
        mountPath: /dev/dri
    podSecurityContext:
      supplementalGroups:
        - 44
        - 993
    securityContext:
      privileged: true
    jellyfin:
      env:
        - name: JELLYFIN_PublishedServerUrl
          value: "https://media.kube.stevearnett.com"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
