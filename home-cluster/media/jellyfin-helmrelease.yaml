apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  values:
    service:
      type: ClusterIP
      port: 8096
    ingress:
      enabled: false
    persistence:
      config:
        # Stage 2: repointed at the Longhorn claim created in stage 1. The chart
        # stops rendering its own PVC once existingClaim is set, so the old
        # hostpath claim is pruned by this upgrade.
        existingClaim: jellyfin-config-longhorn
      cache:
        # Transcoding scratch. Measured at 8K in use against a 50Gi request that
        # pinned the pod to thinkcentre02 for nothing. Ephemeral is what it
        # always was.
        enabled: true
        type: emptyDir
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/nas
    volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
    volumeMounts:
      - name: dev-dri
        mountPath: /dev/dri
    podSecurityContext:
      supplementalGroups:
        - 44
        - 993
    securityContext:
      privileged: true
    jellyfin:
      env:
        - name: JELLYFIN_PublishedServerUrl
          value: "https://media.kube.stevearnett.com"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
