apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media
  install:
    createNamespace: true
    timeout: 15m
  upgrade:
    # #848 overrides the chart's appVersion 10.11.8 with 10.11.11, a 690 MB image. Helm's
    # default 5m action timeout is shorter than this link's cold pull: four attempts each sat
    # in ContainerCreating past the deadline (kube-state-metrics 09:12Z and 09:20Z, phase
    # Pending, reason ContainerCreating, never ErrImagePull), the rollout was killed mid-pull
    # every time, and 10.11.11 ended up on no node at all. Raised so one cold pull can finish;
    # the pull sticks to the node afterwards, so this only cost matters on the first rollout.
    remediation:
      retries: 3
    timeout: 15m
  values:
    image:
      # Chart 3.2.0 is the newest release in the jellyfin-helm repo (Apr 2026)
      # and its appVersion is pinned at 10.11.8, whose Debian 13.4 base carries
      # 5 fixable Criticals. 10.11.11 is the newest 10.11.x image; drop this
      # override once a chart release ships a newer appVersion.
      tag: "10.11.11"
    service:
      type: ClusterIP
      port: 8096
    ingress:
      enabled: false
    persistence:
      config:
        # Stage 2: repointed at the Longhorn claim created in stage 1. The chart
        # stops rendering its own PVC once existingClaim is set, so the old
        # hostpath claim is pruned by this upgrade.
        existingClaim: jellyfin-config-longhorn
      cache:
        # Transcoding scratch. Measured at 8K in use against a 50Gi request that
        # pinned the pod to thinkcentre02 for nothing. Ephemeral is what it
        # always was.
        enabled: true
        type: emptyDir
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/nas
    volumes:
      - name: dev-dri
        hostPath:
          path: /dev/dri
    volumeMounts:
      - name: dev-dri
        mountPath: /dev/dri
    podSecurityContext:
      supplementalGroups:
        - 44
        - 993
    securityContext:
      privileged: true
    jellyfin:
      env:
        - name: JELLYFIN_PublishedServerUrl
          value: "https://media.kube.stevearnett.com"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
