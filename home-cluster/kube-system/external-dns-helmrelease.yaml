apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: 1.20.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: external-dns
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: external-dns
                annotations:
                  secret.reloader.stakater.com/reload: "cloudflare-api-creds-root"
  values:
    provider: cloudflare
    cloudflare:
      apiToken:
        secretName: cloudflare-api-creds-root
        secretKey: CLOUDFLARE_API_TOKEN
    domainFilters:
      - stevearnett.com
    txtOwnerId: home-cluster
    # The chart default is upsert-only, which never deletes: retire an Ingress and
    # its record sits in the zone forever - which is how auth./dashboard. outlived
    # the routes they pointed at. Deletion safety comes from the txt registry above,
    # not from the policy: external-dns only removes records carrying a matching
    # ownership TXT, and it still refuses to touch a hand-made one (it skips
    # nas.stevearnett.com with "owner id does not match ... required: home-cluster").
    # Declared explicitly because the current chart made policy a required value, so
    # the next chart bump fails the release until it is set here.
    policy: sync
    logLevel: debug
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-creds-root
            key: CLOUDFLARE_API_TOKEN
    extraArgs:
      - --source=crd
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --source=ingress
    rbac:
      additionalPermissions:
        - apiGroups:
            - "externaldns.k8s.io"
          resources:
            - "dnsendpoints"
          verbs:
            - "get"
            - "watch"
            - "list"
        - apiGroups:
            - "externaldns.k8s.io"
          resources:
            - "dnsendpoints/status"
          verbs:
            - "update"
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7979"
        prometheus.io/path: "/metrics"
