apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-operator
  namespace: arc-systems
spec:
  interval: 1h
  chart:
    spec:
      chart: actions-runner-controller
      version: 0.23.7
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  # The ARC controller reads its GitHub token from the controller-manager Secret once at startup and
  # never re-reads it, so rotating the token leaves it authenticating with a dead credential
  # (401 Bad credentials) until someone restarts it by hand. This annotation makes reloader
  # (already running in kube-system) restart the controller whenever that Secret changes. The chart
  # template has no annotations field on the Deployment itself, so it is applied to the rendered
  # output.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: arc-operator-actions-runner-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: arc-operator-actions-runner-controller
                annotations:
                  secret.reloader.stakater.com/reload: "controller-manager"
  values:
    certManagerEnabled: false
    githubTokenSecretRef:
      name: controller-manager
      key: github_token
