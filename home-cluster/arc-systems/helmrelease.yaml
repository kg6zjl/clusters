apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-operator
  namespace: arc-systems
spec:
  interval: 1h
  chart:
    spec:
      chart: actions-runner-controller
      version: 0.23.7
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: arc-operator-actions-runner-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: arc-operator-actions-runner-controller
                annotations:
                  secret.reloader.stakater.com/reload: "controller-manager"
  values:
    certManagerEnabled: false
    githubTokenSecretRef:
      name: controller-manager
      key: github_token
