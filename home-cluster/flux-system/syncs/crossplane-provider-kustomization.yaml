apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-provider
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./home-cluster/crossplane/provider
  prune: true
  sourceRef:
    kind: GitRepository
    name: clusters
  targetNamespace: crossplane-system
  timeout: 5m0s
  dependsOn:
    - name: crossplane
  # No healthChecks here. Flux's health assessment wants a Ready condition; a Crossplane Provider
  # reports Healthy/Installed only, so the check can never pass and this layer sits Unknown forever,
  # blocking the config layer behind it. The provider's CRDs come from its package independently, so
  # the next layer just retries if it races them.
