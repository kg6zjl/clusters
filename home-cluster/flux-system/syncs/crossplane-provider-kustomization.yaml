apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-provider
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./home-cluster/crossplane/provider
  prune: true
  sourceRef:
    kind: GitRepository
    name: clusters
  targetNamespace: crossplane-system
  timeout: 5m0s
  dependsOn:
    - name: crossplane
  # Ready on Healthy, not merely applied: the next layer needs this provider's CRDs to exist,
  # and applying the Provider does not install them.
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: provider-upjet-github
      namespace: crossplane-system
