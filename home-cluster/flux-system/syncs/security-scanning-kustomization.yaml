apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-scanning
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./home-cluster/security-scanning
  prune: true
  sourceRef:
    kind: GitRepository
    name: clusters
  targetNamespace: security-scanning
  timeout: 2m0s