apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: flux-instance
  interval: 10m0s
  path: ./home-cluster/flux-notifications
  prune: true
  sourceRef:
    kind: GitRepository
    name: clusters
  targetNamespace: flux-system
  wait: true
  timeout: 5m0s