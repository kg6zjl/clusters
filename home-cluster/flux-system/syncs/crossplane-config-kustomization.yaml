apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-config
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./home-cluster/crossplane/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: clusters
  targetNamespace: crossplane-system
  timeout: 5m0s
  dependsOn:
    - name: crossplane-provider
