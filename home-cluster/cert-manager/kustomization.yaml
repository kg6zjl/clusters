apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - network-policy.yaml
  - external-secrets.yaml
  - nas-cert-backup-credentials.yaml
  - clusterissuer.yaml
  - nas-cert-backup-cronjob.yaml
  - servicemonitor.yaml

patches:
  - target:
      group: ""
      version: v1
      kind: Service
      name: cert-manager
      namespace: cert-manager
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9402"
          prometheus.io/path: "/metrics"
