# NAS SMB credentials for backup-wildcard-cert-to-nas.
#
# This secret used to be produced by an empty kustomize secretGenerator in
# kustomization.yaml - a Secret object with no data at all. Nothing in the repo
# ever gave it a username or password, so the backup job's push step ran
# smbclient with an empty -U argument and failed on every attempt.
#
# Same 1Password items the meshtastic NAS backup uses, which is the pattern
# that already works in this repo. Values never enter git: only the paths.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-smb-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: nas-smb-credentials
  data:
    - secretKey: username
      remoteRef:
        key: certbot-username
        property: password
    - secretKey: password
      remoteRef:
        key: certbot-password
        property: password
