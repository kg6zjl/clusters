# NAS SMB backup: copies the wildcard TLS secret to the NAS every 12 hours.
#
# This job had never once succeeded (no lastSuccessfulTime, and no successful
# Job objects at all). It shelled out to `kubectl get secret` while setting no
# serviceAccountName, so it ran as the default service account, which has no
# permission to read secrets here. Worse, the fetch step ended in `base64 -d`,
# so that Forbidden error produced zero-byte files and exit 0 -- a "successful"
# run would have uploaded EMPTY cert files to the NAS over the real ones.
#
# The secret is now mounted as a volume instead: no kubectl, no RBAC grants, no
# dependency on the API server, and cert-manager renewals flow through without
# the job having to re-read anything. Both steps now run under `set -euo
# pipefail` and refuse to proceed on missing or empty input, so a broken run
# fails loudly instead of quietly writing garbage.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-wildcard-cert-to-nas
  namespace: cert-manager
spec:
  schedule: "0 */12 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: cert-storage
              emptyDir: {}
            - name: wildcard-tls
              secret:
                secretName: wildcard-stevearnett-com-tls
                defaultMode: 0400
            - name: nas-creds
              secret:
                secretName: nas-smb-credentials
          containers:
            - name: fetch-certs
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  install -m 600 /tls/tls.crt /certs/fullchain.pem
                  install -m 600 /tls/tls.key /certs/privkey.pem
                  grep -q 'BEGIN CERTIFICATE' /certs/fullchain.pem
                  grep -q 'PRIVATE KEY' /certs/privkey.pem
                  echo "fetched $(wc -c < /certs/fullchain.pem) byte certificate and $(wc -c < /certs/privkey.pem) byte key"
              volumeMounts:
                - name: cert-storage
                  mountPath: /certs
                - name: wildcard-tls
                  mountPath: /tls
                  readOnly: true
            - name: push-to-nas
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  for f in /certs/fullchain.pem /certs/privkey.pem; do
                    [ -s "$f" ] || { echo "FATAL: $f missing or empty, refusing to upload" >&2; exit 1; }
                  done
                  apk add --no-cache samba-client
                  smbclient //192.168.1.176/cert \
                    -W WORKGROUP -U "$(cat /creds/username)%$(cat /creds/password)" \
                    -c "put /certs/fullchain.pem cert.pem; put /certs/privkey.pem privkey.pem"
              volumeMounts:
                - name: cert-storage
                  mountPath: /certs
                - name: nas-creds
                  mountPath: /creds
                  readOnly: true
