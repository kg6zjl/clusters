# NAS SMB backup: copies the wildcard TLS secret to the NAS every 12 hours.
#
# This job had never once succeeded (no lastSuccessfulTime, and no successful
# Job objects at all). It shelled out to `kubectl get secret` while setting no
# serviceAccountName, so it ran as the default service account, which has no
# permission to read secrets here. Worse, the fetch step ended in `base64 -d`,
# so that Forbidden error produced zero-byte files and exit 0 -- a "successful"
# run would have uploaded EMPTY cert files to the NAS over the real ones.
#
# The secret is mounted as a volume instead: no kubectl, no RBAC grants, no
# dependency on the API server, and cert-manager renewals flow through without
# the job having to re-read anything.
#
# Follow-up from a live read of the deploy that shipped that fix:
#
#   * `fetch-certs` was an ordinary container, not an init container, and both
#     containers share the `cert-storage` emptyDir. Containers of a pod start
#     concurrently, so `push-to-nas` can sample /certs before `fetch-certs` has
#     written it and abort with "missing or empty". It is now an initContainer,
#     which makes the ordering explicit instead of relying on a race win. The
#     meshtastic backup this pattern was copied from (meshmonitor-backup, in
#     home-cluster/meshtastic/backup-cronjob.yaml) does the whole thing in one
#     container, so it never had this ordering question.
#
#   * The push step still read `/creds/username` and `/creds/password` straight
#     into the smbclient -U argument without checking they exist. An empty
#     credentials secret is exactly what broke every historical run (the old
#     kustomize secretGenerator emitted a Secret with no data), and the failure
#     it produces is an opaque smbclient auth error. Both files are now checked
#     first, so a broken credential sync fails with a named cause.
#
#   * Success used to mean only "smbclient exited 0". The upload is now read
#     back and compared byte for byte against what was sent, so a run that
#     cannot prove the NAS holds the current cert fails loudly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-wildcard-cert-to-nas
  namespace: cert-manager
spec:
  schedule: "0 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: cert-storage
              emptyDir: {}
            - name: wildcard-tls
              secret:
                secretName: wildcard-stevearnett-com-tls
                defaultMode: 0400
            - name: nas-creds
              secret:
                secretName: nas-smb-credentials
          initContainers:
            - name: fetch-certs
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  install -m 600 /tls/tls.crt /certs/fullchain.pem
                  install -m 600 /tls/tls.key /certs/privkey.pem
                  grep -q 'BEGIN CERTIFICATE' /certs/fullchain.pem
                  grep -q 'PRIVATE KEY' /certs/privkey.pem
                  echo "fetched $(wc -c < /certs/fullchain.pem) byte certificate and $(wc -c < /certs/privkey.pem) byte key"
              volumeMounts:
                - name: cert-storage
                  mountPath: /certs
                - name: wildcard-tls
                  mountPath: /tls
                  readOnly: true
          containers:
            - name: push-to-nas
              image: alpine:3.24
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  for f in /certs/fullchain.pem /certs/privkey.pem; do
                    [ -s "$f" ] || { echo "FATAL: $f missing or empty, refusing to upload" >&2; exit 1; }
                  done
                  for f in /creds/username /creds/password; do
                    [ -s "$f" ] || { echo "FATAL: $f missing or empty - nas-smb-credentials did not sync" >&2; exit 1; }
                  done
                  apk add --no-cache samba-client
                  CREDS="$(cat /creds/username)%$(cat /creds/password)"
                  smbclient //192.168.1.176/cert \
                    -W WORKGROUP -U "$CREDS" \
                    -c "put /certs/fullchain.pem cert.pem; put /certs/privkey.pem privkey.pem"
                  smbclient //192.168.1.176/cert \
                    -W WORKGROUP -U "$CREDS" \
                    -c "get cert.pem /tmp/cert.pem; get privkey.pem /tmp/privkey.pem"
                  cmp -s /tmp/cert.pem /certs/fullchain.pem \
                    || { echo "FATAL: NAS cert.pem does not match the cluster secret" >&2; exit 1; }
                  cmp -s /tmp/privkey.pem /certs/privkey.pem \
                    || { echo "FATAL: NAS privkey.pem does not match the cluster secret" >&2; exit 1; }
                  echo "NAS copy verified against the cluster secret"
              volumeMounts:
                - name: cert-storage
                  mountPath: /certs
                - name: nas-creds
                  mountPath: /creds
                  readOnly: true