---
# ExternalSecret for scanner credentials
# Apply this separately using kustomize patches or flux
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scanner-secrets
  namespace: security-scanning
  labels:
    app: security-scanning
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: scanner-secrets
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: scanner-user
      property: username
  - secretKey: password
    remoteRef:
      key: scanner-user
      property: password
