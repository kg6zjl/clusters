apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-scanning-allow
  namespace: security-scanning
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 4975
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  # kubelet probes (operator /healthz on 8080, trivy-server on 4975)
  - from:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 4975
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # kube-apiserver ClusterIP (10.152.183.1), registry (MetalLB/ClusterIP),
  # and internet DB/checks download (mirror.gcr.io) are all HTTPS
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # scan jobs -> built-in trivy-server (ClientServer mode)
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 4975