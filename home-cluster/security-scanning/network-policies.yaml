apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-scanning-allow
  namespace: security-scanning
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 4954
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  # kubelet probes (operator /healthz on 9090, trivy-server /healthz on 4954)
  - from:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 4954
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # internet + MetalLB registry: HTTPS (DB/checks download from mirror.gcr.io, image scans)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # kube-apiserver: service ClusterIP (pre-DNAT) + node LAN host port 16443 (post-DNAT)
  - to:
    - ipBlock:
        cidr: 10.152.183.0/16
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 16443
  # trivy-server (ClientServer scan jobs): ClusterIP + in-namespace pod (port 4954)
  - to:
    - ipBlock:
        cidr: 10.152.183.0/16
    ports:
    - protocol: TCP
      port: 4954
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 4954