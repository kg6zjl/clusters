apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy
  namespace: security-scanning
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: trivy
  template:
    metadata:
      labels:
        app: trivy
    spec:
      serviceAccountName: security-scanner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: trivy
        image: aquasec/trivy:0.52.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: TRIVY_IMAGE_CACHE_DIR
          value: "/trivy-cache"
        - name: TRIVY_SKIP_UPDATE
          value: "true"
        - name: TRIVY_SKIP_OPEN_URLS
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: trivy-cache
          mountPath: /trivy-cache
          readOnly: true
        - name: scratch
          mountPath: /tmp
      volumes:
      - name: trivy-cache
        emptyDir: {}
      - name: scratch
        emptyDir:
          sizeLimit: 1Gi
      # ExternalSecret mounts will be added via kustomize patches
      # Example:
      # - name: scanner-secrets
      #   projected:
      #     sources:
      #     - secretName: scanner-secrets
