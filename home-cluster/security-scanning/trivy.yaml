# Trivy Security Scanner
# Official image: aquasec/trivy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trivy
  namespace: security-scanning
  labels:
    app: trivy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trivy
  template:
    metadata:
      labels:
        app: trivy
    spec:
      serviceAccountName: security-scanning
      containers:
      - name: trivy
        image: aquasec/trivy:0.55.0
        args:
        - --server-mode
        - --skip-dirs=/tmp
        env:
        - name: TRIVY_SERVER_PORT
          value: "8080"
        - name: TRIVY_SERVER_HOST
          value: "0.0.0.0"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: trivy-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-config
  namespace: security-scanning
data:
  config.yaml: |
    ignore-unfixed: true
    vuln-type: os,library
    severity: CRITICAL,HIGH
    format: template
    template: '{{json .}}{{\n}}'
    metadata:
      kubernetes_version: {{ .ClusterVersion }}
