apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: security-scanning
  labels:
    alert-on-down: "true"
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: security-scanning
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: -1
  values:
    operator:
      builtInTrivyServer: true
      scanJobTTL: "30m"
      scanJobsInSameNamespace: false
      metricsVulnIdEnabled: true
      infraAssessmentScannerEnabled: false
    trivy:
      ignoreUnfixed: true
      timeout: "5m0s"
      resources:
        requests:
          cpu: 100m
          memory: 256M
        limits:
          cpu: 500m
          memory: 1G
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
    compliance:
      specs: []