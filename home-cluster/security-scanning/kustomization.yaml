apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- rbac.yaml
- network-policies.yaml
- trivy.yaml
- kube-bench.yaml
- kube-hunter.yaml
- external-secrets.yaml
