# OpenRouter API key for the monitoring namespace.
#
# Reuses the SAME 1Password item that already backs Hermes itself
# (ai-services/hermes-external-secret.yaml -> key "openrouter-api-key",
# property "password", stored in the "home-cluster" vault). No new secret
# material is introduced and the item already syncs successfully for
# ai-services, so this reference is known-good.
#
# Why this exists here: the OpenRouter cost dashboard
# (dashboard-openrouter.yaml) is fed by an `openrouter-exporter` Deployment
# that will live in this namespace and poll https://openrouter.ai/api/v1/key.
# The exporter is NOT deployed yet -- this ExternalSecret is the credential
# wiring it will consume, and it is deliberately inert until that Deployment
# lands. The target secret must NOT be referenced by anything else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-api-key
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: openrouter-api-key
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openrouter-api-key
        property: password