apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord
  data:
    # The Discord webhook the `discord` receiver posts to. Deliberately its own Secret rather
    # than a key of alertmanager-config: discord_configs accepts webhook_url_file, the operator
    # mounts this at /etc/alertmanager/secrets/alertmanager-discord/webhook_url
    # (alertmanagerSpec.secrets), and the URL then never appears inside the alertmanager.yaml
    # string that ESO renders and that CI validates.
    #
    # A file rather than an inline value also means a rotation needs no config reload.
    - secretKey: webhook_url
      remoteRef:
        key: discord-alertmanager-webhook
        property: webhook-url
