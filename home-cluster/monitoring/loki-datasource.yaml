# Grafana datasource for Loki.
#
# The kube-prometheus-stack Grafana runs a datasource sidecar that scans its OWN
# namespace (monitoring) for ConfigMaps labelled grafana_datasource=1, so this
# ConfigMap cannot live in the logging namespace next to Loki.
#
# Deliberately NOT wired through grafana.additionalDataSources in
# kube-prometheus-stack-helmrelease.yaml: any change to that release's values
# restarts an 11-minute upgrade against a 5-minute action timeout, which is the
# upgrade loop documented in that file. A sidecar ConfigMap is a new object with
# no effect on that release.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      isDefault: false
      editable: false
      jsonData:
        httpMethod: POST
        maxLines: 1000
