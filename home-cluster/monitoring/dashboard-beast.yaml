              "expr": "nvidia_smi_power_draw_watts{job=\"beast-gpu\"}",
              "refId": "A"
            }
          ],
          "title": "GPU Power Draw",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "fillOpacity": 70,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "lineWidth": 0,
                "spanNulls": false
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 1,
                      "text": "OFF"
                    },
                    "1": {
                      "color": "green",
                      "index": 0,
                      "text": "ON"
                    }
                  },
                  "type": "value"
                }
