              "expr": "beast_service_active",
              "legendFormat": "{{service}}",
              "refId": "A"
            }
          ],
          "title": "GPU priority (ComfyUI vs llama)",
          "type": "state-timeline"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Who holds the GPU, inferred from the on/off signals in the panel above. llama wins any overlap: a llama run eats the whole card and comfy is killed to make room for it, so a moment where both read as up is the comfy signal lagging, not two things sharing the GPU. ComfyUI is credited only while llama is down. Idle means neither is up. If this ever disagrees with the raw panel, the tie-break is what to change, not the inference.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "fillOpacity": 70,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineWidth": 0,
                "spanNulls": false
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "#8F8F8F",
                      "index": 0,
                      "text": "idle"
                    },
                    "1": {
                      "color": "#5794F2",
                      "index": 1,
                      "text": "ComfyUI"
                    },
                    "2": {
                      "color": "#FF9830",
                      "index": 2,
                      "text": "llama"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#8F8F8F",
                    "value": null
                  },
                  {
                    "color": "#5794F2",
                    "value": 1
                  },
                  {
                    "color": "#FF9830",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 40
          },
          "id": 9,
          "options": {
            "alignValue": "left",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "mergeValues": true,
            "perPage": 20,
            "rowHeight": 0.9,
            "showValue": "auto",
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "9.5.3",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(clamp_max(beast_service_active{service=\"llama\"} > 0, 1) * 2) or sum(clamp_max(beast_service_active{service=\"comfyui\"} > 0, 1)) or sum((beast_service_active{service=~\"comfyui|llama\"} * 0))",
              "legendFormat": "GPU holder",
              "refId": "A"
            }
          ],
          "title": "GPU held by",
          "type": "state-timeline"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Wall power for the desktop (Home Assistant energy meter, entity sensor.desktop_power) on the same axis as the GPU's own power draw, so the GPU's share of the machine's draw is readable. HA exports every numeric sensor, so the meter needed no exporter work.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
