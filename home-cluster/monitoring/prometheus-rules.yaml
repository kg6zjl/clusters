apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack-prometheus
    app: kube-prometheus-stack-prometheus
spec:
  groups:
  - name: service-down
    rules:
    # Availability for the two services that are prod. Selects on namespace and name,
    # which are always present on this metric, so it works today and depends on nothing.
    # A replica count of 0 catches a scaled-to-zero deployment as well as a crash - and
    # being scaled to 0 is exactly how meshmonitor went unnoticed for 20 minutes on
    # 2026-09-26, which is why this exists.
    - alert: ProdServiceDown
      expr: |
        kube_deployment_status_replicas_available{namespace="home-assistant",deployment="home-assistant"} == 0
        or kube_deployment_status_replicas_available{namespace="meshtastic",deployment="meshmonitor"} == 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "PROD service {{ $labels.deployment }} in {{ $labels.namespace }} is down"
        description: "Deployment {{ $labels.deployment }} ({{ $labels.namespace }}) has had no available replicas for 3 minutes. Both are prod: home-assistant runs the house, meshmonitor runs the HotPotato Base meshtastic bots."
    # There is deliberately no generic label-driven rule here. One was written - select
    # `label_alert_on_down="true"` and alert at 0 replicas - and it could never fire:
    # kube-state-metrics exposes only allowlisted resource labels, so the label never
    # arrives and the selector matches nothing. Verified against the live Prometheus:
    # kube_deployment_status_replicas_available has 62 series, and the
    # label_alert_on_down selector returns none. A rule that cannot fire reads as
    # coverage and is not, so it is deleted rather than left dormant.
    #
    # To bring it back, expose the label first: the allowlist goes under
    # `kube-state-metrics:` in kube-prometheus-stack-helmrelease.yaml (`kubeStateMetrics:`
    # at that level is only the component toggle and is ignored), the label then arrives
    # prefixed as label_alert_on_down, and the upgrade loop that used to block that change
    # is fixed. Prod is covered by ProdServiceDown above meanwhile.
  - name: disk-space
    rules:
    - alert: DiskSpaceWarning
      expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Disk space warning on {{ $labels.instance }}"
        description: "Disk space is below 15% on {{ $labels.instance }}"
    - alert: DiskSpaceCritical
      expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Disk space critical on {{ $labels.instance }}"
        description: "Disk space is below 10% on {{ $labels.instance }} - imminent failure risk"
    - alert: Pod CrashLooping
      expr: rate(kube_pod_container_status_restarts_total[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash looping"
        description: "Container {{ $labels.container }} has restarted multiple times in the last 5 minutes"
  - name: openrouter
    rules:
    - alert: OpenRouterCreditLow
      expr: openrouter_credit_limit_remaining_usd >= 0 and openrouter_credit_limit_remaining_usd < 5
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter spend limit is low ({{ printf \"%.2f\" $value }} USD remaining)"
        description: "Under 5 USD of the OpenRouter key spend limit is left. Top up before agent requests start failing with HTTP 402."
        runbook_url: "https://openrouter.ai/settings/keys"
    - alert: OpenRouterCreditExhausted
      expr: openrouter_credit_limit_remaining_usd >= 0 and openrouter_credit_limit_remaining_usd < 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "OpenRouter spend limit nearly exhausted ({{ printf \"%.2f\" $value }} USD remaining)"
        description: "Under 1 USD of the OpenRouter key spend limit is left. Agent requests will start failing with HTTP 402."
        runbook_url: "https://openrouter.ai/settings/keys"
    - alert: OpenRouterExporterDown
      expr: openrouter_up == 0 or absent(openrouter_up)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter exporter is not reporting"
        description: "openrouter_up has been 0 or absent for 15 minutes - OpenRouter spend is not being recorded."
    - alert: OpenRouterAccountBalanceLow
      expr: openrouter_account_credits_total > 0 and (openrouter_account_credits_total - openrouter_account_usage_total) < 10
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter account balance is low ({{ printf \"%.2f\" $value }} USD left)"
        description: "Under 10 USD of purchased OpenRouter credit remains on the account. This is the account balance, not the key spend cap - those are separate limits, and at zero every key on the account fails with HTTP 402."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterAccountBalanceCritical
      expr: openrouter_account_credits_total > 0 and (openrouter_account_credits_total - openrouter_account_usage_total) < 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "OpenRouter account balance nearly exhausted ({{ printf \"%.2f\" $value }} USD left)"
        description: "Under 3 USD of purchased OpenRouter credit remains. Top up now: at zero, every agent on the cluster starts failing with HTTP 402 at the same moment."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterCreditsUnavailable
      expr: absent(openrouter_account_credits_total) and on() (openrouter_up == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter account credit metrics are missing"
        description: "The exporter is up but publishing no openrouter_account_credits_total, so the account balance is invisible and the balance alerts above cannot fire. Check that OPENROUTER_POLL_CREDITS is true and that the management key in the 1Password item openrouter-management-key is valid - a 401 or 403 disables the /credits endpoint until the pod restarts. A full exporter outage is deliberately excluded here; OpenRouterExporterDown covers that."
        runbook_url: "https://openrouter.ai/settings/keys"
    - alert: OpenRouterBurnRateHigh
      expr: sum(increase(openrouter_usage_usd_total[1h])) > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter burn rate is high ({{ printf \"%.2f\" $value }} USD in the last hour)"
        description: "More than 1 USD of OpenRouter credit was spent in the last hour - a pace of 24 USD per day, about half the monthly key cap in a single day. Look for a runaway loop, a stuck retry, or an agent session that will not stop. Threshold is deliberate: the busiest hour measured so far was 0.80 USD."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterDailySpendHigh
      expr: openrouter_usage_usd_daily > 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter daily spend is high ({{ printf \"%.2f\" $value }} USD today)"
        description: "Over 10 USD spent today on the OpenRouter key. Measured recent days run 3-7 USD, so this is well above normal and a 300 USD per month pace against a 50 USD monthly cap. Coarse daily backstop for whatever the hourly rule misses."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterBalanceDepletionImminent
      expr: predict_linear((openrouter_account_credits_total - openrouter_account_usage_total)[6h:1m], 86400) < 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "OpenRouter account balance projected to reach zero within 24h"
        description: "At the burn rate of the last 6 hours, the account balance reaches zero within 24 hours. After that every key on the account fails with HTTP 402 and every LLM-backed agent on this cluster stops at once. This is a projection, not the current balance - top up before it lands. Note the account balance, not the per-key spend cap, is the binding limit."
        runbook_url: "https://openrouter.ai/settings/credits"
  # Backup freshness for the two prod services. Configured is not the same as working:
  # home-assistant carried a KubeStash BackupConfiguration for 201 days that never produced
  # a single snapshot, while still reading as "backups are configured". This rule watches
  # the result instead of the intent.
  # home-assistant is watched through its own Prometheus integration, which exports the
  # backup sensors as homeassistant_sensor_timestamp_seconds with the entity in a label.
  # meshmonitor is watched through its CronJob last-successful time, selected by namespace
  # and name - not by label, because kube-state-metrics only exposes allowlisted resource
  # labels and that allowlist is deliberately not enabled (see the note in service-down).
  # absent() is deliberate: if the metric disappears (sensor disabled, CronJob removed,
  # pod recreated differently) a plain staleness expression goes quiet forever, which is
  # the exact failure this rule exists to catch. When HA is simply down, ProdServiceDown
  # reports that instead.
  - name: prod-backups
    rules:
    - alert: ProdBackupStale
      expr: |
        (time() - homeassistant_sensor_timestamp_seconds{entity="sensor.backup_last_successful_automatic_backup"} > 108000)
        or (time() - kube_cronjob_status_last_successful_time{namespace="meshtastic",cronjob="meshmonitor-backup"} > 108000)
        or absent(homeassistant_sensor_timestamp_seconds{entity="sensor.backup_last_successful_automatic_backup"})
        or absent(kube_cronjob_status_last_successful_time{namespace="meshtastic",cronjob="meshmonitor-backup"})
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: "PROD backup stale: {{ $labels.entity }}{{ $labels.cronjob }} in {{ $labels.namespace }}"
        description: "No successful backup in over 30 hours, or the metric reporting it has gone away. home-assistant uploads to the NAS over SFTP (schedule ~24h); meshmonitor writes a nightly tarball to the NAS at 03:30."
  # The apiserver's dqlite (SQLite) datastore intermittently refuses writes -
  # SQLITE_BUSY, surfaced to clients as HTTP 500 and to the controllers' logs as
  # "database is locked". Those individual failures retry and heal, so they are
  # excluded from the Flux Discord alert (flux-notifications/alert.yaml,
  # exclusionList); what is worth being told about is the datastore staying sick, and
  # that is what this rule watches. The 5xx rate has to hold for 20 minutes before
  # anything is sent.
  #
  # Calibration, measured on this Prometheus over 10 days of 5m-resolution samples of
  # sum(rate(apiserver_request_total{job="apiserver",code=~"5.."}[5m])): median
  # ~0.007/s, p99 0.467/s, max 0.512/s, and only 5 of 2880 windows above 0.1/s. The
  # bursts that only self-heal do not trip it (2026-09-27 06:14 and 06:29, the two
  # events behind the Discord noise, peaked at 0.037/s and 0.022/s). The failure that
  # started 06:39 that day held 0.5-1.07/s for over half an hour and does trip it.
  #
  # job="apiserver" is required: the same series are scraped a second time under
  # job="kubelet" (per node, identically), so summing across jobs double counts.
  - name: control-plane-writes
    rules:
    - alert: ApiserverWriteErrorsSustained
      expr: sum(rate(apiserver_request_total{job="apiserver", code=~"5.."}[10m])) > 0.1
      for: 20m
      labels:
        severity: warning
      annotations:
        summary: "kube-apiserver is returning sustained 5xx ({{ printf \"%.2f\" $value }}/s)"
        description: "Over 0.1 failed API requests per second for 20 minutes - too long to be the self-healing datastore contention that retries within a minute. Check which resource is failing (sum by (verb,resource) (rate(apiserver_request_total{code=~\"5..\"}[10m]))), the control-plane nodes' k8s-dqlite logs, and the controllers' own logs for the matching write path (kubectl -n flux-system logs deploy/kustomize-controller --since=30m | grep 'database is locked')."
  # An empty pool leaves no kube_pod_info series at all, so count(...) == 0 returns no samples and
  # stays silent - absent_over_time is load-bearing, verified against the 2026-09-27 outage
  # (1 at 10:00Z while count(...) was empty). The 10m window is the debounce; no `for` on top.
  - name: ci-runners
    rules:
    - alert: CIRunnerPoolEmpty
      expr: absent_over_time(kube_pod_info{namespace="github-runners",created_by_kind="Runner"}[10m])
      labels:
        severity: critical
      annotations:
        summary: "CI runner pool is empty - no PR on this repo can merge"
        description: "No github-runner pods have existed for over 10 minutes. Lint, Validate and Secret Scan are required status checks on main with enforce_admins enabled, so every PR is now frozen - including a PR that would fix it. The pool normally holds at least the HorizontalRunnerAutoscaler floor of 4 (github-runner-autoscaler, min 4 / max 12). Check the controller in arc-systems (arc-operator-actions-runner-controller) and its logs for registration errors. Do NOT add a second ARC install as the fix: the chart hardcodes the webhook name, so two installs veto each other - that is exactly what caused the 2026-09-27 outage."
        runbook_url: "https://github.com/kg6zjl/clusters/settings/variables/actions"
  # A node can fail in ways the severity="critical" route never sees. The upstream node
  # alerts (KubeNodeNotReady, KubeNodeUnreachable, KubeNodeReadinessFlapping) all ship as
  # warning, and a deleted node drops its series rather than going false - so a count is the
  # only signal that catches removal. Both rules here are routed to ntfy by alertname in the
  # alertmanager config; this group only decides when they fire.
  - name: node-health
    rules:
    # 3 is the current cluster size (thinkcentre01/02/03). Update it when the cluster grows:
    # the point is to catch a node object disappearing, which no up{} or condition alert can
    # see, so it has to be compared against a number that does not come from the cluster.
    - alert: NodeMissingFromCluster
      expr: count(kube_node_info) < 3
      for: 20m
      labels:
        severity: critical
      annotations:
        summary: "A node has left the cluster ({{ $value }} present, 3 expected)"
        description: "Fewer node objects than the known cluster size for 20 minutes. A deleted or rebuilt node vanishes from kube_node_info rather than reporting NotReady, so KubeNodeNotReady cannot see it. Check kubectl get nodes, and whether the node is mid-rebuild; if the cluster legitimately shrank, update the constant in this rule."
        runbook_url: "https://headlamp.kube.stevearnett.com/c/in-cluster/nodes"
    # node-exporter is a DaemonSet, one per node - the three thinkcentres, which are
    # 24/7 and must alert the moment that changes - plus the NAS scraped as
    # job=ugreen-dxp2800. A host whose exporter stops being scrapeable is the "not
    # reporting" case: it can be perfectly healthy while blind, and while it is blind
    # none of its disk, memory or filesystem alerts can fire.
    #
    # beast (job=beast) is deliberately NOT in this selector. It is the on-demand GPU
    # box, powered off for days at a time, so "unscrapeable" is its normal state rather
    # than a fault. No expression can tell "off on purpose" from "blind", so including
    # it pages critical on every power-off. Coverage for it is the Grafana "Beast AI Box
    # Overview" dashboard, read when someone deliberately wants to know.
    - alert: NodeExporterDown
      expr: up{job=~"node-exporter|ugreen-dxp2800"} == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Node exporter not reporting on {{ $labels.instance }}"
        description: "The exporter on {{ $labels.instance }} (job={{ $labels.job }}) has been unscrapeable for 10 minutes. Disk and memory alerts for this host cannot fire while it is blind, so this alert reports that the monitoring is broken rather than the host."
        runbook_url: "https://prometheus.kube.stevearnett.com/targets"
  # "A Flux resource is not Ready" is a different question from "a Flux reconcile just
  # failed". Flux emits an event per *attempt*, so an event-driven alert can never express
  # duration; kube-state-metrics exports gotk_resource_info{ready="True|False"} read from the
  # resource's own status, which can. The two are complementary and both stay: the Alert in
  # flux-notifications/ fires on the first failed attempt (minus the datastore-write class,
  # which self-heals), this fires only if the resource is still not Ready a quarter of an
  # hour later - i.e. when a reconcile is genuinely stuck rather than retrying.
  #
  # Depends on the customResourceState block in kube-prometheus-stack-helmrelease.yaml. That
  # dependency is stated twice on purpose: the second rule exists because a rule whose metric
  # has never existed is silent, and "silent" is indistinguishable from "nothing is broken".
  - name: flux-resources
    rules:
    - alert: FluxResourceNotReady
      # Suspended resources are deliberately included: Flux does not flip the Ready
      # condition when a resource is suspended, so a suspended resource stuck at
      # Ready=False is still a real problem, and filtering on `suspended` would hide it.
      expr: gotk_resource_info{ready="False"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} not Ready for 15m"
        description: "kube-state-metrics has reported {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} ({{ $labels.customresource_group }}) with Ready=False continuously for 15 minutes, so this is not a transient reconcile error that healed on retry. Check its status and message with `flux get {{ $labels.customresource_kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}`."
    - alert: FluxResourceMetricsMissing
      # absent() rather than a staleness check because gotk_resource_info never existed here
      # before it was enabled, and a series that has never existed is not "missing recently"
      # - there is nothing to measure a gap against. Gated on the producer so that a
      # kube-state-metrics outage, which has its own alert, does not also accuse this config.
      # Expected to be silent within ~30m of the kube-prometheus-stack change landing; if it
      # fires, the customResourceState config is not being read and FluxResourceNotReady is
      # blind, not healthy.
      expr: absent(gotk_resource_info) and on() (up{job="kube-state-metrics"} == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "gotk_resource_info is absent - FluxResourceNotReady cannot fire"
        description: "kube-state-metrics is up but is not exporting gotk_resource_info, so no Flux resource going not-Ready will alert from here. Either the customResourceState config in kube-prometheus-stack-helmrelease.yaml is no longer being read (check the kube-state-metrics pod's log for custom resource state errors) or rbac.extraRules no longer grants list/watch on the flux CRs."
        runbook_url: "https://prometheus.kube.stevearnett.com/targets"
  # Nothing above sees a pod that never starts. A pod stuck Pending is not crash
  # looping, its Deployment still reports available replicas (the Deployment was
  # never the broken object), and a Job's last-successful time only speaks up a day
  # later - which is how meshmonitor-backup sat Pending for 10 hours on 2026-09-29,
  # scheduled onto a node that could never attach its RWO volume, with every rule
  # here quiet.
  #
  # "Pending" is the phase for both halves of the failure: the scheduler refusing to
  # place the pod, and the kubelet never getting it started. The second is the one
  # that hides - the pod reports PodScheduled=True and is still Pending, because the
  # volume attach, the CNI setup or the image pull never completes.
  #
  # 15m is above every legitimate wait observed here; a cold image pull or a Longhorn
  # attach takes a couple of minutes, and a pod waiting on a scheduler decision that
  # will never come is a problem long before the quarter hour is up.
  - name: pod-scheduling
    rules:
    - alert: PodPendingTooLong
      expr: kube_pod_status_phase{phase="Pending"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been Pending for 15m"
        description: "`kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}` names the cause in its Events in almost every case. Unschedulable means no node satisfies the pod's requests, selectors or affinity. Scheduled but still ContainerCreating means the node took the pod and could not start it - typically a volume that cannot attach (an RWO claim already attached to a different node) or a CNI failure. Both are silent by nature: the pod never fails, so nothing retries and nothing else alerts."
  # Failed Jobs already have coverage from the chart's own KubeJobFailed
  # (kubernetes-apps, warning, for 15m) and KubeJobNotCompleted (a job still active
  # after 12h). What neither sees is a CronJob that stops producing runs without any
  # Job failing: a wedged concurrencyPolicy: Forbid, a schedule that no longer
  # matches, a scheduler that never creates the Job. Nothing fails, so nothing
  # reports - the only visible symptom is the absence of successes.
  #
  # Per-service freshness rules exist for the two backups (ProdBackupStale) and the
  # blackbox reconciler (IngressProbeReconcilerStale), but nothing generic. This is
  # that backstop, so a new CronJob is covered the day it is added rather than the
  # day someone remembers to hand-write a rule for it.
  #
  # 48h, deliberately loose: every CronJob in this cluster runs at least daily, so
  # two days means at least one whole cycle was missed. It is a backstop, not the
  # first line - ProdBackupStale already speaks at 30h for the backups that matter.
  # A CronJob added with a weekly schedule would need this threshold raised.
  #
  # Two branches, because a CronJob that has never succeeded has no
  # kube_cronjob_status_last_successful_time series at all: the first handles a
  # series that is stale, the second a series that never existed. The `unless` keeps
  # a freshly created CronJob (registry-pull-rotator spent its first hours that way)
  # from alerting before its first run is even due.
  - name: cronjob-health
    rules:
    - alert: CronJobStale
      expr: |
        (
          (time() - kube_cronjob_status_last_successful_time > 172800)
          or (time() - kube_cronjob_created > 172800 unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)
        )
        unless on (namespace, cronjob) kube_cronjob_spec_suspend == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "CronJob {{ $labels.cronjob }} in {{ $labels.namespace }} has not succeeded in 2 days"
        description: "No successful run for over 48 hours, or a CronJob that has existed that long without ever succeeding. Check `kubectl -n {{ $labels.namespace }} get cronjob {{ $labels.cronjob }} -o yaml` for a suspend flag and `kubectl -n {{ $labels.namespace }} get jobs` for runs that were created but never completed - a pod stuck Pending blocks every later run when concurrencyPolicy is Forbid, and PodPendingTooLong reports that end of it. A CronJob whose runs never start at all leaves no Job behind to inspect."
    # Tighter than the 48h backstop above, because this job is the only thing that wakes the
    # agent: at a 5m schedule an hour of silence means at least eleven missed runs.
    #
    # warning, not critical, and deliberately so. If the detector dies, the alerts it would
    # have reported still reach the notification channel through Alertmanager's own routes -
    # what is lost is the agent's investigation, not the page. Paging hard here would make
    # the paging path noisier than the thing it protects.
    #
    # Second branch for the same reason as above: a detector that has never once succeeded
    # has no last-successful series at all, so a plain staleness comparison goes quiet.
    #
    # Suspend-aware, as is the 48h backstop above: a deliberately suspended CronJob is not a
    # stale one, and without the guard a cost decision (suspend: true on the CronJob, 2026-09-30)
    # converts into a permanent page. Do not remove the trailing `unless` - a runtime Alertmanager
    # silence would hide the alarm without fixing the rule, expire on its own, and die with the
    # Alertmanager volume. The guard is a no-op for a running CronJob, so resuming the detector
    # brings this alert back by itself after the staleness window.
    - alert: AlertDetectorStale
      expr: |
        (
          (time() - kube_cronjob_status_last_successful_time{namespace="ai-services",cronjob="alert-detector"} > 3600)
          or (time() - kube_cronjob_created{namespace="ai-services",cronjob="alert-detector"} > 3600 unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)
        )
        unless on (namespace, cronjob) kube_cronjob_spec_suspend{namespace="ai-services",cronjob="alert-detector"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "alert-detector has not succeeded in an hour - the agent is not being woken by alerts"
        description: "The cluster can no longer start the agent on its own. Alerts still notify through Alertmanager, so this is a loss of investigation rather than of paging. Check `kubectl -n ai-services get jobs` and the detector's logs: a webhook rejection shows as an HTTP error, a rejected HMAC or a 429 from the route's rate limit, and an Alertmanager read failure shows as a connection error."
  # Trivy had a dashboard and no alerting at all: a Critical CVE in a running workload and a
  # scanner that had stopped producing reports were both invisible unless someone opened
  # Grafana. severity is the routing decision here - critical reaches ntfy and wakes the agent
  # (alert-detector forwards only severity="critical"), warning stops at the Discord channel.
  #
  # The *finding* rule is warning, not critical, by owner decision (2026-09-30): 44 running
  # workloads carry a fixable Critical, which makes it a standing backlog rather than an event,
  # and a permanently-firing alert cannot page usefully. It still reaches the Discord channel
  # via the parent route, grouped by alertname. The *coverage* rules below stay critical - a
  # scanner that stopped producing reports is an incident with a fix; a CVE list is work.
  #
  # The metric names the scanned object (namespace, resource_kind, resource_name,
  # container_name, image_repository, image_tag), so the finding rules key on a workload that
  # is running rather than on every report that exists. Measured on this Prometheus
  # 2026-09-30: 49 series at severity="Critical", 44 of them on running objects and 5 on
  # ReplicaSets scaled to 0 - three old hermes-agent revisions and two external-dns ones,
  # reporting the same CVEs as the live revision of the same image. No report was left behind
  # for a deleted object, so a scaled-down ReplicaSet is the only inflation source and the
  # only thing excluded; every other kind passes through, so a kind added later alerts by
  # default and fails loud instead of silent.
  #
  # The corpus is large by design (44 running workloads carry a fixable Critical today), so
  # the Discord rendering is expected to truncate - the per-alert Alertmanager link is the
  # authoritative list.
  - name: trivy
    rules:
    - alert: TrivyCriticalVulnerability
      # sum by drops the per-report `name` label, so one workload+container+image is one alert
      # rather than one per scan report.
      expr: |
        sum by (namespace, resource_kind, resource_name, container_name, image_repository, image_tag) (
          trivy_image_vulnerabilities{severity="Critical"} > 0
          unless on (namespace, resource_kind, resource_name)
          (
            label_replace(label_replace(kube_replicaset_spec_replicas == 0, "resource_name", "$1", "replicaset", "(.*)"), "resource_kind", "ReplicaSet", "", "")
          )
        )
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "{{ $value }} fixable Critical CVE(s) in {{ $labels.image_repository }}:{{ $labels.image_tag }} running as {{ $labels.resource_kind }} {{ $labels.namespace }}/{{ $labels.resource_name }}"
        description: "Container {{ $labels.container_name }} of {{ $labels.resource_kind }} {{ $labels.namespace }}/{{ $labels.resource_name }} runs an image with {{ $value }} Critical vulnerability(ies), each with a fix available - scans run with ignoreUnfixed, so every count here is actionable. The CVE list is on the report: kubectl get vulnerabilityreports -n {{ $labels.namespace }} -l trivy-operator.resource.name={{ $labels.resource_name }} -o yaml. The fix is an image bump in the workload's manifest (PR, not a kubectl edit); the re-scan happens on its own once it rolls out."
    - alert: TrivyHighVulnerability
      # Rolled up per namespace: this is a backlog signal, not the thing you fix tonight, and
      # 94 series at severity="High" would otherwise be a notification longer than anyone reads.
      expr: |
        sum by (namespace) (
          trivy_image_vulnerabilities{severity="High"} > 0
          unless on (namespace, resource_kind, resource_name)
          (
            label_replace(label_replace(kube_replicaset_spec_replicas == 0, "resource_name", "$1", "replicaset", "(.*)"), "resource_kind", "ReplicaSet", "", "")
          )
        )
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "{{ $value }} fixable High CVE(s) in running workloads in {{ $labels.namespace }}"
        description: "Running images in {{ $labels.namespace }} carry {{ $value }} High vulnerabilities with a fix available. Per-workload detail: kubectl get vulnerabilityreports -n {{ $labels.namespace }} -o yaml. Housekeeping rather than an incident - no vulnerability roll-up pages here."
    # A failed scan writes no report, so it does not read as a finding, it reads as nothing at
    # all - which is the failure mode worth paging on, and precisely the coverage fiction this
    # cluster keeps having to fix. Six jobs sat Failed with reason=DeadlineExceeded when this
    # was written. The chart's KubeJobFailed already covers a failed Job at warning/15m to
    # Discord, so this adds the critical tier and names the scan rather than adding coverage.
    #
    # 5m, not 15m: the operator TTLs a finished scan job after 30m (operator.scanJobTTL), so a
    # long `for` would race the object dying and the rule would just never fire.
    - alert: TrivyScanJobFailed
      expr: kube_job_status_failed{namespace="security-scanning",job_name=~"scan-.*"} > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Trivy scan job {{ $labels.job_name }} failed ({{ $labels.reason }})"
        description: "No report was written for the workload {{ $labels.job_name }} was scanning, so its image is unscanned and an all-clear on the dashboard silently excludes it. reason=DeadlineExceeded means the job ran past the deadline on the scan job itself (activeDeadlineSeconds: 300, from trivy.timeout: 5m0s); BackoffLimitExceeded means the container kept failing. The job is deleted 30 minutes after it finishes, so this clears on its own; read its pod's log while it lasts, kubectl -n security-scanning logs job/{{ $labels.job_name }}, and check whether the same workload reports again on the next scan."
    # Nothing else pages on this. The HelmRelease carries the alert-on-down label, but the
    # generic rule that read it was deleted (kube-state-metrics does not expose that label),
    # and the chart's KubeDeploymentReplicasMismatch is a warning on the Discord channel.
    - alert: TrivyOperatorUnavailable
      expr: kube_deployment_status_replicas_available{namespace="security-scanning",deployment="trivy-operator"} == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "trivy-operator has no available replicas - nothing is being scanned"
        description: "No scan can run and no report can be written while the operator has zero available replicas, which includes a crash loop and being scaled to 0. Check kubectl -n security-scanning describe deploy/trivy-operator and the operator's log; its config comes from the trivy-operator-config ConfigMap, which the reloader restarts the deployment for."
    # The reports going away is the case the operator being up does not rule out: a broken
    # informer, a lost RBAC grant or a wiped cache publishes nothing while the scrape still
    # succeeds, and an empty dashboard is then indistinguishable from a clean cluster.
    # Gated on the producer so an operator outage, which TrivyOperatorUnavailable reports,
    # is not also accused here. absent() because a report carries no timestamp label, so there
    # is no staleness to measure - absence is all this data offers.
    - alert: TrivyReportMetricsMissing
      expr: absent(trivy_image_vulnerabilities) and on() (up{job="trivy-operator"} == 1)
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: "trivy-operator is up but exporting no scan results"
        description: "The operator is scrapeable but publishes no trivy_image_vulnerabilities, so every rule above and the dashboard itself are blind. Note the limit: this sees the reports all going away, not one workload quietly being skipped - nothing exports a per-report timestamp. Check the operator's log for watch/list errors on the report CRDs and that its ServiceAccount's list/watch on trivy-operator's own CRDs still exists."
  # Declarative alert suppression. An Alertmanager silence is a runtime object: anyone who can
  # reach the Alertmanager API can create one un-reviewed, it leaves no trace in git, and it
  # disappears on expiry whether or not anyone looked. The declarative equivalent is an inhibit
  # rule, and an inhibit rule needs a source alert - so each suppressed class gets one
  # always-firing sentinel here, which monitoring/alertmanager-external-secret.yaml inhibits the
  # real alert against.
  #
  # Why an inhibit rather than a route to the null receiver: the real alert keeps firing and
  # stays visible in Prometheus and (as "inhibited") in the Alertmanager UI, so a suppressed
  # class can still be re-checked; it just stops notifying and stops waking the agent, which
  # reads alerts with inhibited=false. A dropped route would hide the class entirely and the
  # re-check would be forgotten.
  #
  # Two properties are load-bearing and both are in the YAML below rather than in prose:
  # the sentinel carries the labels the inhibit rule matches on (so the class is identified by
  # what it is, not by an id), and severity is "none" (which the existing route tree sends to
  # the "null" receiver, so the sentinel never notifies anything itself).
  #
  # To suppress another class, add one entry here with that class's identity labels and one
  # inhibit rule in the Alertmanager config. To un-suppress, delete the entry. Neither has an
  # expiry: Alertmanager has no time-boxed inhibit and Alerting rules fire on the presence of a
  # series, not its value, so an expression cannot make itself stop firing at a date - the
  # re-check date goes in the annotation for whoever reads it.
  - name: suppressions
    rules:
    - alert: SuppressedTrivyCritical
      expr: vector(1)
      labels:
        severity: none
        image_repository: prometheus/blackbox-exporter
      annotations:
        summary: "TrivyCriticalVulnerability is suppressed for prometheus/blackbox-exporter"
        description: "No pinnable tag closes CVE-2026-33186 or CVE-2025-68121: v0.28.0 is the newest release and the fix exists only in unreleased master builds, so the image bump this alert asks for does not exist yet. Takes over from Alertmanager silence f1037d21-10af-4e63-ac6b-a547d32bc308, which expires 2026-10-14 and suppressed blackbox-exporter only. Re-check a newer release after that date and delete this entry with its inhibit rule. Note the finding rule itself is warning as of 2026-09-30, so this sentinel's remaining effect is keeping this one unavoidable CVE out of the Discord group rather than preventing a page."
