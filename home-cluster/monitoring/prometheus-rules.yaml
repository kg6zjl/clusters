apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack-prometheus
    app: kube-prometheus-stack-prometheus
spec:
  groups:
  - name: service-down
    rules:
    # Availability for the two services that are prod. Selects on namespace and name,
    # which are always present on this metric, so it works today and depends on nothing.
    # A replica count of 0 catches a scaled-to-zero deployment as well as a crash - and
    # being scaled to 0 is exactly how meshmonitor went unnoticed for 20 minutes on
    # 2026-09-26, which is why this exists.
    - alert: ProdServiceDown
      expr: |
        kube_deployment_status_replicas_available{namespace="home-assistant",deployment="home-assistant"} == 0
        or kube_deployment_status_replicas_available{namespace="meshtastic",deployment="meshmonitor"} == 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "PROD service {{ $labels.deployment }} in {{ $labels.namespace }} is down"
        description: "Deployment {{ $labels.deployment }} ({{ $labels.namespace }}) has had no available replicas for 3 minutes. Both are prod: home-assistant runs the house, meshmonitor runs the HotPotato Base meshtastic bots."
    # Generic label-driven availability. This cannot fire yet: kube-state-metrics only
    # exposes resource labels that are allowlisted, and `alert-on-down` is not. The
    # allowlist goes under `kube-state-metrics:` in kube-prometheus-stack-helmrelease.yaml
    # (the subchart's values - `kubeStateMetrics:` is only the component toggle and is
    # ignored there), and the label then arrives prefixed as label_alert_on_down. Not
    # enabled yet because changing those values starts an upgrade loop on that release;
    # see the note in that file. Prod is covered by ProdServiceDown above meanwhile.
    - alert: ServiceDown
      expr: kube_deployment_status_replicas_available{label_alert_on_down="true"} == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Service {{ $labels.deployment }} in {{ $labels.namespace }} is down"
        description: "Deployment {{ $labels.deployment }} has no available replicas"
  - name: disk-space
    rules:
    - alert: DiskSpaceWarning
      expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Disk space warning on {{ $labels.instance }}"
        description: "Disk space is below 15% on {{ $labels.instance }}"
    - alert: DiskSpaceCritical
      expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Disk space critical on {{ $labels.instance }}"
        description: "Disk space is below 10% on {{ $labels.instance }} - imminent failure risk"
    - alert: Pod CrashLooping
      expr: rate(kube_pod_container_status_restarts_total[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is crash looping"
        description: "Container {{ $labels.container }} has restarted multiple times in the last 5 minutes"
  - name: openrouter
    rules:
    - alert: OpenRouterCreditLow
      expr: openrouter_credit_limit_remaining_usd >= 0 and openrouter_credit_limit_remaining_usd < 5
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter spend limit is low ({{ printf \"%.2f\" $value }} USD remaining)"
        description: "Under 5 USD of the OpenRouter key spend limit is left. Top up before agent requests start failing with HTTP 402."
        runbook_url: "https://openrouter.ai/settings/keys"
    - alert: OpenRouterCreditExhausted
      expr: openrouter_credit_limit_remaining_usd >= 0 and openrouter_credit_limit_remaining_usd < 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "OpenRouter spend limit nearly exhausted ({{ printf \"%.2f\" $value }} USD remaining)"
        description: "Under 1 USD of the OpenRouter key spend limit is left. Agent requests will start failing with HTTP 402."
        runbook_url: "https://openrouter.ai/settings/keys"
    - alert: OpenRouterExporterDown
      expr: openrouter_up == 0 or absent(openrouter_up)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter exporter is not reporting"
        description: "openrouter_up has been 0 or absent for 15 minutes - OpenRouter spend is not being recorded."
    - alert: OpenRouterAccountBalanceLow
      expr: openrouter_account_credits_total > 0 and (openrouter_account_credits_total - openrouter_account_usage_total) < 10
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter account balance is low ({{ printf \"%.2f\" $value }} USD left)"
        description: "Under 10 USD of purchased OpenRouter credit remains on the account. This is the account balance, not the key spend cap - those are separate limits, and at zero every key on the account fails with HTTP 402."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterAccountBalanceCritical
      expr: openrouter_account_credits_total > 0 and (openrouter_account_credits_total - openrouter_account_usage_total) < 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "OpenRouter account balance nearly exhausted ({{ printf \"%.2f\" $value }} USD left)"
        description: "Under 3 USD of purchased OpenRouter credit remains. Top up now: at zero, every agent on the cluster starts failing with HTTP 402 at the same moment."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterCreditsUnavailable
      expr: absent(openrouter_account_credits_total) and on() (openrouter_up == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter account credit metrics are missing"
        description: "The exporter is up but publishing no openrouter_account_credits_total, so the account balance is invisible and the balance alerts above cannot fire. Check that OPENROUTER_POLL_CREDITS is true and that the management key in the 1Password item openrouter-management-key is valid - a 401 or 403 disables the /credits endpoint until the pod restarts. A full exporter outage is deliberately excluded here; OpenRouterExporterDown covers that."
        runbook_url: "https://openrouter.ai/settings/keys"
    - alert: OpenRouterBurnRateHigh
      expr: sum(increase(openrouter_usage_usd_total[1h])) > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter burn rate is high ({{ printf \"%.2f\" $value }} USD in the last hour)"
        description: "More than 1 USD of OpenRouter credit was spent in the last hour - a pace of 24 USD per day, about half the monthly key cap in a single day. Look for a runaway loop, a stuck retry, or an agent session that will not stop. Threshold is deliberate: the busiest hour measured so far was 0.80 USD."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterDailySpendHigh
      expr: openrouter_usage_usd_daily > 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "OpenRouter daily spend is high ({{ printf \"%.2f\" $value }} USD today)"
        description: "Over 10 USD spent today on the OpenRouter key. Measured recent days run 3-7 USD, so this is well above normal and a 300 USD per month pace against a 50 USD monthly cap. Coarse daily backstop for whatever the hourly rule misses."
        runbook_url: "https://openrouter.ai/settings/credits"
    - alert: OpenRouterBalanceDepletionImminent
      expr: predict_linear((openrouter_account_credits_total - openrouter_account_usage_total)[6h:1m], 86400) < 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: "OpenRouter account balance projected to reach zero within 24h"
        description: "At the burn rate of the last 6 hours, the account balance reaches zero within 24 hours. After that every key on the account fails with HTTP 402 and every LLM-backed agent on this cluster stops at once. This is a projection, not the current balance - top up before it lands. Note the account balance, not the per-key spend cap, is the binding limit."
        runbook_url: "https://openrouter.ai/settings/credits"
  # Backup freshness for the two prod services. Configured is not the same as working:
  # home-assistant carried a KubeStash BackupConfiguration for 201 days that never produced
  # a single snapshot, while still reading as "backups are configured". This rule watches
  # the result instead of the intent.
  # home-assistant is watched through its own Prometheus integration, which exports the
  # backup sensors as homeassistant_sensor_timestamp_seconds with the entity in a label.
  # meshmonitor is watched through its CronJob last-successful time, selected by namespace
  # and name - not by label, because kube-state-metrics only exposes allowlisted resource
  # labels and that allowlist is deliberately not enabled (see the note in service-down).
  # absent() is deliberate: if the metric disappears (sensor disabled, CronJob removed,
  # pod recreated differently) a plain staleness expression goes quiet forever, which is
  # the exact failure this rule exists to catch. When HA is simply down, ProdServiceDown
  # reports that instead.
  - name: prod-backups
    rules:
    - alert: ProdBackupStale
      expr: |
        (time() - homeassistant_sensor_timestamp_seconds{entity="sensor.backup_last_successful_automatic_backup"} > 108000)
        or (time() - kube_cronjob_status_last_successful_time{namespace="meshtastic",cronjob="meshmonitor-backup"} > 108000)
        or absent(homeassistant_sensor_timestamp_seconds{entity="sensor.backup_last_successful_automatic_backup"})
        or absent(kube_cronjob_status_last_successful_time{namespace="meshtastic",cronjob="meshmonitor-backup"})
      for: 30m
      labels:
        severity: critical
      annotations:
        summary: "PROD backup stale: {{ $labels.entity }}{{ $labels.cronjob }} in {{ $labels.namespace }}"
        description: "No successful backup in over 30 hours, or the metric reporting it has gone away. home-assistant uploads to the NAS over SFTP (schedule ~24h); meshmonitor writes a nightly tarball to the NAS at 03:30."
  # The apiserver's dqlite (SQLite) datastore intermittently refuses writes -
  # SQLITE_BUSY, surfaced to clients as HTTP 500 and to the controllers' logs as
  # "database is locked". Those individual failures retry and heal, so they are
  # excluded from the Flux Discord alert (flux-notifications/alert.yaml,
  # exclusionList); what is worth being told about is the datastore staying sick, and
  # that is what this rule watches. The 5xx rate has to hold for 20 minutes before
  # anything is sent.
  #
  # Calibration, measured on this Prometheus over 10 days of 5m-resolution samples of
  # sum(rate(apiserver_request_total{job="apiserver",code=~"5.."}[5m])): median
  # ~0.007/s, p99 0.467/s, max 0.512/s, and only 5 of 2880 windows above 0.1/s. The
  # bursts that only self-heal do not trip it (2026-09-27 06:14 and 06:29, the two
  # events behind the Discord noise, peaked at 0.037/s and 0.022/s). The failure that
  # started 06:39 that day held 0.5-1.07/s for over half an hour and does trip it.
  #
  # job="apiserver" is required: the same series are scraped a second time under
  # job="kubelet" (per node, identically), so summing across jobs double counts.
  - name: control-plane-writes
    rules:
    - alert: ApiserverWriteErrorsSustained
      expr: sum(rate(apiserver_request_total{job="apiserver", code=~"5.."}[10m])) > 0.1
      for: 20m
      labels:
        severity: warning
      annotations:
        summary: "kube-apiserver is returning sustained 5xx ({{ printf \"%.2f\" $value }}/s)"
        description: "Over 0.1 failed API requests per second for 20 minutes - too long to be the self-healing datastore contention that retries within a minute. Check which resource is failing (sum by (verb,resource) (rate(apiserver_request_total{code=~\"5..\"}[10m]))), the control-plane nodes' k8s-dqlite logs, and the controllers' own logs for the matching write path (kubectl -n flux-system logs deploy/kustomize-controller --since=30m | grep 'database is locked')."
  # An empty pool leaves no kube_pod_info series at all, so count(...) == 0 returns no samples and
  # stays silent - absent_over_time is load-bearing, verified against the 2026-09-27 outage
  # (1 at 10:00Z while count(...) was empty). The 10m window is the debounce; no `for` on top.
  - name: ci-runners
    rules:
    - alert: CIRunnerPoolEmpty
      expr: absent_over_time(kube_pod_info{namespace="github-runners",created_by_kind="Runner"}[10m])
      labels:
        severity: critical
      annotations:
        summary: "CI runner pool is empty - no PR on this repo can merge"
        description: "No github-runner pods have existed for over 10 minutes. Lint, Validate and Secret Scan are required status checks on main with enforce_admins enabled, so every PR is now frozen - including a PR that would fix it. The pool normally holds at least the HorizontalRunnerAutoscaler floor of 4 (github-runner-autoscaler, min 4 / max 12). Check the controller in arc-systems (arc-operator-actions-runner-controller) and its logs for registration errors. Do NOT add a second ARC install as the fix: the chart hardcodes the webhook name, so two installs veto each other - that is exactly what caused the 2026-09-27 outage."
        runbook_url: "https://github.com/kg6zjl/clusters/settings/variables/actions"
  # A node can fail in ways the severity="critical" route never sees. The upstream node
  # alerts (KubeNodeNotReady, KubeNodeUnreachable, KubeNodeReadinessFlapping) all ship as
  # warning, and a deleted node drops its series rather than going false - so a count is the
  # only signal that catches removal. Both rules here are routed to ntfy by alertname in the
  # alertmanager config; this group only decides when they fire.
  - name: node-health
    rules:
    # 3 is the current cluster size (thinkcentre01/02/03). Update it when the cluster grows:
    # the point is to catch a node object disappearing, which no up{} or condition alert can
    # see, so it has to be compared against a number that does not come from the cluster.
    - alert: NodeMissingFromCluster
      expr: count(kube_node_info) < 3
      for: 20m
      labels:
        severity: critical
      annotations:
        summary: "A node has left the cluster ({{ $value }} present, 3 expected)"
        description: "Fewer node objects than the known cluster size for 20 minutes. A deleted or rebuilt node vanishes from kube_node_info rather than reporting NotReady, so KubeNodeNotReady cannot see it. Check kubectl get nodes, and whether the node is mid-rebuild; if the cluster legitimately shrank, update the constant in this rule."
        runbook_url: "https://headlamp.kube.stevearnett.com/c/in-cluster/nodes"
    # node-exporter is a DaemonSet, one per node, plus the two external hosts scraped as
    # job=beast and job=ugreen-dxp2800 (the NAS). A host whose exporter stops being
    # scrapeable is the "not reporting" case: it can be perfectly healthy while blind, and
    # while it is blind none of its disk, memory or filesystem alerts can fire.
    - alert: NodeExporterDown
      expr: up{job=~"node-exporter|beast|ugreen-dxp2800"} == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Node exporter not reporting on {{ $labels.instance }}"
        description: "The exporter on {{ $labels.instance }} (job={{ $labels.job }}) has been unscrapeable for 10 minutes. Disk and memory alerts for this host cannot fire while it is blind, so this alert reports that the monitoring is broken rather than the host."
        runbook_url: "https://prometheus.kube.stevearnett.com/targets"
  # "A Flux resource is not Ready" is a different question from "a Flux reconcile just
  # failed". Flux emits an event per *attempt*, so an event-driven alert can never express
  # duration; kube-state-metrics exports gotk_resource_info{ready="True|False"} read from the
  # resource's own status, which can. The two are complementary and both stay: the Alert in
  # flux-notifications/ fires on the first failed attempt (minus the datastore-write class,
  # which self-heals), this fires only if the resource is still not Ready a quarter of an
  # hour later - i.e. when a reconcile is genuinely stuck rather than retrying.
  #
  # Depends on the customResourceState block in kube-prometheus-stack-helmrelease.yaml. That
  # dependency is stated twice on purpose: the second rule exists because a rule whose metric
  # has never existed is silent, and "silent" is indistinguishable from "nothing is broken".
  - name: flux-resources
    rules:
    - alert: FluxResourceNotReady
      # Suspended resources are deliberately included: Flux does not flip the Ready
      # condition when a resource is suspended, so a suspended resource stuck at
      # Ready=False is still a real problem, and filtering on `suspended` would hide it.
      expr: gotk_resource_info{ready="False"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} not Ready for 15m"
        description: "kube-state-metrics has reported {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} ({{ $labels.customresource_group }}) with Ready=False continuously for 15 minutes, so this is not a transient reconcile error that healed on retry. Check its status and message with `flux get {{ $labels.customresource_kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}`."
    - alert: FluxResourceMetricsMissing
      # absent() rather than a staleness check because gotk_resource_info never existed here
      # before it was enabled, and a series that has never existed is not "missing recently"
      # - there is nothing to measure a gap against. Gated on the producer so that a
      # kube-state-metrics outage, which has its own alert, does not also accuse this config.
      # Expected to be silent within ~30m of the kube-prometheus-stack change landing; if it
      # fires, the customResourceState config is not being read and FluxResourceNotReady is
      # blind, not healthy.
      expr: absent(gotk_resource_info) and on() (up{job="kube-state-metrics"} == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "gotk_resource_info is absent - FluxResourceNotReady cannot fire"
        description: "kube-state-metrics is up but is not exporting gotk_resource_info, so no Flux resource going not-Ready will alert from here. Either the customResourceState config in kube-prometheus-stack-helmrelease.yaml is no longer being read (check the kube-state-metrics pod's log for custom resource state errors) or rbac.extraRules no longer grants list/watch on the flux CRs."
        runbook_url: "https://prometheus.kube.stevearnett.com/targets"
  # Nothing above sees a pod that never starts. A pod stuck Pending is not crash
  # looping, its Deployment still reports available replicas (the Deployment was
  # never the broken object), and a Job's last-successful time only speaks up a day
  # later - which is how meshmonitor-backup sat Pending for 10 hours on 2026-09-29,
  # scheduled onto a node that could never attach its RWO volume, with every rule
  # here quiet.
  #
  # "Pending" is the phase for both halves of the failure: the scheduler refusing to
  # place the pod, and the kubelet never getting it started. The second is the one
  # that hides - the pod reports PodScheduled=True and is still Pending, because the
  # volume attach, the CNI setup or the image pull never completes.
  #
  # 15m is above every legitimate wait observed here; a cold image pull or a Longhorn
  # attach takes a couple of minutes, and a pod waiting on a scheduler decision that
  # will never come is a problem long before the quarter hour is up.
  - name: pod-scheduling
    rules:
    - alert: PodPendingTooLong
      expr: kube_pod_status_phase{phase="Pending"} == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been Pending for 15m"
        description: "`kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}` names the cause in its Events in almost every case. Unschedulable means no node satisfies the pod's requests, selectors or affinity. Scheduled but still ContainerCreating means the node took the pod and could not start it - typically a volume that cannot attach (an RWO claim already attached to a different node) or a CNI failure. Both are silent by nature: the pod never fails, so nothing retries and nothing else alerts."

