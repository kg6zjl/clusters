apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.5.2
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    crds:
      enabled: true
    # NOTE: exposing the `alert-on-down` resource label needs the SUBCHART's values, i.e.
    # `kube-state-metrics:` - not `kubeStateMetrics:`, which at this level is only the
    # component toggle. Setting the allowlist under `kubeStateMetrics:` is accepted
    # silently and does nothing, which is how ServiceDown stayed dead:
    #
    #   kube-state-metrics:
    #     metricLabelsAllowlist:
    #       - deployments=[alert-on-down]
    #
    # Deliberately NOT applied yet. Touching these values restarts an upgrade loop on this
    # release: the upgrade takes ~11 minutes, longer than the 5m action timeout, so each
    # attempt overlaps the previous one and the release never settles
    # (in-sync -> out-of-sync -> upgrade, endlessly). Churning the prod monitoring stack
    # is worse than a missing label, so prod availability is covered by the
    # ProdServiceDown rule in prometheus-rules.yaml, which needs no allowlist at all.
    prometheus:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      prometheusSpec:
        retention: 10d
        # Without this, alert notifications carry Prometheus' in-cluster
        # generatorURL (http://kube-prometheus-stack-prometheus.monitoring:9090/...),
        # which is unreachable from a browser.
        externalUrl: https://prometheus.kube.stevearnett.com
        serviceMonitorSelector: {}
        podMonitorSelector: {}
        ruleSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          - job_name: beast
            static_configs:
              - targets:
                  - 192.168.1.161:9100
          - job_name: beast-gpu
            static_configs:
              - targets:
                  - 192.168.1.161:9835
            metric_relabel_configs:
              - action: replace
                replacement: "0"
                target_label: gpu
          - job_name: ugreen-dxp2800
            static_configs:
              - targets:
                  - 192.168.1.176:9100
          - job_name: ingress-availability
            metrics_path: /probe
            params:
              module: [http_2xx]
            static_configs:
              - targets:
                  - https://ha.kube.stevearnett.com/
                  - https://grafana.kube.stevearnett.com/
                  - https://prometheus.kube.stevearnett.com/
                  - https://meshmonitor.kube.stevearnett.com/
                labels:
                  service: ingress
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
          - job_name: openrouter-exporter
            scrape_interval: 60s
            static_configs:
              - targets:
                  - openrouter-exporter.monitoring.svc.cluster.local:9101
        additionalAlertRelabelConfigs:
          - source_labels: [alertname]
            regex: NodeDiskIOSaturation
            action: drop
        additionalRules:
          - name: ingress-availability
            rules:
              - alert: IngressDown
                expr: probe_success{job="ingress-availability"} == 0
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "Ingress {{ $labels.instance }} is down"
                  description: "Cannot reach {{ $labels.instance }} for 2 minutes"
          - name: node-disk-io
            rules:
              - alert: NodeDiskIOSaturationNvme
                expr: rate(node_disk_io_time_weighted_seconds_total{device=~"nvme.+",job="node-exporter"}[5m]) > 50
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "NVMe disk IO queue is deep"
                  description: "Queue depth (aqu-sq) on {{ $labels.device }} at {{ $labels.instance }} above 50 for 30 minutes, currently {{ printf \"%.2f\" $value }}"
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodediskiosaturation
              - alert: NodeDiskIOSaturationOther
                expr: rate(node_disk_io_time_weighted_seconds_total{device=~"(/dev/)?(mmcblk.p.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)",job="node-exporter"}[5m]) > 10
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Disk IO queue is high"
                  description: "Queue depth (aqu-sq) on {{ $labels.device }} at {{ $labels.instance }} above 10 for 30 minutes, currently {{ printf \"%.2f\" $value }}"
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodediskiosaturation
    grafana:
      enabled: true
      replicas: 1
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: GRAFANA_ADMIN_PASSWORD
      additionalDataSources: []
      sidecar:
        skipTlsVerify: true
        dashboards:
          env:
            HEALTH_PORT: "8084"
        datasources:
          env:
            HEALTH_PORT: "8082"
    alertmanager:
      enabled: true
      alertmanagerSpec:
        configSecret: alertmanager-config
