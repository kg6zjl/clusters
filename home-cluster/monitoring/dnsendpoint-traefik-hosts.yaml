# These hosts are served by Traefik IngressRoute objects whose hostname lives in an
# external-dns.alpha.kubernetes.io/hostname annotation. external-dns's sources are
# service, ingress and crd - an IngressRoute is none of those - so the annotation is
# invisible to it and the records have to be declared here instead. Without these the
# records are owned-but-undesired, which is what let a policy change delete them.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: grafana
  namespace: monitoring
spec:
  endpoints:
  - dnsName: grafana.kube.stevearnett.com
    recordType: CNAME
    targets:
    - kube.stevearnett.com
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: prometheus
  namespace: monitoring
spec:
  endpoints:
  - dnsName: prometheus.kube.stevearnett.com
    recordType: CNAME
    targets:
    - kube.stevearnett.com
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  endpoints:
  - dnsName: alerts.kube.stevearnett.com
    recordType: CNAME
    targets:
    - kube.stevearnett.com
