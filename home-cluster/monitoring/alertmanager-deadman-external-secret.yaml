apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadman-ntfy
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-deadman-ntfy
  data:
    # The same item the alertmanager config pages critical alerts with. Deliberately a
    # separate Secret from alertmanager-config: that one also carries the Discord
    # webhook, and this Job has no business holding it.
    - secretKey: ntfy-url
      remoteRef:
        key: ntfy-urls
        property: critical
