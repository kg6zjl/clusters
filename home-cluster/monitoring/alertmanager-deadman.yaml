apiVersion: batch/v1
kind: CronJob
metadata:
  name: alertmanager-deadman
  namespace: monitoring
  annotations:
    configmap.reloader.stakater.com/reload: "alertmanager-deadman-script"
    secret.reloader.stakater.com/reload: "alertmanager-deadman-ntfy"
spec:
  # Every 5m: long enough that a restart or a config reload never has to be explained
  # away, short enough that a page arrives while the outage is still young.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # See the same field on meshmonitor-backup: a pod that never starts would
      # otherwise block every later run under Forbid, and the deadman going quiet is
      # the one failure nothing else here would report.
      activeDeadlineSeconds: 120
      # One attempt: the script exits 0 once it has paged, so a retry only re-sends a page that may
      # already have landed, and the default 6 retries outlive the 120s deadline.
      backoffLimit: 0
      # History limits only evict once later Jobs exist, so a rare failure sat 26h. TTL
      # bounds it by time instead. 900 matches blackbox-probe-reconciler in this namespace.
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
            app: alertmanager-deadman
        spec:
          restartPolicy: OnFailure
          # The script talks to Alertmanager, Prometheus and ntfy over HTTP and reads
          # no Kubernetes objects, so it needs no API access at all.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: deadman
            image: python:3.14-slim
            command:
            - python
            - /app/deadman.py
            env:
            - name: NTFY_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-deadman-ntfy
                  key: ntfy-url
            - name: ALERTMANAGER_URL
              value: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
            volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          volumes:
          - name: script
            configMap:
              name: alertmanager-deadman-script
              defaultMode: 0755
