apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
data:
  discord.tmpl: |
    {{/* Alertmanager message templates for the Discord receiver. Moved here from the
         receiver's message field on 2026-09-30 so the roll-up logic is a normal file
         instead of Go-template code escaped inside an ExternalSecret's Go template
         inside a YAML scalar. Nothing in this file needs ESO escaping.

         The receiver refers to these by name, so keep the names in
         discord.title / discord.rollup in step with alertmanager-external-secret.yaml. */}}
    {{ define "discord.title" }}{{ .Status | toUpper }}{{ end }}

    {{- define "discord.rollup" -}}
    {{- $n := len .Alerts -}}
    {{- if gt $n 3 -}}
    **{{ .CommonLabels.alertname }}**{{ if .CommonLabels.severity }} · {{ .CommonLabels.severity }}{{ end }} · {{ $n }} alerts{{ if and (gt (len .Alerts.Firing) 0) (gt (len .Alerts.Resolved) 0) }} ({{ len .Alerts.Firing }} firing / {{ len .Alerts.Resolved }} resolved){{ end }}
    {{ range $i, $a := .Alerts }}{{ if lt $i 8 }}{{ $obj := "" }}{{ if $a.Labels.pod }}{{ $obj = printf "pod/%s" $a.Labels.pod }}{{ else if $a.Labels.node }}{{ $obj = printf "node/%s" $a.Labels.node }}{{ else if $a.Labels.deployment }}{{ $obj = printf "deployment/%s" $a.Labels.deployment }}{{ else if $a.Labels.daemonset }}{{ $obj = printf "daemonset/%s" $a.Labels.daemonset }}{{ else if $a.Labels.statefulset }}{{ $obj = printf "statefulset/%s" $a.Labels.statefulset }}{{ else if $a.Labels.resource_name }}{{ $obj = printf "%s/%s" $a.Labels.resource_kind $a.Labels.resource_name }}{{ end }}• {{ if $a.Labels.namespace }}{{ $a.Labels.namespace }}{{ end }}{{ if $obj }} · {{ $obj }}{{ end }}{{ if $a.Annotations.summary }} — {{ $a.Annotations.summary }}{{ end }}
    {{ end }}{{ end }}{{ if gt $n 8 }}… and {{ len (slice .Alerts 8) }} more
    {{ end }}All {{ $n }}: [Alertmanager](https://alerts.kube.stevearnett.com/#/alerts?filter=%7Balertname%3D%22{{ .CommonLabels.alertname }}%22%7D) — tap an alert there for its full detail
    [Prometheus](https://prometheus.kube.stevearnett.com/alerts) · [Grafana](https://grafana.kube.stevearnett.com) · [Headlamp](https://headlamp.kube.stevearnett.com)
    {{- else -}}
    {{ range .Alerts }}**[{{ .Labels.alertname }}](https://alerts.kube.stevearnett.com/#/alerts?filter=%7Balertname%3D%22{{ .Labels.alertname }}%22%7D)** [{{ .Labels.severity }}]{{ if .Labels.namespace }} · ns={{ .Labels.namespace }}{{ end }}{{ if .Labels.pod }} · pod={{ .Labels.pod }}{{ end }}{{ if .Labels.instance }} · {{ .Labels.instance }}{{ end }}{{ if .Labels.job }} · job={{ .Labels.job }}{{ end }}
    {{ .Annotations.summary }}
    {{ .Annotations.description }}
    {{ if .Labels.pod }}[Pod](https://headlamp.kube.stevearnett.com/c/in-cluster/pods/{{ .Labels.namespace }}/{{ .Labels.pod }}) · {{ else if .Labels.node }}[Node](https://headlamp.kube.stevearnett.com/c/in-cluster/nodes/{{ .Labels.node }}) · {{ else if .Labels.deployment }}[Deployment](https://headlamp.kube.stevearnett.com/c/in-cluster/deployments/{{ .Labels.namespace }}/{{ .Labels.deployment }}) · {{ else if .Labels.daemonset }}[DaemonSet](https://headlamp.kube.stevearnett.com/c/in-cluster/daemonsets/{{ .Labels.namespace }}/{{ .Labels.daemonset }}) · {{ else if .Labels.statefulset }}[StatefulSet](https://headlamp.kube.stevearnett.com/c/in-cluster/statefulsets/{{ .Labels.namespace }}/{{ .Labels.statefulset }}) · {{ else if .Labels.namespace }}[Namespace](https://headlamp.kube.stevearnett.com/c/in-cluster/namespaces/{{ .Labels.namespace }}) · {{ end }}[Prometheus]({{ .GeneratorURL }}){{ if .Annotations.runbook_url }} · [Runbook]({{ .Annotations.runbook_url }}){{ end }}
    {{ end }}[Alertmanager](https://alerts.kube.stevearnett.com) · [Prometheus](https://prometheus.kube.stevearnett.com/alerts) · [Grafana](https://grafana.kube.stevearnett.com) · [Headlamp](https://headlamp.kube.stevearnett.com)
    {{- end }}
    {{- end -}}
