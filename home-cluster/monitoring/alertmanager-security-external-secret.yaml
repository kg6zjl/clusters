apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-security
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-security
  data:
    # The security channel's webhook, kept in its own Secret for the same reason as
    # alertmanager-discord: discord_configs accepts webhook_url_file, the operator mounts
    # this at /etc/alertmanager/secrets/alertmanager-security/webhook_url
    # (alertmanagerSpec.secrets), so the URL never enters the rendered alertmanager.yaml
    # that ESO emits and CI validates. A file also means a rotation needs no config reload.
    #
    # A channel webhook is bound to the channel it was created in, so this cannot be
    # swapped for the general channel's URL: the two are separate channels by design.
    - secretKey: webhook_url
      remoteRef:
        key: discord-security-webhook
        property: webhook-url
