# OpenRouter LLM usage/cost dashboard.
# NOTE: the openrouter_* metrics this dashboard queries are emitted by an
# openrouter-exporter Deployment that is NOT in the cluster yet. Every panel
# renders "No data" until that exporter exists and is scraped by Prometheus.
# Provisioned via grafana k8s-sidecar (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-openrouter
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  openrouter.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [],
              "type": "dashboard"
            },
            "type": "dashboard"
          }
        ]
      },
