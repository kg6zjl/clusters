apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          # Message bodies live in their own file rather than here: this Secret's value is a
          # Go template rendered by ESO, so template code written inside it has to be escaped
          # to survive ESO - and the escaping is what made a one-character mistake a runtime
          # surprise. The file is mounted from the alertmanager-templates ConfigMap
          # (alertmanagerSpec.configMaps) and needs no escaping at all.
          templates:
            - /etc/alertmanager/configmaps/alertmanager-templates/*.tmpl
          route:
            receiver: discord
            group_by: ['alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              # severity="none" is only ever used by the pipeline self-test alerts
              # (Watchdog always fires by design; InfoInhibitor exists to inhibit
              # severity="info" alerts). Prometheus' own docs say InfoInhibitor
              # "should be routed to a null receiver". Sending them to Discord is
              # what produced the unreadable "[none] Info-level alert inhibition."
              # message every 4h.
              - matchers:
                  - severity = "none"
                receiver: "null"
                continue: false
              # A standing backlog, not an event: the Trivy group is permanently firing, so it
              # inherits the 4h repeat. Daily in #security - group_interval holds a new finding.
              # These are not ops-channel noise: 44 workloads carry a fixable Critical.
              - matchers:
                  - alertname =~ "TrivyHighVulnerability|TrivyCriticalVulnerability|TrivyScanJobFailed"
                receiver: discord-security
                continue: false
                group_interval: 24h
                repeat_interval: 24h
              # Kyverno audit findings. The rule behind them reads ClusterPolicyReport
              # objects rather than Kyverno's own metrics, and they go to the security
              # channel as well as the general one. Same sibling pair as the critical routes
              # below, for the same verified reason: a child route's receiver replaces the
              # parent's, so without the second sibling the general channel would carry no
              # record of a finding.
              #
              # Matched on alertname, not severity: these are warnings, and the security
              # channel wants them regardless of how the severity is set.
              - matchers:
                  - alertname =~ "KyvernoAudit.*"
                receiver: discord-security
                continue: true
              - matchers:
                  - alertname =~ "KyvernoAudit.*"
                receiver: discord
                continue: false
              # Paging path. severity="critical" also goes to ntfy, at the "critical"
              # level of the ntfy-urls item, and keeps going to Discord (continue: true)
              # so the channel keeps its record of the incident.
              - matchers:
                  - severity = "critical"
                receiver: ntfy-critical
                continue: true
                repeat_interval: 2h
              # A child route's receiver replaces the parent's, so critical alerts need
              # their own sibling to still reach Discord. Verified with the real notifier:
              # without this sibling, a critical alert reached ntfy and never Discord.
              - matchers:
                  - severity = "critical"
                receiver: discord
                continue: false
              # Node loss is a warning upstream and cannot be made critical without forking
              # chart rules, so these page by alertname instead of by severity. Same sibling
              # pattern as the critical pair above and for the same verified reason: a child
              # route's receiver replaces the parent's, so without the second sibling a node
              # outage would page and never reach the Discord channel's own record.
              - matchers:
                  - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping|NodeExporterDown|NodeMissingFromCluster"
                receiver: ntfy-critical
                continue: true
                repeat_interval: 2h
              - matchers:
                  - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping|NodeExporterDown|NodeMissingFromCluster"
                receiver: discord
                continue: false
          inhibit_rules:
            # The stock kube-prometheus-stack inhibit set. Without these, info-level
            # alerts are never inhibited even though the InfoInhibitor rule fires to
            # signal exactly that condition.
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity = "warning"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity = "info"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: ['namespace', 'alertname']
            # Suppression, done declaratively. A silence used to be the tool for this - created
            # over the Alertmanager API by anyone who could reach it, invisible in git, and gone
            # on expiry whether or not anyone re-checked. Instead each suppressed class is a
            # sentinel alert published by the `suppressions` group in suppression-sentinels.yaml, and
            # this rule inhibits the real alert against it. Suppressing is then a two-line diff
            # that a reviewer sees; un-suppressing is deleting the sentinel entry.
            #
            # equal pins the inhibition to a label value, so the sentinel below suppresses this
            # image and not the same alertname for every other image - the property the silence
            # bought with an image_repository matcher. A class identified by other labels needs
            # its own pair of entries and an equal on those labels; Alertmanager applies `equal`
            # on a fixed label set, so there is no single rule that can cover arbitrary classes.
            #
            # Verified interaction, not assumed: an inhibited alert is invisible to the
            # alert-detector, which polls with silenced=false&inhibited=false
            # (ai-services/alert-detector-configmap.yaml) - so a suppressed class can no longer
            # wake the agent on each re-fire, which is the noise the user keeps reporting.
            - source_matchers: ['alertname = "SuppressedTrivyCritical"']
              target_matchers: ['alertname = "TrivyCriticalVulnerability"']
              equal: ['image_repository']
          receivers:
            - name: "null"
            # ntfy has no native Alertmanager receiver, so this uses the publish API it
            # does expose. The URL carries the message metadata because Alertmanager's
            # webhook http_config has no headers field (amtool rejects it: "field headers
            # not found in type config.plain"). Priority is urgent only while firing.
            - name: ntfy-critical
              webhook_configs:
                # A page is a pointer, not a report: ntfy rejects a message over its size limit
                # with 40041 "message or title is too large after replacing template", and the
                # first alert group big enough to trip it was the six TrivyScanJobFailed alerts
                # on 2026-09-30 07:38Z (alertmanager_notifications_failed_total{integration=
                # "webhook",reason="clientError"} went to 1; Discord carried the same group
                # without error). Measured against the deployed v0.34.1 binary: the same
                # 5-alert group posts a 5458-byte body without this cap and 1985 bytes with it.
                # max_alerts bounds the body at every group size, so a rule with a large blast
                # radius cannot silence its own page; the full list stays in Discord and the
                # Alertmanager UI.
                - max_alerts: 1
                  url: '{{ .ntfy_critical_url }}?title=%5B{{ "{{" }} .Status {{ "}}" }}%5D%20{{ "{{" }} .CommonLabels.alertname | urlquery {{ "}}" }}&tags=rotating_light&priority={{ "{{" }} if eq .Status "firing" {{ "}}" }}urgent{{ "{{" }} else {{ "}}" }}default{{ "{{" }} end {{ "}}" }}&template=alertmanager'
                  send_resolved: true
            - name: discord
              discord_configs:
                - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook_url
                  send_resolved: true
                  title: '{{ "{{" }} template "discord.title" . {{ "}}" }}'
                  message: '{{ "{{" }} template "discord.rollup" . {{ "}}" }}'
            # Same body templates as discord, different channel and different Secret: the
            # security channel is a second record of the same finding, meant to be read by
            # someone looking at policy results rather than at the general feed.
            - name: discord-security
              discord_configs:
                - webhook_url_file: /etc/alertmanager/secrets/alertmanager-security/webhook_url
                  send_resolved: true
                  title: '{{ "{{" }} template "discord.title" . {{ "}}" }}'
                  message: '{{ "{{" }} template "discord.rollup" . {{ "}}" }}'
  data:
    # The Discord webhook is NOT here. It is its own ExternalSecret (alertmanager-discord)
    # mounted as a file, because discord_configs accepts webhook_url_file - so the URL never
    # enters this template, this Secret's alertmanager.yaml, or the CI check's copy of it.
    #
    # ntfy stays an ESO placeholder on purpose, and it is the only one left. Its URL is
    # interpolated INTO a query string whose other parts are Alertmanager templates
    # (title, tags, and a priority that is urgent only while firing), because Alertmanager's
    # webhook http_config has no headers field. A static file URL cannot carry that: it would
    # silently lose the firing-vs-resolved priority. See the ntfy-critical receiver below.
    - secretKey: ntfy_critical_url
      remoteRef:
        key: ntfy-urls
        property: critical
