apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: discord
            group_by: ['alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - matchers:
                  - node =~ "pi4-microk8s|pikube"
                receiver: pikube-void
                continue: false
              - matchers:
                  - kubernetes_node =~ "pi4-microk8s|pikube"
                receiver: pikube-void
                continue: false
              - matchers:
                  - hostname =~ "pi4-microk8s|pikube"
                receiver: pikube-void
                continue: false
              - matchers:
                  - instance =~ "192\\.168\\.1\\.175(:[0-9]+)?"
                receiver: pikube-void
                continue: false
          receivers:
            - name: pikube-void
            - name: discord
              discord_configs:
                - webhook_url: '{{ .webhook_url }}'
                  send_resolved: true
                  title: '{{ "{{" }} .Status | toUpper {{ "}}" }}'
                  message: '{{ "{{" }} range .Alerts {{ "}}" }}{{ "{{" }} .Labels.job {{ "}}" }} [{{ "{{" }} .Labels.severity {{ "}}" }}] {{ "{{" }} .Annotations.summary {{ "}}" }} {{ "\n" }}{{ "{{" }} end {{ "}}" }}'
  data:
    - secretKey: webhook_url
      remoteRef:
        key: discord-alertmanager-webhook
        property: webhook-url