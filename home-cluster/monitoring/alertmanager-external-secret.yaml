apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    template:
      type: Opaque
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: discord
            group_by: ['alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              # severity="none" is only ever used by the pipeline self-test alerts
              # (Watchdog always fires by design; InfoInhibitor exists to inhibit
              # severity="info" alerts). Prometheus' own docs say InfoInhibitor
              # "should be routed to a null receiver". Sending them to Discord is
              # what produced the unreadable "[none] Info-level alert inhibition."
              # message every 4h.
              - matchers:
                  - severity = "none"
                receiver: "null"
                continue: false
              # Paging path. severity="critical" also goes to ntfy, at the "critical"
              # level of the ntfy-urls item, and keeps going to Discord (continue: true)
              # so the channel keeps its record of the incident.
              - matchers:
                  - severity = "critical"
                receiver: ntfy-critical
                continue: true
                repeat_interval: 2h
              # A child route's receiver replaces the parent's, so critical alerts need
              # their own sibling to still reach Discord. Verified with the real notifier:
              # without this sibling, a critical alert reached ntfy and never Discord.
              - matchers:
                  - severity = "critical"
                receiver: discord
                continue: false
          inhibit_rules:
            # The stock kube-prometheus-stack inhibit set. Without these, info-level
            # alerts are never inhibited even though the InfoInhibitor rule fires to
            # signal exactly that condition.
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity = "warning"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity = "info"']
              equal: ['namespace', 'alertname']
            - source_matchers: ['severity = "warning"']
              target_matchers: ['severity = "info"']
              equal: ['namespace', 'alertname']
          receivers:
            - name: "null"
            # ntfy has no native Alertmanager receiver, so this uses the publish API it
            # does expose. The URL carries the message metadata because Alertmanager's
            # webhook http_config has no headers field (amtool rejects it: "field headers
            # not found in type config.plain"). Priority is urgent only while firing.
            - name: ntfy-critical
              webhook_configs:
                - url: '{{ .ntfy_critical_url }}?title=%5B{{ "{{" }} .Status {{ "}}" }}%5D%20{{ "{{" }} .CommonLabels.alertname | urlquery {{ "}}" }}&tags=rotating_light&priority={{ "{{" }} if eq .Status "firing" {{ "}}" }}urgent{{ "{{" }} else {{ "}}" }}default{{ "{{" }} end {{ "}}" }}'
                  send_resolved: true
            - name: discord
              discord_configs:
                - webhook_url: '{{ .webhook_url }}'
                  send_resolved: true
                  title: '{{ "{{" }} .Status | toUpper {{ "}}" }}'
                  message: |-
                    {{ "{{" }} range .Alerts {{ "}}" }}**[{{ "{{" }} .Labels.alertname {{ "}}" }}](https://alerts.kube.stevearnett.com/#/alerts?filter=%7Balertname%3D%22{{ "{{" }} .Labels.alertname {{ "}}" }}%22%7D)** [{{ "{{" }} .Labels.severity {{ "}}" }}]{{ "{{" }} if .Labels.namespace {{ "}}" }} · ns={{ "{{" }} .Labels.namespace {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} if .Labels.pod {{ "}}" }} · pod={{ "{{" }} .Labels.pod {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} if .Labels.instance {{ "}}" }} · {{ "{{" }} .Labels.instance {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} if .Labels.job {{ "}}" }} · job={{ "{{" }} .Labels.job {{ "}}" }}{{ "{{" }} end {{ "}}" }}
                    {{ "{{" }} .Annotations.summary {{ "}}" }}
                    {{ "{{" }} .Annotations.description {{ "}}" }}
                    {{ "{{" }} if .Labels.pod {{ "}}" }}[Pod](https://headlamp.kube.stevearnett.com/c/in-cluster/pods/{{ "{{" }} .Labels.namespace {{ "}}" }}/{{ "{{" }} .Labels.pod {{ "}}" }}) · {{ "{{" }} else if .Labels.node {{ "}}" }}[Node](https://headlamp.kube.stevearnett.com/c/in-cluster/nodes/{{ "{{" }} .Labels.node {{ "}}" }}) · {{ "{{" }} else if .Labels.deployment {{ "}}" }}[Deployment](https://headlamp.kube.stevearnett.com/c/in-cluster/deployments/{{ "{{" }} .Labels.namespace {{ "}}" }}/{{ "{{" }} .Labels.deployment {{ "}}" }}) · {{ "{{" }} else if .Labels.daemonset {{ "}}" }}[DaemonSet](https://headlamp.kube.stevearnett.com/c/in-cluster/daemonsets/{{ "{{" }} .Labels.namespace {{ "}}" }}/{{ "{{" }} .Labels.daemonset {{ "}}" }}) · {{ "{{" }} else if .Labels.statefulset {{ "}}" }}[StatefulSet](https://headlamp.kube.stevearnett.com/c/in-cluster/statefulsets/{{ "{{" }} .Labels.namespace {{ "}}" }}/{{ "{{" }} .Labels.statefulset {{ "}}" }}) · {{ "{{" }} else if .Labels.namespace {{ "}}" }}[Namespace](https://headlamp.kube.stevearnett.com/c/in-cluster/namespaces/{{ "{{" }} .Labels.namespace {{ "}}" }}) · {{ "{{" }} end {{ "}}" }}[Prometheus]({{ "{{" }} .GeneratorURL {{ "}}" }}){{ "{{" }} if .Annotations.runbook_url {{ "}}" }} · [Runbook]({{ "{{" }} .Annotations.runbook_url {{ "}}" }}){{ "{{" }} end {{ "}}" }}
                    {{ "{{" }} end {{ "}}" }}[Alertmanager](https://alerts.kube.stevearnett.com) · [Prometheus](https://prometheus.kube.stevearnett.com/alerts) · [Grafana](https://grafana.kube.stevearnett.com) · [Headlamp](https://headlamp.kube.stevearnett.com)
  data:
    - secretKey: webhook_url
      remoteRef:
        key: discord-alertmanager-webhook
        property: webhook-url
    - secretKey: ntfy_critical_url
      remoteRef:
        key: nfty-urls
        property: critical
