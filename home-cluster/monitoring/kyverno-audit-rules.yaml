apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyverno-audit-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack-prometheus
    app: kube-prometheus-stack-prometheus
spec:
  groups:
  - name: kyverno-audit
    rules:
    # Report-driven on purpose. The data comes from the ClusterPolicyReport objects
    # Kyverno writes for policies it evaluates in background scans, read by the
    # customResourceState block in kube-prometheus-stack-helmrelease.yaml - not from
    # Kyverno's /metrics endpoint. A background scan of a stored object is what fills a
    # report, so the rule cannot drift from what the report says. Both policies are
    # Enforce as of 2026-10-01; a report still records a stored object that violates
    # them even though new writes of that shape are now refused.
    #
    # A ClusterPolicyReport only exists while it holds at least one result, so this
    # resolves by itself when Kyverno rewrites the report with no failures.
    - alert: KyvernoAuditPolicyViolation
      expr: |
        kube_customresource_kyverno_policy_result{result=~"fail|error"} == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Kyverno policy: {{ $labels.policy }} reports {{ $labels.result }} on rule {{ $labels.rule }}"
        description: "ClusterPolicy {{ $labels.policy }} records a {{ $labels.result }} for rule {{ $labels.rule }} (report {{ $labels.policy_report }}, severity {{ $labels.severity }}, category {{ $labels.category }}). Reports come from background scans of stored objects, so a fail on an Enforce policy means an object already in the cluster violates it - the write that put it there was not necessarily blocked. Read the finding with kubectl get clusterpolicyreport {{ $labels.policy_report }} -o yaml. result=error means the rule could not be evaluated at all, so the policy is silently not covering whatever it matched."
