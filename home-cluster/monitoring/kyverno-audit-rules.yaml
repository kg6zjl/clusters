apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kyverno-audit-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus-stack-prometheus
    app: kube-prometheus-stack-prometheus
spec:
  groups:
  - name: kyverno-audit
    rules:
    # Report-driven on purpose. The data comes from the ClusterPolicyReport objects
    # Kyverno writes for Audit-mode policies, read by the customResourceState block in
    # kube-prometheus-stack-helmrelease.yaml - not from Kyverno's /metrics endpoint. An
    # Audit policy blocks nothing, so the report is the only record that a violation
    # happened, and a rule fed by the report cannot drift from what the report says.
    #
    # A ClusterPolicyReport only exists while it holds at least one result, so this
    # resolves by itself when Kyverno rewrites the report with no failures.
    - alert: KyvernoAuditPolicyViolation
      expr: |
        kube_customresource_kyverno_policy_result{result=~"fail|error"} == 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Kyverno audit: {{ $labels.policy }} reports {{ $labels.result }} on rule {{ $labels.rule }}"
        description: "ClusterPolicy {{ $labels.policy }} is in Audit mode: it blocked nothing, and its report ({{ $labels.policy_report }}, severity {{ $labels.severity }}, category {{ $labels.category }}) records a {{ $labels.result }} for rule {{ $labels.rule }}. Nothing was blocked and no workload was refused - read the finding with kubectl get clusterpolicyreport {{ $labels.policy_report }} -o yaml. result=error means the rule could not be evaluated at all, so the policy is silently not covering whatever it matched."
