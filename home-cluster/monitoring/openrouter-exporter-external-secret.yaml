apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-exporter-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: openrouter-exporter-secret
  data:
    - secretKey: api-key
      remoteRef:
        key: openrouter-api-key
        property: password