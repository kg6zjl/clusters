apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    # The name Grafana's admin.existingSecret already points at; any other target name leaves an
    # unmanaged secret in place that no 1Password rotation ever reaches.
    name: grafana-admin-secret
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-admin-password
        property: username
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: grafana-admin-password
        property: password

