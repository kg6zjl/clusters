apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-egress-exporter-script
  namespace: monitoring
data:
  exporter.py: |
    """Exposes the cluster's external egress address and the home WAN address as metrics.

    Both are read live at scrape time: the egress address from Cloudflare's trace
    endpoint (a literal IP, so measuring the exit path needs no DNS), and the home
    address by resolving the DDNS name that the NAS keeps current. Nothing here is
    committed to git, so the repository never carries the home address.
    """
    import http.server
    import os
    import socket
    import ssl
    import urllib.request

    PORT = int(os.environ.get("PORT", "9104"))
    TIMEOUT = float(os.environ.get("TIMEOUT_SECONDS", "10"))
    TRACE_URL = "https://1.1.1.1/cdn-cgi/trace"
    HOME_HOST = os.environ.get("HOME_HOST", "home.stevearnett.com")


    def egress_ip():
        ctx = ssl.create_default_context()
        req = urllib.request.Request(TRACE_URL, headers={"User-Agent": "cluster-egress-exporter"})
        with urllib.request.urlopen(req, timeout=TIMEOUT, context=ctx) as resp:
            body = resp.read().decode("utf-8", "replace")
        for line in body.splitlines():
            if line.startswith("ip="):
                return line[len("ip="):].strip() or None
        return None


    def home_ip():
        infos = socket.getaddrinfo(HOME_HOST, None, proto=socket.IPPROTO_TCP)
        addrs = sorted({i[4][0] for i in infos if i[0] == socket.AF_INET})
        return addrs[0] if addrs else None


    def render():
        lines = []
        try:
            ip = egress_ip()
            lines.append("cluster_egress_ok %d" % (1 if ip else 0))
            if ip:
                # Omitted rather than published as 0 on a failed poll: a missing series
                # reads as a gap, while a fabricated 0 is indistinguishable from a real
                # state change.
                lines.append('cluster_egress_ip{ip="%s"} 1' % ip)
        except Exception:
            lines.append("cluster_egress_ok 0")
        try:
            home = home_ip()
            lines.append("home_wan_ok %d" % (1 if home else 0))
            if home:
                lines.append('home_wan_ip{ip="%s"} 1' % home)
        except Exception:
            lines.append("home_wan_ok 0")
        return "\n".join(lines) + "\n"


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                body = b"ok\n"
            elif self.path == "/metrics":
                body = render().encode()
            else:
                self.send_error(404)
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass


    if __name__ == "__main__":
        http.server.ThreadingHTTPServer(("", PORT), Handler).serve_forever()
