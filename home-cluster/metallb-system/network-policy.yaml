apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metallb-allow-egress
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: 10.152.183.0/16
    - ipBlock:
        cidr: 192.168.1.0/24
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector: {}
  ingress:
  - from:
    - namespaceSelector: {}
