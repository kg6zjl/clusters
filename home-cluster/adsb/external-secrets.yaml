apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adsb-secrets
  namespace: adsb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: adsb-secrets
  data:
    - secretKey: LAT
      remoteRef:
        key: adsb
        property: latitude
    - secretKey: LONG
      remoteRef:
        key: adsb
        property: longitude
