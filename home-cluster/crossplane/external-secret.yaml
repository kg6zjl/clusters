apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossplane-github
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crossplane-github
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      # The provider parses this value as the Terraform GitHub provider's JSON credential blob,
      # not as a bare token — a raw PAT fails with "cannot unmarshal github credentials as JSON".
      # The owner is left out on purpose: the provider infers it from the token's account.
      data:
        credentials: '{"token":"{{ .token }}"}'
  data:
    - secretKey: token
      remoteRef:
        key: crossplane-github-webhooks
        property: token
---
# Discord's GitHub-compatible endpoint only parses the payload when the URL ends in /github,
# so the suffix is templated on rather than stored in 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-pull-requests-webhook
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: discord-pull-requests-webhook
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      # Normalizes either storage form: the suffix is stripped then re-added, so a URL
      # already ending in /github does not become /github/github.
      data:
        url: '{{ .url | replace "/github" "" }}/github'
  data:
    - secretKey: url
      remoteRef:
        key: discord-pull-requests-webhook
        property: webhook-url
