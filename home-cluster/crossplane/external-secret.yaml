apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crossplane-github
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: crossplane-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: crossplane-github-webhooks
        property: token
---
# Discord's GitHub-compatible endpoint only parses the payload when the URL ends in /github,
# so the suffix is templated on rather than stored in 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-pull-requests-webhook
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: discord-pull-requests-webhook
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "{{ .url }}/github"
  data:
    - secretKey: url
      remoteRef:
        key: discord-pull-requests-webhook
        property: webhook-url
