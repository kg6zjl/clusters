# NAS SMB backup: pushes the wildcard TLS cert to the NAS every 12 hours.
#
# This lives in the `traefik` namespace because that is where the secret is.
# The Certificate wildcard-stevearnett-com-tls is declared in
# home-cluster/traefik/certificate.yaml, and cert-manager writes the Secret it
# names into that same namespace. A Kubernetes Secret cannot be mounted across
# namespaces, and mounting a non-existent secret does not fail the pod - it
# leaves it in ContainerCreating indefinitely, which is precisely how this job
# sat dead for months while pointing at cert-manager.
#
# Reading the secret where it lives needs no RBAC grant, no kubectl and no API
# server at run time. Both secret volumes are optional and every input is
# checked, so a missing secret fails the Job loudly within seconds instead of
# hanging. Success is not just "smbclient exited 0": both files are read back off
# the NAS and compared byte for byte, so a run that cannot prove the share holds
# the current pair fails instead of reporting success. The private key is written
# only by smbclient, to the NAS, and to this container's own ephemeral /tmp for
# that comparison.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-wildcard-cert-to-nas
  namespace: traefik
spec:
  schedule: "0 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: wildcard-tls
              secret:
                secretName: wildcard-stevearnett-com-tls
                defaultMode: 0400
                optional: true
            - name: nas-creds
              secret:
                secretName: nas-smb-credentials
                optional: true
          containers:
            - name: push-to-nas
              image: alpine:3.24
              resources:
                requests:
                  memory: 64Mi
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  for f in /tls/tls.crt /tls/tls.key /creds/username /creds/password; do
                    [ -s "$f" ] || { echo "FATAL: $f missing or empty, refusing to upload" >&2; exit 1; }
                  done
                  grep -q 'BEGIN CERTIFICATE' /tls/tls.crt
                  grep -q 'PRIVATE KEY' /tls/tls.key
                  echo "pushing $(wc -c < /tls/tls.crt) byte certificate"
                  apk add --no-cache samba-client >/dev/null
                  smbclient //192.168.1.176/cert \
                    -W WORKGROUP -U "$(cat /creds/username)%$(cat /creds/password)" \
                    -c "put /tls/tls.crt cert.pem; put /tls/tls.key privkey.pem"
                  # An upload that "succeeded" against a full or read-only share
                  # would otherwise report success. Read both files back and
                  # compare them with what was sent.
                  mkdir -p /tmp/verify
                  smbclient //192.168.1.176/cert \
                    -W WORKGROUP -U "$(cat /creds/username)%$(cat /creds/password)" \
                    -c "get cert.pem /tmp/verify/cert.pem; get privkey.pem /tmp/verify/privkey.pem" >/dev/null
                  cmp -s /tls/tls.crt /tmp/verify/cert.pem || { echo "FATAL: NAS cert.pem does not match the cert that was sent" >&2; exit 1; }
                  cmp -s /tls/tls.key /tmp/verify/privkey.pem || { echo "FATAL: NAS privkey.pem does not match the key that was sent" >&2; exit 1; }
                  echo "verified: read back both files from the NAS and compared them byte for byte"
              volumeMounts:
                - name: wildcard-tls
                  mountPath: /tls
                  readOnly: true
                - name: nas-creds
                  mountPath: /creds
                  readOnly: true
