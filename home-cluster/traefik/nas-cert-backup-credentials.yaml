# NAS SMB credentials for backup-wildcard-cert-to-nas.
#
# Same 1Password items the meshtastic NAS backup uses, which is the pattern that
# already works in this repo. Values never enter git: only the paths.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-smb-credentials
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: nas-smb-credentials
  data:
    - secretKey: username
      remoteRef:
        key: certbot-username
        property: password
    - secretKey: password
      remoteRef:
        key: certbot-password
        property: password
