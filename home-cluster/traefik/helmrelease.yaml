apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 41.6.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    service:
      spec:
        type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.1.241
    ports:
      web:
        port: 8000
        exposedPort: 80
      websecure:
        port: 8443
        exposedPort: 443
      meshmonitor-tcp:
        port: 4404
        exposedPort: 4404
        protocol: TCP
        expose:
          default: true
      meshmonitor-4405:
        port: 4405
        exposedPort: 4405
        protocol: TCP
        expose:
          default: true
    ingressRoute:
      dashboard:
        enabled: true
    log:
      level: INFO
    accessLog:
      enabled: true
    providers:
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true
