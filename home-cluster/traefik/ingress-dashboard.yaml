apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    # traefik-proxy will not generate an endpoint without an explicit target
    # (IngressRoutes expose no LB status), so this host needs both annotations.
    external-dns.alpha.kubernetes.io/hostname: traefik.kube.stevearnett.com
    external-dns.alpha.kubernetes.io/target: kube.stevearnett.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.kube.stevearnett.com`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
