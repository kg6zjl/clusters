apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - network-policy.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
# No disableNameSuffixHash: the hash suffix makes kustomize rewrite the Deployment's reference, so
# editing settings.yaml or services.yaml rolls the pod instead of leaving it on the old config.
configMapGenerator:
  - name: homepage-config
    files:
      - settings.yaml
      - services.yaml
      - kubernetes.yaml
      - widgets.yaml
      - bookmarks.yaml
      - docker.yaml
      - custom.css
      - custom.js
