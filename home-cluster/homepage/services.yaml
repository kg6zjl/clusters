# href is what the browser opens (the published *.kube names). siteMonitor is what the pod polls for
# the status dot, and it goes to the in-cluster Service, not back out through Traefik - so every
# monitor has a matching egress rule in network-policy.yaml, and nothing here needs the internet.
- Media:
    - Sonarr:
        href: https://sonarr.kube.stevearnett.com
        siteMonitor: http://sonarr.media.svc.cluster.local:8989
        icon: sonarr.png
        description: TV
