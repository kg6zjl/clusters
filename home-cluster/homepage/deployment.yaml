apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      # Homepage runs as root by default; PUID/PGID below plus this block keep it non-root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # Homepage writes its own defaults into /app/config for every config file it does not find, so
      # that directory must be writable: mount a ConfigMap over it, or leave it unwritable, and init
      # fails. Which files it treats as required moves between releases (v2.4.0 wants proxmox.yaml,
      # absent from the docs' example), so shipping a fixed file list is a losing game. Seed a
      # writable directory instead and let the app fill in whatever its version demands.
      - name: seed-config
        image: ghcr.io/gethomepage/homepage:v2.4.0
        command:
        - sh
        - -c
        - cp -a /config-src/. /app/config/ || true
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: config-src
          mountPath: /config-src
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:v2.4.0
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        # Homepage refuses requests whose Host header is not listed. The pod-IP entry is what its own
        # Kubernetes example calls "required for the k8s probe"; the hostname is what the browser sends.
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "$(MY_POD_IP):3000,home.kube.stevearnett.com"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/New_York
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # Writable and only seeded, never mounted over: the app adds whatever config files its version
        # wants, plus its logs. Our files arrive from the init container.
        - name: config
          mountPath: /app/config
      volumes:
      # Content-hashed name, so editing any config file changes the hash and rolls the pod - the only
      # update path now that nothing is mounted with subPath.
      - name: config-src
        configMap:
          name: homepage-config
      - name: config
        emptyDir: {}
