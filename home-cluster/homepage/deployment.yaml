apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      # Homepage runs as root by default; PUID/PGID below plus this block keep it non-root. The
      # config is a read-only ConfigMap, so nothing here chowns or writes it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:v2.4.0
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        # Homepage refuses requests whose Host header is not listed. The pod-IP entry is what its own
        # Kubernetes example calls "required for the k8s probe"; the hostname is what the browser sends.
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "$(MY_POD_IP):3000,home.kube.stevearnett.com"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: America/New_York
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        # File by file, not the whole directory. Homepage copies its own defaults into /app/config for
        # anything not supplied, so that directory must stay writable: mounting the ConfigMap over it
        # made startup fail with EROFS while copying /app/src/skeleton/kubernetes.yaml.
        - name: config
          mountPath: /app/config/settings.yaml
          subPath: settings.yaml
          readOnly: true
        - name: config
          mountPath: /app/config/services.yaml
          subPath: services.yaml
          readOnly: true
        - name: config
          mountPath: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
          readOnly: true
        # The rest of Homepage's config set. Every file must exist, or the app tries to copy its
        # skeleton in - which needs a writable /app/config and fails with EACCES/EROFS.
        - name: config
          mountPath: /app/config/widgets.yaml
          subPath: widgets.yaml
          readOnly: true
        - name: config
          mountPath: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
          readOnly: true
        - name: config
          mountPath: /app/config/docker.yaml
          subPath: docker.yaml
          readOnly: true
        - name: config
          mountPath: /app/config/custom.css
          subPath: custom.css
          readOnly: true
        - name: config
          mountPath: /app/config/custom.js
          subPath: custom.js
          readOnly: true
        - name: config-logs
          mountPath: /app/config/logs
      volumes:
      - name: config
        configMap:
          name: homepage-config
      - name: config-logs
        emptyDir: {}
