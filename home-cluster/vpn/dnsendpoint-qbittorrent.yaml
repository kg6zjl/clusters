# qBittorrent is exposed by an IngressRoute, which external-dns cannot read (sources are
# service, ingress, crd), so the record is declared here instead of relying on the route's
# external-dns annotation.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: qbittorrent
  namespace: vpn
spec:
  endpoints:
  - dnsName: qb.kube.stevearnett.com
    recordType: CNAME
    targets:
    - kube.stevearnett.com
