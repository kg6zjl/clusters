apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: home-assistant
data:
  configuration.yaml: |
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.0.0.0/8
        - 192.168.1.0/24
    mobile_app:
    assist_pipeline:
    wemo:
      discovery: true
    history:
    prometheus:
      requires_auth: false
    homeassistant:
      time_zone: America/Los_Angeles
      customize:
        sensor.ugreen_dxp2800_d460_pool_1:
          hidden: false
        sensor.ugreen_xp2800_d460_pool_2:
          hidden: false
    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
    rest_command:
      beast_comfyui_start:
        url: "http://192.168.1.161:5000/systemd/comfyui.service/start"
        method: POST
      beast_comfyui_stop:
        url: "http://192.168.1.161:5000/systemd/comfyui.service/stop"
        method: POST
      beast_comfyui_restart:
        url: "http://192.168.1.161:5000/systemd/comfyui.service/restart"
        method: POST
      beast_llama_start:
        url: "http://192.168.1.161:5000/systemd/llama-server.service/start"
        method: POST
      beast_llama_stop:
        url: "http://192.168.1.161:5000/systemd/llama-server.service/stop"
        method: POST
      beast_llama_restart:
        url: "http://192.168.1.161:5000/systemd/llama-server.service/restart"
        method: POST
    sensor:
      - platform: rest
        name: Beast ComfyUI Status
        unique_id: beast_comfyui_status
        resource: http://192.168.1.161:8126/
        value_template: "{{ value_json.comfyui }}"
        scan_interval: 10
      - platform: rest
        name: Beast Llama Status
        unique_id: beast_llama_status
        resource: http://192.168.1.161:8126/
        value_template: "{{ value_json.llama }}"
        scan_interval: 10
    template:
      - switch:
          - name: Beast ComfyUI
            unique_id: beast_comfyui
            state: "{{ is_state('sensor.beast_comfyui_status', 'on') }}"
            turn_on:
              action: rest_command.beast_comfyui_start
            turn_off:
              action: rest_command.beast_comfyui_stop
          - name: Beast Llama
            unique_id: beast_llama
            state: "{{ is_state('sensor.beast_llama_status', 'on') }}"
            turn_on:
              action: rest_command.beast_llama_start
            turn_off:
              action: rest_command.beast_llama_stop
      - button:
          - name: Beast ComfyUI Restart
            unique_id: beast_comfyui_restart
            press:
              action: rest_command.beast_comfyui_restart
          - name: Beast Llama Restart
            unique_id: beast_llama_restart
            press:
              action: rest_command.beast_llama_restart
