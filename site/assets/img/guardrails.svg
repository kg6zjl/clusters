br />Egress is a short written list.</p></span></div></foreignObject></g></g><g class="node default control" id="dguardrailssvg-flowchart-admission-4" data-look="classic" transform="translate(252.0625, 508.25)"><rect class="basic label-container" style="fill:#121820 !important;stroke:#71b7ff !important;stroke-width:2px !important" x="-128" y="-92.75" width="256" height="185.5"/><g class="label" style="color:#e7edf3 !important" transform="translate(-100, -78.75)"><rect/><foreignObject width="200" height="157.5"><div style="color: rgb(231, 237, 243) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#e7edf3 !important" class="nodeLabel"><p>3. Admission<br />Kyverno policies on the agent's own identity,<br />so a merged pull request cannot widen it.</p></span></div></foreignObject></g></g><g class="node default control" id="dguardrailssvg-flowchart-secrets-6" data-look="classic" transform="translate(252.0625, 723.25)"><rect class="basic label-container" style="fill:#121820 !important;stroke:#71b7ff !important;stroke-width:2px !important" x="-128" y="-70.25" width="256" height="140.5"/><g class="label" style="color:#e7edf3 !important" transform="translate(-100, -56.25)"><rect/><foreignObject width="200" height="112.5"><div style="color: rgb(231, 237, 243) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#e7edf3 !important" class="nodeLabel"><p>4. Secrets<br />one path in, from a vault.<br />The agent has no path to any value.</p></span></div></foreignObject></g></g><g class="node default control" id="dguardrailssvg-flowchart-prgate-8" data-look="classic" transform="translate(252.0625, 927)"><rect class="basic label-container" style="fill:#121820 !important;stroke:#71b7ff !important;stroke-width:2px !important" 