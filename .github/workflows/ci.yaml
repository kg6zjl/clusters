name: CI Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - 'home-cluster/**'
      - 'renovate.json'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.githooks/**'

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint YAML files
        run: |
          # yamllint is installed into a shared path by the runner init container;
          # install only if this runs on a runner that lacks it.
          python3 -c "import yamllint" 2>/dev/null || pip install --quiet --break-system-packages yamllint
          python3 -m yamllint -c home-cluster/yamllint.yaml home-cluster/

  validate:
    name: Validate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Kustomize
        run: |
          # kubectl (with embedded kustomize) is installed by the runner init
          # container - no need to download a kustomize tarball every run.
          cd home-cluster
          kubectl kustomize . > /dev/null && echo "Kustomize: OK" || { echo "Kustomize: FAILED"; exit 1; }

  secrets:
    name: Secret Scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # TruffleHog needs the full history to walk base..head
          fetch-depth: 0

      - name: Scan PR commits for verified secrets
        run: |
          # trufflehog is installed by the runner init container (pin lives in
          # home-cluster/github-runners/runner-deployment.yaml). The upstream
          # trufflesecurity/trufflehog *action* is NOT used: it shells out to
          # `docker run`, and the runner pods have no docker daemon or socket.
          # --fail makes it exit non-zero (183) when it finds verified secrets,
          # so this check actually gates the PR.
          trufflehog git "file://$PWD" \
            --since-commit "${{ github.event.pull_request.base.sha }}" \
            --branch "${{ github.event.pull_request.head.sha }}" \
            --only-verified \
            --fail \
            --no-update

