name: CI Lint

# TEMP-ARC-BOOTSTRAP: these three jobs are pinned to `ubuntu-latest` instead of
# `self-hosted`, and MUST be reverted once ARC is healthy.
#
# Why: the self-hosted runners are provided by Actions Runner Controller, and ARC
# cannot register them because its GitHub App credentials had not been provisioned.
# So every required check sat `pending` forever, and `enforce_admins` is true on
# main, so an admin could not bypass them either. To land the fix that repairs ARC,
# this one merge has to run on GitHub-hosted runners. The repo is public, so those
# minutes are free.
#
# Revert: change all three `runs-on:` back to `self-hosted` and delete this block.
# Tracked for revert in the PR that follows the ARC fix.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'home-cluster/**'
      - 'renovate.json'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.githooks/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest  # TEMP-ARC-BOOTSTRAP: see note below
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: python3 -m yamllint -c home-cluster/yamllint.yaml home-cluster/

  validate:
    name: Validate
    runs-on: ubuntu-latest  # TEMP-ARC-BOOTSTRAP: see note below
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz | tar xz
          chmod +x kustomize
          mv kustomize /tmp/kustomize

      - name: Validate Kustomize
        run: |
          cd home-cluster
          /tmp/kustomize build . 2>&1 > /dev/null && echo "Kustomize: OK" || { echo "Kustomize: FAILED"; exit 1; }

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest  # TEMP-ARC-BOOTSTRAP: see note below
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: Check Trufflehog result
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ -n "$(git log --oneline ${{ github.event.repository.default_branch }}..HEAD)" ]; then
            echo "New commits found, TruffleHog scan is required"
            exit 1
          else
            echo "No new commits in PR, skipping TruffleHog"
          fi
