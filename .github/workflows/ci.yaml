name: CI Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - 'home-cluster/**'
      - 'node-config/**'
      - 'renovate.json'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.githooks/**'

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: python3 -m yamllint -c home-cluster/yamllint.yaml home-cluster/

  validate:
    name: Validate
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz | tar xz
          chmod +x kustomize
          mv kustomize /tmp/kustomize

      - name: Validate Kustomize
        run: |
          cd home-cluster
          /tmp/kustomize build . 2>&1 > /dev/null && echo "Kustomize: OK" || { echo "Kustomize: FAILED"; exit 1; }

  secrets:
    name: Secret Scan
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan this change with the node-local trufflehog
        # The old action passed base "main", which does not resolve in a local clone: trufflehog
        # errored, scanned 0 chunks, and the action still reported success. Pass explicit SHAs,
        # and refuse to pass unless the scan actually read commits.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          ARGS=(git "file://$PWD" --branch "$HEAD" --only-verified --fail)
          if printf '%s' "$BASE" | grep -qE '^[0-9a-f]{40}$'; then
            ARGS+=(--since-commit "$BASE")
          else
            echo "No usable base commit ($BASE) - scanning the full history of $HEAD"
          fi
          echo "trufflehog ${ARGS[*]}"
          /opt/hostedtoolcache/tools/trufflehog "${ARGS[@]}" 2>&1 | tee /tmp/trufflehog.log
          if ! grep -qE '"chunks": [1-9]' /tmp/trufflehog.log; then
            echo "::error::TruffleHog scanned 0 chunks - this gate would pass without scanning anything"
            exit 1
          fi
