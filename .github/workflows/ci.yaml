name: CI Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - 'home-cluster/**'
      - 'node-config/**'
      - 'renovate.json'
      - 'AGENTS.md'
      - '.github/workflows/**'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - '.githooks/**'
      - 'site/**'

env:
  # Single pin for the trufflehog CLI, shared by this workflow's fallback and the
  # runner-toolcache-warmer DaemonSet. Renovate keeps both in step (see customManagers in
  # renovate.json); a rename here breaks that, so keep the token intact.
  # renovate: datasource=github-releases depName=trufflesecurity/trufflehog
  TRUFFLEHOG_VERSION: "3.97.9"
  # Same shape for the Kyverno CLI, which the warmer now also caches: this workflow's fallback and
  # the DaemonSet both read this one pin, and the warmer stamps the binary with it so a cached CLI
  # from an older pin is a miss rather than a silently wrong policy schema.
  # renovate: datasource=github-releases depName=kyverno/kyverno
  KYVERNO_VERSION: "1.19.1"

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: python3 -m yamllint -c home-cluster/yamllint.yaml home-cluster/

  validate:
    name: Validate
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # check_config_json.py imports yaml. The Lint job gets PyYAML transitively via yamllint,
      # but this job installs only kustomize, so the import failed with ModuleNotFoundError once CI
      # ran on a clean ubuntu-latest toolcache. Declare it here rather than relying on that.
      - name: Install pyyaml
        run: pip install pyyaml

      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz | tar xz
          chmod +x kustomize
          mv kustomize /tmp/kustomize

      - name: Validate Kustomize
        # One build of the umbrella root covers all 42 component directories plus Flux's
        # own bootstrap. See home-cluster/flux-system/scripts/build_umbrella.sh for why
        # the umbrella and not a per-directory list, and why listing every directory also
        # catches cross-component collisions that per-root builds miss. The script is
        # shared with pre-commit so the local gate and this one cannot diverge.
        run: sh home-cluster/flux-system/scripts/build_umbrella.sh /tmp/kustomize

      - name: Check the component registry matches the umbrella root
        # The build above only covers what the umbrella lists, and the umbrella is
        # hand-maintained. This fails if the two have drifted in either direction, or if a
        # sync file nothing references, or if two Flux Kustomizations share a name - each a
        # registration that silently does nothing. A new component needs a sync file in
        # flux-system/syncs/ and an umbrella entry, or it is built by nobody.
        run: python3 home-cluster/flux-system/scripts/check_sync_coverage.py .

      - name: Check the registry config is strict JSON
        # zot refuses to start on a comment or trailing comma inside config.json, and
        # kustomize build cannot see it: a broken string is still valid YAML.
        run: python3 home-cluster/registry/scripts/check_config_json.py

  secrets:
    name: Secret Scan
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan this change with the node-local trufflehog
        # The old action passed base "main", which does not resolve in a local clone: trufflehog
        # errored, scanned 0 chunks, and the action still reported success. Pass explicit SHAs,
        # and refuse to pass unless the scan actually read commits.
        run: |
          set -euo pipefail
          REPO="$PWD"
          TH=/opt/hostedtoolcache/tools/trufflehog
          if [ ! -x "$TH" ]; then
            # Runner pods from a pre-warmup template have an empty cache; prefer a pinned,
            # checksum-verified local copy over the per-job image pull either way.
            echo "No cached trufflehog on this runner - fetching pinned copy"
            V="${TRUFFLEHOG_VERSION:?TRUFFLEHOG_VERSION is not set}"
            mkdir -p "$RUNNER_TEMP/th"
            cd "$RUNNER_TEMP/th"
            curl -sSfLO "https://github.com/trufflesecurity/trufflehog/releases/download/v${V}/trufflehog_${V}_linux_amd64.tar.gz"
            curl -sSfLO "https://github.com/trufflesecurity/trufflehog/releases/download/v${V}/trufflehog_${V}_checksums.txt"
            sha256sum -c --ignore-missing "trufflehog_${V}_checksums.txt"
            tar -xzf "trufflehog_${V}_linux_amd64.tar.gz" trufflehog
            TH="$RUNNER_TEMP/th/trufflehog"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          ARGS=(git "file://$REPO" --branch "$HEAD" --only-verified --fail)
          if printf '%s' "$BASE" | grep -qE '^[0-9a-f]{40}$'; then
            ARGS+=(--since-commit "$BASE")
          else
            echo "No usable base commit ($BASE) - scanning the full history of $HEAD"
          fi
          # --no-update: the node-local cache binary is root-owned in a root-owned directory, so
          # trufflehog's self-updater cannot replace it, fails the move and logFatals the whole
          # run - a required check dying for something unrelated to the diff. A secret gate has
          # no business fetching a newer release mid-scan anyway.
          echo "trufflehog --no-update ${ARGS[*]}"
          "$TH" --no-update "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/trufflehog.log"
          if ! grep -qE '"chunks": [1-9]' "$RUNNER_TEMP/trufflehog.log"; then
            echo "::error::TruffleHog scanned 0 chunks - this gate would pass without scanning anything"
            exit 1
          fi

  kyverno:
    name: Kyverno policy tests
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the pinned Kyverno CLI
        # `kyverno test` runs entirely offline - no cluster, no API server - so the
        # only thing this job needs is the binary. Pinned to the CLI whose version
        # matches the chart's appVersion (v1.19.1) so the policy schema validated in
        # CI is the one the cluster's controllers will apply. Checksum-verified
        # against the release's checksums.txt, the same shape as the trufflehog step.
        #
        # The node-local toolcache is preferred and is filled by the runner-toolcache-warmer
        # DaemonSet: this tarball is 53MB off a CDN that delivers ~300KB/s from this cluster,
        # which measured as 148s of this job's 157s. The version stamp the warmer writes
        # alongside the binary is what makes the pin enforceable here - testing the policy
        # schema against a CLI that is not the pinned one would quietly validate the wrong
        # thing, so a stale or mismatched cache is treated as a cache miss rather than used.
        run: |
          set -euo pipefail
          V="${KYVERNO_VERSION:?KYVERNO_VERSION is not set}"
          KY="/opt/hostedtoolcache/tools/kyverno"
          STAMP="/opt/hostedtoolcache/tools/.kyverno.version"
          if [ ! -x "$KY" ] || [ "$(cat "$STAMP" 2>/dev/null || true)" != "$V" ]; then
            if [ -x "$KY" ]; then
              echo "Cached kyverno is $(cat "$STAMP" 2>/dev/null || echo 'unversioned'), pin is ${V} - fetching the pinned copy"
            else
              echo "No cached kyverno on this runner - fetching pinned copy"
            fi
            mkdir -p "$RUNNER_TEMP/kyverno-cli"
            cd "$RUNNER_TEMP/kyverno-cli"
            curl -sSfLO "https://github.com/kyverno/kyverno/releases/download/v${V}/kyverno-cli_v${V}_linux_x86_64.tar.gz"
            curl -sSfLO "https://github.com/kyverno/kyverno/releases/download/v${V}/checksums.txt"
            sha256sum -c --ignore-missing checksums.txt
            tar -xzf "kyverno-cli_v${V}_linux_x86_64.tar.gz" kyverno
            KY="$RUNNER_TEMP/kyverno-cli/kyverno"
          else
            echo "Using cached kyverno ${V} from the node-local toolcache"
          fi
          "$KY" version
          echo "KYVERNO_CLI=$KY" >> "$GITHUB_ENV"

      - name: Run the Hermes-agent policies against the fixtures
        # --require-tests turns "the test files were not found" into a failure:
        # without it a mistyped path exits 0 and the gate is green while testing
        # nothing. The second run shares the folder and asserts the negative - a
        # different writer (Flux) is not blocked by the agent-scoped rules.
        run: |
          set -euo pipefail
          "$KYVERNO_CLI" test home-cluster/kyverno/tests --require-tests
          "$KYVERNO_CLI" test home-cluster/kyverno/tests -f kyverno-test-nonagent.yaml --require-tests

  notify:
    name: Notify failure
    # Only fires when something failed, and only on PRs - the case that currently arrives as
    # GitHub email. Posts to the same Discord channel Alertmanager and Flux already use.
    needs: [lint, validate, secrets, kyverno]
    if: ${{ always() && failure() }}
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this (ubuntu-latest = break-glass)
    timeout-minutes: 5
    steps:
      - name: Post failure to Discord
        run: |
          set -euo pipefail
          if [ -z "${CI_DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::CI_DISCORD_WEBHOOK is unset on this runner; no notification sent"
            exit 0
          fi
          # Branch names are attacker-adjacent text going into a JSON string: keep only
          # characters that cannot terminate it.
          BRANCH=$(printf '%s' '${{ github.head_ref }}' | tr -cd 'A-Za-z0-9._/-')
          FAILED=""
          [ "${{ needs.lint.result }}" = "failure" ] && FAILED="$FAILED lint"
          [ "${{ needs.validate.result }}" = "failure" ] && FAILED="$FAILED validate"
          [ "${{ needs.secrets.result }}" = "failure" ] && FAILED="$FAILED secret-scan"
          [ "${{ needs.kyverno.result }}" = "failure" ] && FAILED="$FAILED kyverno"
          [ -n "$FAILED" ] || FAILED=" unknown"
          printf '{"content": "**CI failed** `%s`: failed%s\\n%s"}' \
            "$BRANCH" "$FAILED" \
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            > "$RUNNER_TEMP/discord.json"
          curl -sS --fail --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/discord.json" "$CI_DISCORD_WEBHOOK" > /dev/null
          echo "failure notification sent"
