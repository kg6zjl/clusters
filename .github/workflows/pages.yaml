# Publishes the static site in site/ to GitHub Pages.
#
# There is no build step: the directory is hand-written HTML/CSS and is uploaded as-is.
# This workflow lives in the clusters repo because the agent cannot create a separate
# repository. It only triggers on changes under site/, so a broken site can never
# affect cluster reconciliation, which Flux drives from home-cluster/.
#
# ONE-TIME MANUAL STEP (repo admin, not the agent): in the repository settings,
# set Pages -> Build and deployment -> Source to "GitHub Actions". Until that is done
# this workflow will fail at the deploy step because the Pages site does not exist yet.
name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer commit supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
