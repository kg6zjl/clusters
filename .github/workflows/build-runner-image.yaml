# Builds the in-house runner image into the cluster registry.
#
# Kept out of ci.yaml on purpose: this produces the image the runners themselves run, so it has to be
# able to fail without blocking a pull request that has nothing to do with runners. main only, plus
# manual dispatch to get the first build out before any commit depends on it.
#
# Auth is the runner pod's own projected ServiceAccount token (audience "zot"), not a stored password:
# zot verifies it against the cluster's own OIDC issuer. runner-deployment.yaml mounts it at
# /var/run/secrets/registry.zot/token, and zot's policy allows that identity to create and update any
# repository.
name: Build runner image

on:
  push:
    branches: [main]
    paths:
      - home-cluster/github-runners/Dockerfile.optimized
      - home-cluster/github-runners/entrypoint.sh
      - .github/workflows/build-runner-image.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}  # CI_RUNNER repo variable overrides this
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the cluster registry
        run: |
          # The username must not contain a colon. Go's http.Request.BasicAuth() splits the Basic
          # value at the *first* colon, so -u system:serviceaccount:github-runners:github-runner
          # silently leaves zot with "serviceaccount:github-runners:github-runner:<JWT>" as the
          # password, and the JWT parse fails with "illegal base64 data at input byte 14" -- byte 14
          # is that colon. zot keys the identity off the token's `sub` claim, never off this username,
          # so any colon-free value is correct.
          docker login registry.kube.stevearnett.com \
            -u github-runner \
            --password-stdin < /var/run/secrets/registry.zot/token

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged by commit, never ":latest". A moving tag is the thing this change moves the runners
      # away from; the RunnerDeployment pins one of these by digest when it is flipped over.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: home-cluster/github-runners
          file: home-cluster/github-runners/Dockerfile.optimized
          push: true
          tags: registry.kube.stevearnett.com/github-runners/runner:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kg6zjl/clusters
            org.opencontainers.image.revision=${{ github.sha }}

      # Scans the runner image once per build, keyed to the digest that was just pushed -- which is
      # exactly what runner-deployment.yaml later pins. Replaces the operator scanning every runner
      # pod's clone three times over, which never finished inside its 5m deadline.
      #
      # The action and the CLI it installs are SHA-pinned, not tag-pinned: Aqua's own guidance says
      # to pin by commit since the March 2026 supply-chain incident, and v0.36.0 is the first release
      # after it. Renovate tracks the trailing version comment, so the pin stays current without
      # needing a loose tag.
      #
      # Registry auth: none configured here on purpose. The docker login step above already wrote the
      # projected token into ~/.docker/config.json, and Trivy falls back to that file (go-container-
      # registry's DefaultKeychain) when it is given no explicit credentials. Handing it the token
      # through TRIVY_PASSWORD instead would print a credential into the job log, since a projected
      # ServiceAccount token is not a GitHub secret and so is never auto-masked.
      #
      # Report-only on purpose (exit-code: 0). The base image is upstream and fat, so a HIGH or
      # CRITICAL that nobody upstream can fix would otherwise fail every build forever and freeze the
      # runner image on an old digest -- strictly worse than the alert this replaces. To gate on
      # findings, set exit-code: 1; do that once the current backlog is triaged.
      - name: Scan runner image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: registry.kube.stevearnett.com/github-runners/runner@${{ steps.build.outputs.digest }}
          format: table
          # Matches the cluster-side filter, so a finding here and a finding in-cluster agree on
          # what counts as reportable.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
