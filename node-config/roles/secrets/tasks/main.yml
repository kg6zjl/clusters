---
# Resolve secrets from 1Password via the op CLI. Lookups run on the controller,
# which is where the op binary and the 1Password session live - no
# delegate_to is involved or needed.
#
# SYNTAX GOTCHA: community.general.onepassword does NOT accept an
# "op://vault/item/field" secret reference as its lookup term. It passes the
# term straight through to `op item get <term>`, which only understands an
# item name, UUID, or domain. An op:// reference therefore fails with:
#   "op://vault/item/field" isn't an item. Specify the item with its UUID,
#   name, or domain.
# We keep op:// references in op_secrets because they are self-documenting,
# and split them here into the separate item/field/vault arguments the plugin
# actually requires.
#
# errors='warn' is deliberately NOT used anywhere below: it collapses every
# failure mode (not signed in / no such item / no such field) into a silent
# empty string that resurfaces many tasks later as a misleading
# "secret unresolved". A bad reference must fail here, naming the reference.

- name: "Validate 1Password reference format"
  ansible.builtin.assert:
    that:
      - (item.value | regex_replace('^op://', '') | trim | split('/')) | length == 3
      - (item.value | regex_replace('^op://', '') | trim | split('/'))[0] | length > 0
      - (item.value | regex_replace('^op://', '') | trim | split('/'))[1] | length > 0
      - (item.value | regex_replace('^op://', '') | trim | split('/'))[2] | length > 0
    fail_msg: >-
      '{{ item.value }}' is not a valid reference. Expected the form
      "op://<vault>/<item>/<field>".
    quiet: true
  loop: "{{ op_secrets | dict2items }}"
  when:
    - item.value | length > 0
    - lookup('env', 'SKIP_OP') | default('0') | int == 0

- name: "Resolve secrets from 1Password"
  ansible.builtin.set_fact:
    "{{ item.key }}": >-
      {{ lookup('community.general.onepassword',
                (item.value | regex_replace('^op://', '') | trim | split('/'))[1],
                field=(item.value | regex_replace('^op://', '') | trim | split('/'))[2],
                vault=(item.value | regex_replace('^op://', '') | trim | split('/'))[0]) }}
  loop: "{{ op_secrets | dict2items }}"
  when:
    - item.value | length > 0
    - lookup('env', 'SKIP_OP') | default('0') | int == 0
  no_log: true

- name: "Record which secrets resolved (booleans only; values are never logged)"
  ansible.builtin.set_fact:
    _secret_resolved: >-
      {{ _secret_resolved | default({}) | combine({item.key:
          (lookup('vars', item.key, default='') | default('', true) | length) > 0}) }}
  loop: "{{ op_secrets | dict2items }}"
  when:
    - item.value | length > 0
    - lookup('env', 'SKIP_OP') | default('0') | int == 0
  no_log: true

- name: "Confirm every declared secret resolved to a non-empty value"
  ansible.builtin.assert:
    that:
      - _secret_resolved.values() | select('equalto', false) | list | length == 0
    fail_msg: >-
      No value resolved for variable(s):
      {{ _secret_resolved | dict2items | selectattr('value', 'equalto', false)
         | map(attribute='key') | join(', ') }}.
      Their 1Password reference(s):
      {{ _secret_resolved | dict2items | selectattr('value', 'equalto', false)
         | map(attribute='key') | map('extract', op_secrets) | join(', ') }}.
      Check that the op CLI is authenticated ('op whoami') and that each
      item and field name exists.
    quiet: true
  when:
    - op_secrets | dict2items | selectattr('value', 'ne', '') | list | length > 0
    - lookup('env', 'SKIP_OP') | default('0') | int == 0
