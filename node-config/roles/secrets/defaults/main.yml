---
# Role: secrets - resolve third-party secrets from 1Password (op CLI)
# Auth: the playbook runs in YOUR shell => op resolves via the 1Password app
# + biometric. Never pass secrets inline. Lookup returns N/A if missing.
op_connect_vault: home-cluster

# Map of secret var -> 1Password item reference "op://<vault>/<item>/<field>"
op_secrets:
  nas_password: "op://home-cluster/nas-server/NAS password"