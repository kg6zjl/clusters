---
# Role: secrets - resolve third-party secrets from 1Password (op CLI)
# Auth: the playbook runs in YOUR shell => op resolves via the 1Password app
# + biometric. Never pass secrets inline.
# A reference that fails to resolve is FATAL - the role asserts on it rather
# than silently yielding an empty value. See roles/secrets/tasks/main.yml.
op_connect_vault: home-cluster

# Map of secret var -> 1Password item reference "op://<vault>/<item>/<field>"
# Item: nas-smb-credentials (SMB user is `plex`, matched by nas_user in
# roles/nas-mount/defaults/main.yml). Field names are the 1Password defaults.
op_secrets:
  nas_password: "op://home-cluster/nas-smb-credentials/password"
