---
- name: Install fuser (psmisc)
  ansible.builtin.apt:
    name: psmisc
    state: present

- name: Install the CSI mount janitor
  ansible.builtin.template:
    src: kubelet-csi-mount-janitor.sh.j2
    dest: /usr/local/sbin/kubelet-csi-mount-janitor.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the janitor unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - kubelet-csi-mount-janitor.service
    - kubelet-csi-mount-janitor.timer

- name: Enable the janitor timer
  ansible.builtin.systemd_service:
    name: kubelet-csi-mount-janitor.timer
    enabled: true
    state: started
    daemon_reload: true
